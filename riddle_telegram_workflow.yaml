workflow:
  name: 'riddle-to-telegram'
  description: 'Generate a creative riddle using LLM and send it via Telegram'

graph:
  nodes:
    - id: 'start'
      type: 'start'
      data:
        title: 'Riddle Generator & Telegram Sender'
        description: 'Generate an engaging riddle and share it via Telegram'

    - id: 'generate_riddle'
      type: 'llm'
      data:
        title: 'Generate Creative Riddle'
        model:
          name: 'gpt-4'
        prompt: 'Create a clever and engaging riddle. Make it challenging but solvable. Include both the riddle question and the answer at the end. Format it nicely with clear separation between the riddle and answer. Keep it family-friendly and fun!'

    - id: 'format_telegram_message'
      type: 'variable-assignment'
      data:
        title: 'Format Riddle for Telegram'
        description: 'Create a nicely formatted Telegram message with the riddle'
        variable: 'telegram_message'
        assignment_type: 'constant'
        value: |
          🧩 <b>Daily Riddle Challenge</b> 🧩

          ${llm_content}

          🤔 Can you solve it? Share your answer!

          🤖 Generated by flowsh AI workflow

    - id: 'send_to_telegram'
      type: 'telegram'
      data:
        title: 'Send Riddle via Telegram'
        description: 'Deliver the riddle to Telegram using environment variables'
        message: '${telegram_message}'
        parse_mode: 'HTML'
        max_retries: 3

    - id: 'completion_notice'
      type: 'answer'
      data:
        title: 'Riddle Successfully Sent!'
        description: 'The riddle workflow completed successfully'
        answer: |
          # 🧩 Riddle Generation & Telegram Delivery Complete!

          ## 📋 Summary
          - **LLM Generation**: ✅ Creative riddle generated
          - **Telegram Delivery**: ✅ Message sent successfully
          - **Bot Integration**: Used environment variables for authentication

          ## 🚀 Workflow Features Demonstrated
          - **Two-stage LLM fallback**: OpenAI → LLMv7 → demo
          - **Standard variable passing**: ${llm_content} → telegram message
          - **Real Telegram integration**: Using TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID
          - **Rich formatting**: Markdown support with emojis
          - **Error handling**: Retry logic for reliable delivery

          ## ✨ Your Generated Riddle
          ${llm_content}

          🎉 The riddle has been successfully sent to your Telegram chat!

  edges:
    - source: 'start'
      target: 'generate_riddle'

    - source: 'generate_riddle'
      target: 'format_telegram_message'

    - source: 'format_telegram_message'
      target: 'send_to_telegram'

    - source: 'send_to_telegram'
      target: 'completion_notice'
