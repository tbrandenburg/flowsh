workflow:
  name: 'OpenCode Essay Test - Research Only'
  description: 'Test just research phase with corrected design'

conversation_variables:
  - variable: user_topic
    name: Essay Topic
    type: text-input
    description: What should the essay be about?
    required: true
  - variable: max_parts
    name: Content Sections
    type: select
    default: '2'

graph:
  nodes:
    - id: start
      type: start

    - id: setup_workspace
      type: code
      data:
        title: 'Setup Workspace'
        command: '/bin/bash'
        args:
          - '-c'
          - |
            work_dir="/tmp/flowsh_essay_test"
            rm -rf "$work_dir" && mkdir -p "$work_dir"

            echo "export work_dir=\"$work_dir\"" > "$work_dir/env.sh"
            echo "export topic=\"{{user_topic}}\"" >> "$work_dir/env.sh"
            echo "export max_parts=\"{{max_parts}}\"" >> "$work_dir/env.sh"

            echo "✅ Workspace: $work_dir"
            echo "📝 Topic: {{user_topic}}"

    - id: research_agent
      type: agent
      data:
        title: 'Research Agent'
        command: 'opencode'
        args: ['run']
        timeout: 120
        prompt_template:
          type: prompt
          source: inline
          content: |
            Research topic: "The Future of AI in Software Testing"

            Tasks:
            1. Conduct web research on this topic
            2. Create 2 section plans
            3. Save files to /tmp/flowsh_essay_test/

            Required files:
            - /tmp/flowsh_essay_test/research_summary.md (research findings, 200 words)
            - /tmp/flowsh_essay_test/section_1.md (first section plan)
            - /tmp/flowsh_essay_test/section_2.md (second section plan)

            Each section file should have:
            - Section title
            - 3-4 key points
            - Target word count: 300 words

    - id: verify_output
      type: code
      data:
        title: 'Verify Research Files'
        command: '/bin/bash'
        args:
          - '-c'
          - |
            echo "🔍 Checking research output..."
            ls -la /tmp/flowsh_essay_test/

            for file in research_summary.md section_1.md section_2.md; do
              if [[ -f "/tmp/flowsh_essay_test/$file" ]]; then
                echo "✅ Found: $file"
                echo "   Size: $(wc -w < /tmp/flowsh_essay_test/$file) words"
              else
                echo "❌ Missing: $file"
              fi
            done

    - id: end
      type: end

  edges:
    - source: start
      target: setup_workspace
    - source: setup_workspace
      target: research_agent
    - source: research_agent
      target: verify_output
    - source: verify_output
      target: end
