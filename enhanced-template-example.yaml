# Enhanced Template with Skill Integration

# Template: llm-to-telegram.yaml
# Skill-Enhanced Intelligent Template

metadata:
  # Template Information
  category: 'ai-messaging'
  difficulty: 'beginner'
  success_rate: 94
  average_completion_time: '3 minutes'

  # Skill Integration
  recommended_skill: 'flowsh-workflow-intelligence'
  intent_keywords:
    ['generate content', 'send message', 'ai text', 'telegram bot', 'content automation']

  # Intelligence Metadata
  variable_flow:
    inputs: ['content_type', 'topic']
    outputs: ['llm_content', 'formatted_message', 'telegram_success']
    critical_path: ['generate_content', 'format_message', 'send_telegram']

  # Anti-Pattern Prevention
  common_mistakes:
    - 'referencing node IDs instead of variable names'
    - 'missing environment variables for API keys'
    - 'incorrect execution order'

  # Context Adaptation
  customization_points:
    - name: 'content_type'
      description: 'Type of content to generate'
      examples: ['riddle', 'joke', 'summary', 'news update']
    - name: 'llm_model'
      description: 'AI model selection'
      options: ['gpt-4', 'claude-3-5-sonnet-20241022']
      default: 'gpt-4'
    - name: 'message_format'
      description: 'Telegram message format'
      options: ['HTML', 'Markdown']
      recommended: 'HTML'

  # Success Prediction
  requirements:
    environment_variables:
      - name: 'OPENAI_API_KEY'
        required: true
        fallback: 'llm_v7 API (no key required)'
      - name: 'TELEGRAM_BOT_TOKEN'
        required: true
        how_to_get: 'Create bot with @BotFather on Telegram'
      - name: 'TELEGRAM_CHAT_ID'
        required: true
        how_to_get: 'Send /start to your bot, check webhook logs'

# Working YAML Template (skill-enhanced)
workflow:
  name: 'AI Content to Telegram'
  description: 'Generate AI content and send to Telegram with fallbacks'

variables:
  content_type: 'riddle' # Customization point
  topic: 'space exploration' # Customization point

nodes:
  - id: generate_content
    type: llm
    model: 'gpt-4' # Skill: provides model selection guidance
    prompt: 'Create a {{content_type}} about {{topic}}' # Skill: explains variable substitution
    api_key_env: 'OPENAI_API_KEY' # Skill: explains environment variable pattern
    fallback_api: 'llm_v7' # Skill: explains fallback strategy
    # Skill teaches: Creates llm_content, llm_success, llm_error

  - id: format_message
    type: template_transform
    template: "<b>{{content_type}}:</b>\n\n{{llm_content}}" # Skill: explains HTML formatting
    output_variable: 'formatted_message' # Skill: explains custom variable creation

  - id: send_telegram
    type: telegram
    bot_token_env: 'TELEGRAM_BOT_TOKEN' # Skill: explains bot setup
    chat_id_env: 'TELEGRAM_CHAT_ID' # Skill: explains chat ID discovery
    message: '{{formatted_message}}' # Skill: explains variable reference
    format: 'HTML' # Skill: explains format choice (HTML vs Markdown)
    # Skill teaches: Creates telegram_success, telegram_error

# Skill-Provided Guidance (not in template file, but available when skill is loaded)
# - Why this pattern works: Variable flow from llm_content → formatted_message → telegram delivery
# - How to customize: Change content_type/topic variables, adjust prompt, modify formatting
# - How to debug: Check environment variables, verify variable references, test APIs individually
# - When to use: Any "generate + send" workflow with AI content creation
# - What can go wrong: Missing env vars, incorrect variable names, API rate limits
