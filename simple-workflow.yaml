workflow:
  name: "Simple Agent Workflow"
  description: "Basic example of agent orchestration"
  
environment_variables:
  - variable: "task_description"
    name: "Task Description"
    type: "text"
    description: "What you want the agent to do"

graph:
  nodes:
    - id: "start"
      type: "start"
      data:
        title: "Start"
    
    - id: "agent_task"
      type: "agent"
      data:
        title: "Execute Task"
        command: "opencode"
        args: ["run"]
        prompt_template:
          type: "prompt"
          source: "inline"
          content: "Please help with: {{task_description}}"
    
    - id: "result"
      type: "answer"
      data:
        title: "Result"
        answer: "Task completed successfully"

  edges:
    - source: "start"
      target: "agent_task"
    - source: "agent_task" 
      target: "result"