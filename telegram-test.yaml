version: '1.0'
kind: Workflow
metadata:
  name: telegram-test-simple
  description: 'Simple test of Telegram node'

graph:
  nodes:
    - id: 'start'
      type: 'start'
      data:
        title: 'Start'

    - id: 'send_test_message'
      type: 'telegram'
      data:
        title: 'Test Message'
        message: 'Hello! This is a test message from the new Telegram node implementation.'
        parse_mode: 'HTML'
        max_retries: 3

    - id: 'end'
      type: 'answer'
      data:
        title: 'Complete'
        answer: 'Telegram test completed successfully!'

  edges:
    - source: 'start'
      target: 'send_test_message'
    - source: 'send_test_message'
      target: 'end'
