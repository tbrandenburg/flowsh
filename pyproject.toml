[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "flowsh"
version = "0.1.0"
description = "Generate Bash harness scripts from MADE workflow YAML files."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6,<7",
  "pydantic>=2,<3",
]

[project.scripts]
flowsh = "scripts.workflow_to_harness:main"

[dependency-groups]
dev = [
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
