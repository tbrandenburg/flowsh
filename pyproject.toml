[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"

[project]
name = "flowsh-cli"
version = "0.7.2"
description = "Generate Bash harness scripts from workflow YAML files."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "PyYAML>=6,<7",
  "pydantic>=2,<3",
  "typer>=0.20,<0.21",
]

[project.urls]
Homepage = "https://github.com/tbrandenburg/flowsh"
Source = "https://github.com/tbrandenburg/flowsh"

[project.scripts]
flowsh-cli = "flowsh_cli.cli:main"

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff>=0.14,<0.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/test_workflow_to_harness.py" = ["E501"]
