[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"

[project]
name = "flowsh"
version = "0.1.0"
description = "Generate Bash harness scripts from MADE workflow YAML files."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6,<7",
  "pydantic>=2,<3",
  "typer>=0.20,<0.21",
]

[project.scripts]
flowsh = "flowsh.cli:main"

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff>=0.14,<0.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
