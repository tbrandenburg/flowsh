workflow:
  name: 'test-telegram-simple'
  description: 'Test Telegram workflow with hardcoded values'

graph:
  nodes:
    - id: 'start'
      type: 'start'
      data:
        title: 'Start'

    - id: 'generate_poem'
      type: 'llm'
      data:
        title: 'Generate Poem'
        model:
          name: 'gpt-4'
        prompt: 'Write a short free verse poem about artificial intelligence and creativity. Keep it under 8 lines.'

    - id: 'format_message'
      type: 'variable-assignment'
      data:
        title: 'Format Message'
        variable: 'telegram_message'
        assignment_type: 'constant'
        value: |
          🤖 AI Creativity Poem 🎨

          ${llm_content}

          ✨ Generated by flowsh workflow

    - id: 'mock_send'
      type: 'code'
      data:
        title: 'Mock Telegram Send'
        command: 'echo'
        args: ['📱 Telegram message ready:', '${telegram_message}']

  edges:
    - source: 'start'
      target: 'generate_poem'
    - source: 'generate_poem'
      target: 'format_message'
    - source: 'format_message'
      target: 'mock_send'
