name: Core - Reusable OpenCode Run

on:
  workflow_call:
    inputs:
      run-name:
        description: 'Name of the run (e.g., security, safety, performance)'
        required: true
        type: string
      prompt:
        description: 'The prompt content to use for the run (mutually exclusive with prompt-file)'
        required: false
        type: string
      prompt-file:
        description: 'Path to the prompt file (e.g., .github/prompts/security.prompt.md) (mutually exclusive with prompt)'
        required: false
        type: string
      timeout-minutes:
        description: 'Timeout for the run job in minutes'
        required: false
        type: number
        default: 120
      model:
        description: 'OpenCode model to use for the run'
        required: false
        type: string
        default: 'opencode/big-pickle'
      agent:
        description: 'Agent to use for OpenCode run'
        required: false
        type: string
        default: 'build'
      command:
        description: 'Command to use for OpenCode run (alternative to prompt/prompt-file)'
        required: false
        type: string
      runner:
        description: 'Runner to use for the job'
        required: false
        type: string
        default: 'ubuntu-latest'
    outputs:
      results:
        description: 'The output results from OpenCode (truncated if too large)'
        value: ${{ jobs.run.outputs.results }}
      results-truncated:
        description: 'Whether the results were truncated due to size'
        value: ${{ jobs.run.outputs.results-truncated }}
      artifact-name:
        description: 'Name of the uploaded artifact containing full results'
        value: ${{ jobs.run.outputs.artifact-name }}

jobs:
  run:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      results: ${{ steps.process-results.outputs.results }}
      results-truncated: ${{ steps.process-results.outputs.results-truncated }}
      artifact-name: ${{ steps.process-results.outputs.artifact-name }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Setup and Install OpenCode
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64)
              asset=opencode-linux-x64.tar.gz
              checksum=d5314507b964bc98b52c8117a0b9d2cb0190eae04fb334bf5448762a5042968d
              ;;
            Linux-aarch64)
              asset=opencode-linux-arm64.tar.gz
              checksum=2a6d0853e2c66ab913386f4598b5251e629070a098e08c8582ec4f55636b2542
              ;;
            *) echo 'Unsupported runner: use Linux x64 or arm64' >&2; exit 1 ;;
          esac
          download=$(mktemp -d)
          trap 'rm -rf "$download"' EXIT
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 15 --max-time 180 \
            "https://github.com/anomalyco/opencode/releases/download/v1.14.40/$asset" -o "$download/$asset"
          printf '%s  %s\n' "$checksum" "$download/$asset" | sha256sum --check --strict
          tar -xzf "$download/$asset" -C "$download"
          mkdir -p "$HOME/.opencode/bin"
          install -m 755 "$download/opencode" "$HOME/.opencode/bin/opencode"
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          env -i PATH="$HOME/.opencode/bin:$PATH" HOME="$HOME" opencode --version

      - name: Run OpenCode ${{ inputs.run-name }}
        shell: bash
        env:
          RUN_NAME: ${{ inputs.run-name }}
          PROMPT: ${{ inputs.prompt }}
          PROMPT_FILE: ${{ inputs.prompt-file }}
          COMMAND: ${{ inputs.command }}
          MODEL: ${{ inputs.model }}
          AGENT: ${{ inputs.agent }}
        run: |
          set -euo pipefail
          if [[ ! "$RUN_NAME" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_-]*$ ]]; then
            echo 'Invalid run-name' >&2
            exit 1
          fi
          if [[ -n "$PROMPT" && -n "$PROMPT_FILE" ]]; then
            echo 'Use prompt or prompt-file, not both' >&2
            exit 1
          fi
          if [[ -n "$PROMPT_FILE" ]]; then
            PROMPT=$(cat -- "$PROMPT_FILE")
          fi
          if [[ -z "$COMMAND" && -z "$PROMPT" ]]; then
            echo 'Provide a command or prompt' >&2
            exit 1
          fi
          args=(run --model "$MODEL" --agent "$AGENT")
          if [[ -n "$COMMAND" ]]; then
            args+=(--command "$COMMAND")
          fi
          if [[ -n "$PROMPT" ]]; then
            args+=(-- "$PROMPT")
          fi
          env -i PATH="$HOME/.opencode/bin:$PATH" HOME="$HOME" GH_TOKEN="$GH_TOKEN" \
            opencode "${args[@]}" > "$RUN_NAME-results.txt"

      - name: Process results for output
        id: process-results
        if: always()
        shell: bash
        env:
          RUN_NAME: ${{ inputs.run-name }}
        run: |
          set -euo pipefail
          if [[ ! "$RUN_NAME" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_-]*$ ]]; then
            echo 'Invalid run-name' >&2
            exit 1
          fi
          RESULTS_FILE="$RUN_NAME-results.txt"
          ARTIFACT_NAME="$RUN_NAME-results"
          delimiter=$(openssl rand -hex 32)
          if [[ ! -f "$RESULTS_FILE" ]]; then
            {
              echo 'results-truncated=false'
              echo 'results=❌ No results file generated'
              printf 'artifact-name=%s\n' "$ARTIFACT_NAME"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILE_SIZE=$(wc -c < "$RESULTS_FILE")
          MAX_SIZE=65000
          {
            printf 'artifact-name=%s\n' "$ARTIFACT_NAME"
            if (( FILE_SIZE > MAX_SIZE )); then
              echo 'results-truncated=true'
              printf 'results<<%s\n' "$delimiter"
              printf '# OpenCode Results (Truncated)\n\n'
              python3 -c 'import sys; sys.stdout.write(sys.stdin.buffer.read(int(sys.argv[1])).decode("utf-8", errors="ignore"))' \
                "$((MAX_SIZE - 1000))" < "$RESULTS_FILE"
              printf '\n\nFull results available in artifact: %s\n' "$ARTIFACT_NAME"
            else
              echo 'results-truncated=false'
              printf 'results<<%s\n' "$delimiter"
              cat "$RESULTS_FILE"
            fi
            printf '\n%s\n' "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Upload ${{ inputs.run-name }} Results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ${{ inputs.run-name }}-results
          path: ${{ inputs.run-name }}-results.txt
