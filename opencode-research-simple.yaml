workflow:
  name: 'Simple OpenCode Research Test'
  description: 'Test OpenCode research capabilities with longer timeout'

graph:
  nodes:
    - id: start
      type: start
      data:
        title: 'OpenCode Research Test'
        description: 'Testing AI research capabilities'

    - id: validate_opencode
      type: code
      data:
        title: 'Validate OpenCode'
        description: 'Check if OpenCode is available'
        command: '/bin/bash'
        args:
          - '-c'
          - |
            if command -v opencode &> /dev/null; then
              echo "✅ OpenCode available at: $(which opencode)"
            else
              echo "❌ OpenCode not found in PATH"
              exit 1
            fi

    - id: research_test
      type: agent
      data:
        title: 'OpenCode Research Test'
        description: 'Test research capabilities'
        command: 'opencode'
        args: ['run']
        timeout: 120
        prompt_template:
          type: prompt
          source: inline
          content: |
            Conduct a quick research on "AI coding assistants in 2025" and create a brief summary.

            Your tasks:
            1. Search for recent information about AI coding tools
            2. Create a concise summary (100-200 words)
            3. Include 2-3 key points about the current state

            Output just the summary in plain text format.

    - id: show_results
      type: code
      data:
        title: 'Show Research Results'
        description: 'Display the research output'
        command: '/bin/bash'
        args:
          - '-c'
          - |
            echo "🔬 OpenCode Research Results:"
            echo "=========================="
            echo "$AGENT_OUTPUT"
            echo "=========================="
            echo "✅ Research completed successfully!"

    - id: end
      type: end
      data:
        title: 'Complete'
        description: 'Research test completed'

  edges:
    - source: start
      target: validate_opencode
    - source: validate_opencode
      target: research_test
    - source: research_test
      target: show_results
    - source: show_results
      target: end
