workflow:
  name: 'OpenCode Essay Research Test'
  description: 'Test just the research phase with proper timeout'

conversation_variables:
  - variable: user_topic
    name: Essay Topic
    type: text-input
    description: What should the essay be about?
    required: true
  - variable: max_parts
    name: Content Sections
    type: select
    description: How many content sections to create?
    options:
      - value: '2'
        label: '2 sections'
    default: '2'

graph:
  nodes:
    - id: start
      type: start
      data:
        title: 'Essay Research Test'
        description: 'Testing OpenCode research phase only'

    - id: validate_env
      type: code
      data:
        title: 'Validate Environment'
        description: 'Check basic environment'
        command: '/bin/bash'
        args:
          - '-c'
          - |
            echo "🔍 Starting research test..."
            echo "Topic: $user_topic"
            echo "Sections: $max_parts"
            echo "✅ Environment ready"

    - id: research_planner
      type: agent
      data:
        title: 'Research & Planning Agent'
        command: 'opencode'
        args: ['run']
        timeout: 180
        prompt_template:
          type: prompt
          source: inline
          content: |
            You are a research and planning specialist.

            Topic: {{user_topic}}

            Tasks:
            1. Research the topic using web search capabilities  
            2. Create {{max_parts}} focused content sections
            3. For each section, create a brief planning document with:
               - Key research points (2-3 main findings)
               - Target word count and structure
            4. Save each section plan as a separate file: section_1_plan.md, section_2_plan.md
            5. Create a brief summary of your research findings

            Keep this concise but informative. Focus on current, relevant information.

    - id: show_research_results
      type: code
      data:
        title: 'Show Research Results'
        description: 'Display research output and check files'
        command: '/bin/bash'
        args:
          - '-c'
          - |
            echo "🔬 Research Completed Successfully!"
            echo "=================================="
            echo "Files created:"
            ls -la *.md 2>/dev/null || echo "No .md files found"
            echo "=================================="
            echo "✅ Research phase validation complete"

    - id: end
      type: end
      data:
        title: 'Complete'
        description: 'Research test completed'

  edges:
    - source: start
      target: validate_env
    - source: validate_env
      target: research_planner
    - source: research_planner
      target: show_research_results
    - source: show_research_results
      target: end
