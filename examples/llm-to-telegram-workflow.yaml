version: '1.0'
kind: Workflow
metadata:
  name: llm-to-telegram-workflow
  description: 'Demonstrates LLM→Variable Assignment→Telegram workflow with proper variable substitution'
  version: '1.0'

workflow:
  name: 'LLM to Telegram Workflow'
  description: 'Complete example showing AI-generated content being sent to Telegram with proper variable substitution'

environment_variables:
  - variable: 'openai_api_key'
    name: 'OpenAI API Key'
    type: 'text'
    description: 'API key for OpenAI GPT models'
  - variable: 'telegram_bot_token'
    name: 'Telegram Bot Token'
    type: 'text'
    description: 'Bot token from @BotFather'
  - variable: 'telegram_chat_id'
    name: 'Telegram Chat ID'
    type: 'text'
    description: 'Chat ID to send messages to'

graph:
  nodes:
    - id: 'start'
      type: 'start'
      data:
        title: 'Content Request Input'
        description: 'Collect parameters for AI content generation and Telegram delivery'
        variables:
          - variable: 'content_type'
            type: 'select'
            label: 'Content Type'
            description: 'What type of content should the AI generate?'
            options: ['joke', 'riddle', 'fact', 'story', 'quote']
            default: 'riddle'
            required: true
          - variable: 'difficulty_level'
            type: 'select'
            label: 'Difficulty Level'
            description: 'How challenging should the content be?'
            options: ['easy', 'medium', 'hard']
            default: 'medium'
            required: true
          - variable: 'audience'
            type: 'select'
            label: 'Target Audience'
            description: 'Who is this content for?'
            options: ['children', 'adults', 'professionals']
            default: 'adults'
            required: true

    # Step 1: Generate content using LLM with proper prompt_template structure
    - id: 'generate_content'
      type: 'llm'
      data:
        title: 'AI Content Generation'
        description: 'Generate content using OpenAI GPT with role-based prompt template'
        model:
          provider: 'openai'
          name: 'gpt-3.5-turbo'
          mode: 'chat'
          completion_params:
            temperature: 0.8
            max_tokens: 200
            top_p: 0.9
        # IMPORTANT: This prompt_template structure demonstrates the correct format
        # that our fixed LLM generator now properly supports
        prompt_template:
          - role: 'system'
            text: |
              You are a creative content generator. Create engaging content based on user specifications.

              Guidelines:
              - Keep content appropriate for the target audience
              - Match the requested difficulty level
              - Be creative and entertaining
              - For riddles: Include both the riddle and answer
              - For jokes: Make them family-friendly
              - For facts: Make them interesting and surprising
              - For stories: Keep them brief but engaging
              - For quotes: Make them inspirational
          - role: 'user'
            text: |
              Generate a ${content_type} with the following specifications:
              - Difficulty: ${difficulty_level}
              - Audience: ${audience}

              Please provide the content in a format suitable for sharing on Telegram.
              If it's a riddle, include both the question and answer.

    # Step 2: Format the generated content for Telegram
    # This demonstrates TEMPLATE VARIABLE SUBSTITUTION - the key fix we implemented
    - id: 'format_telegram_message'
      type: 'variable-assignment'
      data:
        title: 'Format Message for Telegram'
        description: 'Format the AI-generated content into a Telegram-ready message with proper variable substitution'
        variable: 'telegram_message'
        assignment_type: 'constant'
        # CRITICAL: This line demonstrates the bug we fixed
        # Before fix: ${llm_content} would appear literally in Telegram
        # After fix: ${llm_content} gets properly substituted with actual AI-generated content
        value: "🤖 **AI Generated ${content_type}**\n\n**Difficulty**: ${difficulty_level}\n**Audience**: ${audience}\n\n📝 **Content**:\n${llm_content}\n\n---\n✨ Generated by flowsh AI Workflow"

    # Step 3: Send formatted message to Telegram
    - id: 'send_to_telegram'
      type: 'telegram'
      data:
        title: 'Send Content to Telegram'
        description: 'Deliver the formatted AI content to Telegram chat'
        chat_id: '${telegram_chat_id}'
        # This also demonstrates variable substitution working properly
        message: '${telegram_message}'
        parse_mode: 'Markdown'
        disable_web_page_preview: true

    # Step 4: Log the successful operation
    - id: 'log_activity'
      type: 'variable-assignment'
      data:
        title: 'Log Workflow Activity'
        description: 'Create an activity log entry for monitoring'
        variable: 'activity_log'
        assignment_type: 'expression'
        expression: 'echo "$(date) - Successfully generated and sent ${content_type} (${difficulty_level}) to Telegram chat ${telegram_chat_id}"'

    # Step 5: Provide workflow completion summary
    - id: 'workflow_complete'
      type: 'answer'
      data:
        title: 'LLM→Telegram Workflow Complete'
        description: 'Summary of the successful AI content generation and delivery'
        answer: |
          # ✅ LLM→Telegram Workflow Successfully Completed

          ## Workflow Summary
          - **Content Type**: ${content_type}
          - **Difficulty**: ${difficulty_level}  
          - **Target Audience**: ${audience}
          - **Telegram Chat**: ${telegram_chat_id}

          ## Generated Content Preview
          ```
          ${llm_content}
          ```

          ## Telegram Message Sent
          ```
          ${telegram_message}
          ```

          ## Activity Log
          ```
          ${activity_log}
          ```

          ## Variable Substitution Demonstration

          This workflow demonstrates the **critical variable substitution bug fix**:

          ### Before Fix (Broken):
          - LLM generates content → stored in lowercase llm_content
          - Variable assignment tries to use template variables → **appears literally** in Telegram
          - Users receive messages with literal variable text instead of AI content

          ### After Fix (Working):
          - LLM generates content → stored in uppercase LLM_CONTENT 
          - Variable assignment uses template variables → **properly substituted**
          - Users receive actual AI-generated riddles, jokes, and content

          ### Technical Implementation:
          1. **LLM Node**: processTemplateVariables() converts to uppercase storage
          2. **Variable Assignment**: Detects template variable patterns, preserves for substitution
          3. **Template Processing**: get_workflow_var shell function calls
          4. **Result**: Seamless variable flow from AI generation to Telegram delivery

          This pattern works for any LLM→processing→delivery workflow in flowsh.
        type: 'markdown'

  edges:
    - source: 'start'
      target: 'generate_content'
    - source: 'generate_content'
      target: 'format_telegram_message'
    - source: 'format_telegram_message'
      target: 'send_to_telegram'
    - source: 'send_to_telegram'
      target: 'log_activity'
    - source: 'log_activity'
      target: 'workflow_complete'
