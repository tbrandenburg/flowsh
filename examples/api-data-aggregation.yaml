workflow:
  name: 'API Data Aggregation'
  description: 'Fetch data from multiple API endpoints and aggregate the results'
  version: '1.0'

environment_variables:
  - variable: 'api_key'
    name: 'API Key'
    type: 'text'
    description: 'API key for authentication'
    default: 'your_api_key_here'

graph:
  nodes:
    - id: 'start'
      type: 'start'
      data:
        title: 'Start API Aggregation'
        description: 'Begin fetching data from multiple endpoints'

    # Fetch data from different API endpoints
    - id: 'fetch_weather'
      type: 'http-request'
      data:
        title: 'Fetch Weather Data'
        description: 'Get current weather information'
        url: 'https://api.openweathermap.org/data/2.5/weather?q=London&appid=${api_key}'
        method: 'GET'
        timeout: 15
        retries: 2
        error_handling: 'continue'

    - id: 'fetch_news'
      type: 'http-request'
      data:
        title: 'Fetch News Headlines'
        description: 'Get latest news headlines'
        url: 'https://newsapi.org/v2/top-headlines?country=us&apiKey=${api_key}'
        method: 'GET'
        timeout: 15
        retries: 2
        error_handling: 'continue'

    - id: 'fetch_stocks'
      type: 'http-request'
      data:
        title: 'Fetch Stock Prices'
        description: 'Get current stock market data'
        url: 'https://api.twelvedata.com/time_series?symbol=AAPL&interval=1min&apikey=${api_key}'
        method: 'GET'
        timeout: 15
        retries: 2
        error_handling: 'continue'

    # Aggregate all API responses
    - id: 'aggregate_responses'
      type: 'variable-aggregation'
      data:
        title: 'Aggregate API Responses'
        description: 'Collect all API responses into a single dataset'
        aggregation_method: 'collect'
        input_variables: ['http_response_body', 'http_response_body', 'http_response_body']
        output_variable: 'all_api_data'

    # Calculate response time statistics
    - id: 'calculate_avg_time'
      type: 'variable-aggregation'
      data:
        title: 'Calculate Average Response Time'
        description: 'Compute average API response time'
        aggregation_method: 'avg'
        input_variables: ['http_response_time', 'http_response_time', 'http_response_time']
        output_variable: 'avg_response_time'

    # Create summary report
    - id: 'create_summary'
      type: 'template-transform'
      data:
        title: 'Create Summary Report'
        description: 'Generate formatted summary of API aggregation'
        template_source: 'inline'
        template_content: |
          # API Data Aggregation Summary

          **Timestamp**: {{now}}
          **APIs Queried**: 3 (Weather, News, Stocks)
          **Average Response Time**: {{avg_response_time}}s

          ## Data Sources
          1. Weather API - Current conditions for London
          2. News API - Top US headlines  
          3. Stock API - Apple Inc. (AAPL) real-time data

          ## Aggregated Data
          Total responses collected: {{count all_api_data}}

          {{#if all_api_data}}
          ✅ Data aggregation successful
          {{else}}
          ❌ No data collected
          {{/if}}

          *Report generated by FlowSH Phase 2B*
        output_variable: 'summary_report'
        parameters:
          all_api_data: '${all_api_data}'
          avg_response_time: '${avg_response_time}'

    - id: 'end'
      type: 'answer'
      data:
        title: 'Output Results'
        description: 'Return the aggregated API data and summary'
        answer: '${summary_report}'

  edges:
    - source: 'start'
      target: 'fetch_weather'

    - source: 'start'
      target: 'fetch_news'

    - source: 'start'
      target: 'fetch_stocks'

    - source: 'fetch_weather'
      target: 'aggregate_responses'

    - source: 'fetch_news'
      target: 'aggregate_responses'

    - source: 'fetch_stocks'
      target: 'aggregate_responses'

    - source: 'fetch_weather'
      target: 'calculate_avg_time'

    - source: 'fetch_news'
      target: 'calculate_avg_time'

    - source: 'fetch_stocks'
      target: 'calculate_avg_time'

    - source: 'aggregate_responses'
      target: 'create_summary'

    - source: 'calculate_avg_time'
      target: 'create_summary'

    - source: 'create_summary'
      target: 'end'
