workflow:
  name: 'Counting Loop Test'
  description: 'Test workflow demonstrating loop functionality with counter increment'

environment_variables:
  - variable: 'target'
    name: 'Target Count'
    type: 'number'
    description: 'Target number to count to'
    default: 5

graph:
  nodes:
    - id: 'start'
      type: 'start'
      data:
        title: 'Start'
        description: 'Initialize counter variables'
        variables:
          counter: 0

    - id: 'setup_message'
      type: 'code'
      data:
        title: 'Setup Message'
        description: 'Display countdown initialization message'
        command: 'echo'
        args: ['Starting countdown from {{counter}} to {{target}}']

    - id: 'counting_loop'
      type: 'loop'
      data:
        title: 'Counting Loop'
        description: 'Loop until counter reaches target'
        condition:
          variable: 'counter'
          operator: '<'
          value: '{{target}}'
        max_iterations: 10

    - id: 'increment_counter'
      type: 'variable-assignment'
      data:
        title: 'Increment Counter'
        description: 'Add 1 to counter'
        variable: 'counter'
        value: '$((counter + 1))'

    - id: 'display_count'
      type: 'code'
      data:
        title: 'Display Count'
        description: 'Show current counter value and loop iteration'
        command: 'echo'
        args: ['Count: {{counter}} (Loop iteration: {{loop_iteration}})']

    - id: 'completion_message'
      type: 'code'
      data:
        title: 'Completion Message'
        description: 'Show final results'
        command: 'echo'
        args:
          ['Counting complete! Final count: {{counter}}, Total iterations: {{loop_final_count}}']

    - id: 'end'
      type: 'end'
      data:
        title: 'End'
        description: 'Workflow completed successfully'

  edges:
    - id: 'start_to_setup'
      source: 'start'
      target: 'setup_message'

    - id: 'setup_to_loop'
      source: 'setup_message'
      target: 'counting_loop'

    - id: 'loop_to_increment'
      source: 'counting_loop'
      target: 'increment_counter'

    - id: 'increment_to_display'
      source: 'increment_counter'
      target: 'display_count'

    - id: 'display_to_loop_back'
      source: 'display_count'
      target: 'counting_loop'

    - id: 'loop_to_completion'
      source: 'counting_loop'
      target: 'completion_message'

    - id: 'completion_to_end'
      source: 'completion_message'
      target: 'end'
