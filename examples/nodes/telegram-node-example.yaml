version: '1.0'
kind: Workflow
metadata:
  name: telegram-node-example
  description: 'Demonstrates Telegram messaging node with different parse modes, configurations, and use cases'
  version: '1.0'

workflow:
  name: 'Telegram Node Example'
  description: 'Shows comprehensive Telegram messaging capabilities with various configurations, parse modes, and workflow integration patterns'

environment_variables:
  - variable: 'telegram_bot_token'
    name: 'Telegram Bot Token'
    type: 'text'
    description: 'Bot token from @BotFather (required for sending messages)'
  - variable: 'telegram_chat_id'
    name: 'Telegram Chat ID'
    type: 'text'
    description: 'Chat ID or channel username where messages will be sent'

graph:
  nodes:
    - id: 'start'
      type: 'start'
      data:
        title: 'Telegram Configuration'
        description: 'Configure parameters for Telegram messaging demonstrations'
        variables:
          - variable: 'workflow_name'
            type: 'text'
            label: 'Workflow Name'
            description: 'Name of the workflow for notifications'
            required: true
            default: 'Telegram Demo Workflow'
          - variable: 'notification_level'
            type: 'select'
            label: 'Notification Level'
            description: 'Level of detail for notifications'
            required: true
            options: ['minimal', 'standard', 'detailed']
            default: 'standard'
          - variable: 'test_chat_id'
            type: 'text'
            label: 'Test Chat ID'
            description: 'Override chat ID for testing (optional)'
            required: false
          - variable: 'user_name'
            type: 'text'
            label: 'User Name'
            description: 'Name to include in personalized messages'
            required: true
            default: 'FlowshUser'

    # Simple text message with HTML formatting
    - id: 'simple_message'
      type: 'telegram'
      data:
        title: 'Simple HTML Message'
        description: 'Basic message with HTML formatting'
        message: |
          🚀 <b>Workflow Started!</b>

          <i>Workflow Name:</i> <code>${workflow_name}</code>
          <i>User:</i> <code>${user_name}</code>
          <i>Notification Level:</i> <code>${notification_level}</code>

          <b>Status:</b> ✅ Initialization Complete
        parse_mode: 'HTML'
        max_retries: 3
        disable_notification: false
        error_handling: 'continue'

    # Message using environment variables for configuration
    - id: 'env_var_message'
      type: 'telegram'
      data:
        title: 'Message with Environment Variables'
        description: 'Demonstrates using TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID'
        message: |
          📋 Environment Variable Configuration Test

          This message uses environment variables:
          • TELEGRAM_BOT_TOKEN (configured)
          • TELEGRAM_CHAT_ID (configured)

          Current time: $(date)
        parse_mode: 'HTML'
        max_retries: 2

    # Markdown formatted message
    - id: 'markdown_message'
      type: 'telegram'
      data:
        title: 'Markdown Formatted Message'
        description: 'Message using Markdown parse mode'
        message: |
          📄 <b>Formatting Features Example</b>

          <i>Workflow:</i> <code>${workflow_name}</code>
          <i>User:</i> <code>${user_name}</code>

          <b>HTML Features Demonstrated:</b>
          • <b>Bold text</b>
          • <i>Italic text</i>  
          • <code>Code formatting</code>

          <b>Status:</b> ✅ All formatting working correctly
        parse_mode: 'HTML'
        max_retries: 3

    # Progress notification with variables
    - id: 'progress_update'
      type: 'telegram'
      data:
        title: 'Progress Update Notification'
        description: 'Shows dynamic content with workflow variables'
        message: |
          🔄 <b>Progress Update</b>

          <b>Workflow:</b> <code>${workflow_name}</code>
          <b>Progress:</b> 50% Complete
          <b>Stage:</b> Processing Messages
          <b>Next:</b> Error Handling Demo

          📊 <i>Current Status:</i>
          • Simple Message: ✅ Sent
          • Environment Config: ✅ Sent
          • Markdown Demo: ✅ Sent
          • Progress Update: 🔄 Sending...
        parse_mode: 'HTML'
        max_retries: 5

    # Error handling demonstration (simulated)
    - id: 'simulate_error'
      type: 'variable-assignment'
      data:
        title: 'Simulate Error Condition'
        description: 'Create error variables for demonstration'
        variable: 'error_message'
        assignment_type: 'constant'
        value: 'Simulated API timeout error'

    - id: 'error_notification'
      type: 'telegram'
      data:
        title: 'Error Alert Message'
        description: 'Demonstrates error notification capabilities'
        message: |
          🚨 <b>ERROR ALERT</b> 🚨

          <b>Workflow:</b> <code>${workflow_name}</code>
          <b>Error:</b> <code>${error_message}</code>
          <b>Time:</b> <code>$(date '+%Y-%m-%d %H:%M:%S')</code>

          <b>Recommended Actions:</b>
          • Check system logs
          • Verify API endpoints
          • Contact administrator if needed

          <i>This is an automated alert from flowsh</i>
        parse_mode: 'HTML'
        max_retries: 1
        disable_notification: false

    # Recovery notification
    - id: 'recovery_message'
      type: 'telegram'
      data:
        title: 'Recovery Notification'
        description: 'Shows recovery after error handling'
        message: |
          ✅ <b>System Recovery</b>

          <b>Workflow:</b> <code>${workflow_name}</code>
          <b>Status:</b> Recovered Successfully
          <b>Previous Error:</b> <code>${error_message}</code>

          <b>Recovery Actions:</b>
          • Error logged and analyzed
          • Notification sent to administrators
          • Workflow resumed automatically

          💡 <i>Error handling completed successfully</i>
        parse_mode: 'HTML'
        max_retries: 3

    # Message with special characters (testing escaping)
    - id: 'special_characters'
      type: 'telegram'
      data:
        title: 'Special Characters Test'
        description: 'Tests HTML character escaping'
        message: |
          🧪 <b>Character Escaping Test</b>

          <b>HTML Special Characters:</b>
          • Less than: &lt; 
          • Greater than: &gt;
          • Ampersand: &amp;

          <b>Code Examples:</b>
          <pre>&lt;html&gt;
            &lt;body&gt;Hello &amp; Welcome&lt;/body&gt;
          &lt;/html&gt;</pre>

          <b>JSON Example:</b>
          <code>{"name": "value", "number": 42}</code>
        parse_mode: 'HTML'
        max_retries: 2

    # Conditional message based on notification level
    - id: 'check_notification_level'
      type: 'if-else'
      data:
        title: 'Check Notification Level'
        description: 'Route based on notification level preference'
        conditions:
          - variable: 'notification_level'
            comparison_operator: '=='
            value: 'detailed'

    # Detailed completion message (for detailed level)
    - id: 'detailed_completion'
      type: 'telegram'
      data:
        title: 'Detailed Completion Report'
        description: 'Comprehensive workflow completion report'
        message: |
          📊 <b>DETAILED WORKFLOW COMPLETION REPORT</b>

          <b>🔧 Configuration:</b>
          • Workflow: <code>${workflow_name}</code>
          • User: <code>${user_name}</code>
          • Notification Level: <code>${notification_level}</code>
          • Chat ID: <code>${test_chat_id}</code>

          <b>📋 Messages Sent:</b>
          • Simple HTML Message ✅
          • Environment Variables ✅
          • Markdown Formatting ✅
          • Progress Update ✅
          • Error Simulation ✅
          • Recovery Notification ✅
          • Special Characters Test ✅
          • Detailed Report ✅

          <b>⚡ Performance:</b>
          • Total Messages: 8
          • Parse Modes: HTML, Markdown
          • Retry Configurations: 1-5 attempts
          • Error Handling: Demonstrated

          <b>🎯 Features Demonstrated:</b>
          • Variable substitution
          • HTML/Markdown formatting
          • Character escaping
          • Environment variables
          • Error notifications
          • Conditional messaging
          • Retry mechanisms

          <b>✅ Status:</b> All features working correctly!
        parse_mode: 'HTML'
        max_retries: 3

    # Simple completion message (for minimal/standard levels)
    - id: 'simple_completion'
      type: 'telegram'
      data:
        title: 'Simple Completion Notice'
        description: 'Brief workflow completion notice'
        message: |
          ✅ <b>Workflow Complete</b>

          <b>Name:</b> <code>${workflow_name}</code>
          <b>User:</b> <code>${user_name}</code>
          <b>Status:</b> All tests passed successfully

          🎉 Telegram node demonstration completed!
        parse_mode: 'HTML'
        max_retries: 2

    # Final summary with aggregated results
    - id: 'workflow_summary'
      type: 'variable-assignment'
      data:
        title: 'Generate Workflow Summary'
        description: 'Create summary of all Telegram operations'
        variable: 'telegram_summary'
        assignment_type: 'expression'
        expression: "echo 'Telegram Demo: 8+ messages sent | Parse modes: HTML/Markdown | User: ${user_name} | Level: ${notification_level}'"

    - id: 'final_results'
      type: 'answer'
      data:
        title: 'Telegram Node Example Results'
        description: 'Comprehensive results from Telegram messaging demonstration'
        answer: |
          # 📱 Telegram Node Example Results

          ## Configuration Summary
          - **Workflow Name**: ${workflow_name}
          - **User**: ${user_name}
          - **Notification Level**: ${notification_level}
          - **Test Chat ID**: ${test_chat_id}

          ## Telegram Operations Performed

          ### 1. Simple HTML Message ✅
          - **Parse Mode**: HTML
          - **Features**: Bold, italic, code formatting
          - **Content**: Workflow initialization notice

          ### 2. Environment Variables ✅
          - **Configuration**: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
          - **Features**: Environment variable usage
          - **Content**: Configuration test message

          ### 3. Markdown Formatting ✅
          - **Parse Mode**: Markdown
          - **Features**: Headers, lists, quotes, links
          - **Content**: Feature demonstration

          ### 4. Progress Updates ✅
          - **Dynamic Content**: Variable substitution
          - **Features**: Real-time status updates
          - **Content**: Workflow progress notification

          ### 5. Error Handling ✅
          - **Scenario**: Simulated error conditions
          - **Features**: Alert formatting, troubleshooting info
          - **Content**: Error notification and recovery

          ### 6. Character Escaping ✅
          - **Safety**: HTML special character handling
          - **Features**: &lt;, &gt;, &amp; escaping
          - **Content**: Code examples and JSON data

          ### 7. Conditional Messaging ✅
          - **Logic**: Notification level-based routing
          - **Features**: Dynamic workflow paths
          - **Content**: Detailed vs simple completion reports

          ## Summary
          ${telegram_summary}

          ## Telegram Node Features Demonstrated

          ### Parse Modes
          - **HTML**: Rich formatting with tags (&lt;b&gt;, &lt;i&gt;, &lt;code&gt;)
          - **Markdown**: Lightweight markup syntax
          - **MarkdownV2**: Advanced markdown features (extensible)

          ### Configuration Options
          - **Environment Variables**: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
          - **Node Configuration**: chat_id, bot_token override
          - **Retry Logic**: 1-5 configurable attempts
          - **Notification Control**: Silent message option

          ### Message Types
          - **Notifications**: Status updates and alerts
          - **Progress Reports**: Dynamic workflow updates
          - **Error Alerts**: System failure notifications  
          - **Completion Reports**: Success confirmations

          ### Advanced Features
          - **Variable Substitution**: Dynamic content insertion
          - **Character Escaping**: Safe HTML/Markdown rendering
          - **Conditional Logic**: Message routing based on conditions
          - **Error Handling**: Retry mechanisms and failure management
          - **Template Support**: Reusable message formats

          ### Use Cases
          - **Workflow Notifications**: Start/completion alerts
          - **Error Monitoring**: System failure notifications
          - **Progress Tracking**: Real-time status updates
          - **User Communication**: Personalized messages
          - **System Integration**: API response forwarding
          - **Automation Alerts**: Scheduled task notifications

          ### Integration Patterns
          - **Fire-and-Forget**: Asynchronous message delivery
          - **Variable Integration**: Dynamic content from workflow
          - **Conditional Messaging**: Logic-based notifications
          - **Error Recovery**: Graceful failure handling
          - **Multi-Format Support**: HTML and Markdown options

          This example demonstrates the complete Telegram messaging capabilities of flowsh, enabling robust communication and notification features in automated workflows.
        type: 'markdown'

  edges:
    - source: 'start'
      target: 'simple_message'
    - source: 'simple_message'
      target: 'env_var_message'
    - source: 'env_var_message'
      target: 'markdown_message'
    - source: 'markdown_message'
      target: 'progress_update'
    - source: 'progress_update'
      target: 'simulate_error'
    - source: 'simulate_error'
      target: 'error_notification'
    - source: 'error_notification'
      target: 'recovery_message'
    - source: 'recovery_message'
      target: 'special_characters'
    - source: 'special_characters'
      target: 'check_notification_level'
    - source: 'check_notification_level'
      target: 'detailed_completion'
      condition: 'true'
    - source: 'check_notification_level'
      target: 'simple_completion'
      condition: 'false'
    - source: 'detailed_completion'
      target: 'workflow_summary'
    - source: 'simple_completion'
      target: 'workflow_summary'
    - source: 'workflow_summary'
      target: 'final_results'
