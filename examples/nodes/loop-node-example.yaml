version: '1.0'
kind: Workflow
metadata:
  name: loop-node-example
  description: 'Demonstrates loop node with iteration control, conditions, and break mechanisms'
  version: '1.0'

workflow:
  name: 'Loop Node Example'
  description: 'Shows how to use loop nodes for repetitive operations with proper termination conditions'

graph:
  nodes:
    - id: 'start'
      type: 'start'
      data:
        title: 'Loop Configuration'
        description: 'Set up parameters for loop demonstration'
        variables:
          - variable: 'max_iterations'
            type: 'number'
            label: 'Maximum Iterations'
            description: 'Maximum number of loop iterations allowed'
            required: true
            default: 10
            min: 1
            max: 100
          - variable: 'target_value'
            type: 'number'
            label: 'Target Value'
            description: 'Value to reach before breaking the loop'
            required: true
            default: 50
            min: 1
            max: 1000
          - variable: 'increment_step'
            type: 'number'
            label: 'Increment Step'
            description: 'How much to increment each iteration'
            required: true
            default: 5
            min: 1
            max: 20

    - id: 'initialize_counter'
      type: 'variable-assignment'
      data:
        title: 'Initialize Loop Counter'
        description: 'Set up the initial counter value for our loop'
        variable: 'current_value'
        assignment_type: 'constant'
        value: 0

    - id: 'initialize_iteration_count'
      type: 'variable-assignment'
      data:
        title: 'Initialize Iteration Counter'
        description: "Track how many iterations we've performed"
        variable: 'iteration_count'
        assignment_type: 'constant'
        value: 0

    - id: 'main_loop'
      type: 'loop'
      data:
        title: 'Main Processing Loop'
        description: 'Loop that continues until target value is reached'
        condition:
          variable: 'current_value'
          comparison_operator: '<'
          value: '${target_value}'
        max_iterations: '${max_iterations}'
        break_on: 'condition'

    - id: 'increment_counter'
      type: 'variable-assignment'
      data:
        title: 'Increment Counter'
        description: 'Increase the current value by the step amount'
        variable: 'current_value'
        assignment_type: 'expression'
        expression: 'echo $((${current_value} + ${increment_step}))'

    - id: 'increment_iteration'
      type: 'variable-assignment'
      data:
        title: 'Track Iterations'
        description: "Count how many iterations we've completed"
        variable: 'iteration_count'
        assignment_type: 'expression'
        expression: 'echo $((${iteration_count} + 1))'

    - id: 'log_progress'
      type: 'code'
      data:
        title: 'Log Current Progress'
        description: 'Display current loop progress'
        command: 'echo'
        args:
          ['Iteration ${iteration_count}: current_value=${current_value}, target=${target_value}']
        timeout: 5

    - id: 'check_early_termination'
      type: 'if-else'
      data:
        title: 'Early Termination Check'
        description: 'Check if we should terminate early due to max iterations'
        conditions:
          - variable: 'iteration_count'
            comparison_operator: '>='
            value: '${max_iterations}'

    - id: 'max_iterations_reached'
      type: 'answer'
      data:
        title: 'Maximum Iterations Reached'
        description: 'Loop terminated due to maximum iteration limit'
        answer: |
          # ⚠️ Loop Terminated - Maximum Iterations Reached

          The loop was stopped because it reached the maximum iteration limit.

          **Final Results:**
          - Current value: ${current_value}
          - Target value: ${target_value}
          - Iterations completed: ${iteration_count}
          - Maximum allowed: ${max_iterations}
          - Increment step: ${increment_step}

          **Status**: Target not reached within iteration limit.

          **Suggestions:**
          - Increase maximum iterations
          - Increase increment step
          - Reduce target value
        type: 'markdown'

    - id: 'target_reached'
      type: 'answer'
      data:
        title: 'Target Successfully Reached'
        description: 'Loop completed successfully by reaching target'
        answer: |
          # 🎯 Loop Completed Successfully!

          The target value was reached within the iteration limit.

          **Final Results:**
          - Final value: ${current_value}
          - Target value: ${target_value}
          - Total iterations: ${iteration_count}
          - Maximum allowed: ${max_iterations}
          - Increment step: ${increment_step}

          **Performance:**
          - Efficiency: ${iteration_count}/${max_iterations} iterations used
          - Average increment: $((${current_value} / ${iteration_count})) per iteration

          **Status**: ✅ Target reached successfully!
        type: 'markdown'

    # Second loop example with different termination condition
    - id: 'setup_second_loop'
      type: 'variable-assignment'
      data:
        title: 'Setup Second Loop'
        description: 'Initialize variables for a different type of loop'
        variable: 'countdown_value'
        assignment_type: 'variable'
        source_variable: 'target_value'

    - id: 'countdown_loop'
      type: 'loop'
      data:
        title: 'Countdown Loop'
        description: 'Loop that counts down from target value to zero'
        condition:
          variable: 'countdown_value'
          comparison_operator: '>'
          value: 0
        max_iterations: 20
        break_on: 'condition'

    - id: 'decrement_countdown'
      type: 'variable-assignment'
      data:
        title: 'Decrement Countdown'
        description: 'Decrease countdown value'
        variable: 'countdown_value'
        assignment_type: 'expression'
        expression: 'echo $((${countdown_value} - ${increment_step}))'

    - id: 'countdown_complete'
      type: 'answer'
      data:
        title: 'Countdown Loop Complete'
        description: 'Second loop demonstration completed'
        answer: |
          # 🔄 Both Loop Examples Completed!

          ## Loop Example Summary

          ### 1. Incrementing Loop (Count Up)
          - **Objective**: Count from 0 to ${target_value}
          - **Method**: Increment by ${increment_step} each iteration
          - **Final value**: ${current_value}
          - **Iterations**: ${iteration_count}

          ### 2. Decrementing Loop (Count Down)  
          - **Objective**: Count from ${target_value} to 0
          - **Method**: Decrement by ${increment_step} each iteration
          - **Final value**: ${countdown_value}

          ## Loop Node Features Demonstrated

          - **Condition-based termination**: Loop stops when condition becomes false
          - **Maximum iteration safety**: Prevents infinite loops
          - **Flexible break conditions**: Can break on condition or max iterations
          - **Variable integration**: Loop conditions can use dynamic variables
          - **Multiple loop patterns**: Both increment and decrement patterns
          - **Progress tracking**: Monitor loop progress and performance

          This example shows how loop nodes provide controlled, safe iteration with multiple termination mechanisms.
        type: 'markdown'

  edges:
    - source: 'start'
      target: 'initialize_counter'
    - source: 'initialize_counter'
      target: 'initialize_iteration_count'
    - source: 'initialize_iteration_count'
      target: 'main_loop'

    # Main loop body
    - source: 'main_loop'
      target: 'increment_counter'
    - source: 'increment_counter'
      target: 'increment_iteration'
    - source: 'increment_iteration'
      target: 'log_progress'
    - source: 'log_progress'
      target: 'check_early_termination'

    # Early termination check
    - source: 'check_early_termination'
      target: 'max_iterations_reached'
      condition: 'true'

    # Continue loop or exit
    - source: 'check_early_termination'
      target: 'main_loop'
      condition: 'false'

    # Loop completion - check if target was reached
    - source: 'main_loop'
      target: 'setup_second_loop'
      condition: 'loop_complete'

    # Second loop setup and execution
    - source: 'setup_second_loop'
      target: 'countdown_loop'
    - source: 'countdown_loop'
      target: 'decrement_countdown'
    - source: 'decrement_countdown'
      target: 'countdown_loop'
    - source: 'countdown_loop'
      target: 'countdown_complete'
      condition: 'loop_complete'
