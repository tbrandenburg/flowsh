version: '1.0'
kind: Workflow
metadata:
  name: iteration-node-example
  description: 'Demonstrates iteration node for processing arrays and lists of data'
  version: '1.0'

workflow:
  name: 'Iteration Node Example'
  description: 'Shows how to use iteration nodes to process collections of data items'

graph:
  nodes:
    - id: 'start'
      type: 'start'
      data:
        title: 'Input Data Setup'
        description: 'Prepare data collection for iteration processing'
        variables:
          - variable: 'file_list'
            type: 'text'
            label: 'File List'
            description: 'Comma-separated list of files to process'
            required: true
            default: 'config.yaml,data.json,script.sh,README.md,package.json'
          - variable: 'processing_mode'
            type: 'select'
            label: 'Processing Mode'
            description: 'How to process each file'
            options: ['analyze', 'validate', 'transform', 'backup']
            default: 'analyze'
            required: true
          - variable: 'enable_parallel'
            type: 'boolean'
            label: 'Enable Parallel Processing'
            description: 'Process items in parallel for better performance'
            default: false

    - id: 'prepare_file_array'
      type: 'variable-assignment'
      data:
        title: 'Convert to Array Format'
        description: 'Convert comma-separated list to array format for iteration'
        variable: 'files_array'
        assignment_type: 'expression'
        expression: "echo '${file_list}' | tr ',' '\n'"

    - id: 'initialize_results'
      type: 'variable-assignment'
      data:
        title: 'Initialize Results Collector'
        description: 'Set up variable to collect iteration results'
        variable: 'processing_results'
        assignment_type: 'constant'
        value: ''

    - id: 'iterate_files'
      type: 'iteration'
      data:
        title: 'Process Each File'
        description: 'Iterate through each file in the collection'
        input_variable: 'files_array'
        output_variable: 'file_processing_results'
        parallel: '${enable_parallel}'
        max_parallel: 3

    - id: 'get_current_file'
      type: 'variable-assignment'
      data:
        title: 'Get Current File'
        description: 'Extract the current file being processed'
        variable: 'current_file'
        assignment_type: 'variable'
        source_variable: 'iteration_item'

    - id: 'analyze_file_type'
      type: 'variable-assignment'
      data:
        title: 'Analyze File Type'
        description: 'Determine file extension and type'
        variable: 'file_extension'
        assignment_type: 'expression'
        expression: "echo '${current_file}' | sed 's/.*\\.//' | tr '[:upper:]' '[:lower:]'"

    - id: 'process_by_type'
      type: 'if-else'
      data:
        title: 'Process Based on File Type'
        description: 'Different processing based on file extension'
        conditions:
          - variable: 'file_extension'
            comparison_operator: '=='
            value: 'yaml'
          - variable: 'file_extension'
            comparison_operator: '=='
            value: 'yml'
        logical_operator: 'or'

    - id: 'process_yaml_file'
      type: 'code'
      data:
        title: 'Process YAML File'
        description: 'Specific processing for YAML files'
        command: 'sh'
        args:
          [
            '-c',
            "echo 'Processing YAML: ${current_file} - Mode: ${processing_mode} - Structure validation and syntax check'",
          ]
        timeout: 10

    - id: 'process_json_file'
      type: 'if-else'
      data:
        title: 'Check for JSON Files'
        description: 'Handle JSON file processing'
        conditions:
          - variable: 'file_extension'
            comparison_operator: '=='
            value: 'json'

    - id: 'handle_json'
      type: 'code'
      data:
        title: 'Process JSON File'
        description: 'Specific processing for JSON files'
        command: 'sh'
        args:
          [
            '-c',
            "echo 'Processing JSON: ${current_file} - Mode: ${processing_mode} - Schema validation and formatting'",
          ]
        timeout: 10

    - id: 'process_script_file'
      type: 'if-else'
      data:
        title: 'Check for Script Files'
        description: 'Handle shell script processing'
        conditions:
          - variable: 'file_extension'
            comparison_operator: '=='
            value: 'sh'

    - id: 'handle_script'
      type: 'code'
      data:
        title: 'Process Script File'
        description: 'Specific processing for shell scripts'
        command: 'sh'
        args:
          [
            '-c',
            "echo 'Processing SCRIPT: ${current_file} - Mode: ${processing_mode} - Syntax check and permissions'",
          ]
        timeout: 10

    - id: 'process_other_file'
      type: 'code'
      data:
        title: 'Process Other File Types'
        description: 'Generic processing for other file types'
        command: 'sh'
        args:
          [
            '-c',
            "echo 'Processing OTHER: ${current_file} (${file_extension}) - Mode: ${processing_mode} - Basic file analysis'",
          ]
        timeout: 10

    - id: 'create_file_report'
      type: 'variable-assignment'
      data:
        title: 'Create File Report'
        description: 'Generate report for current file'
        variable: 'current_file_result'
        assignment_type: 'expression'
        expression: "echo 'File: ${current_file} | Type: ${file_extension} | Mode: ${processing_mode} | Status: Processed | Timestamp: $(date)'"

    - id: 'collect_iteration_results'
      type: 'variable-aggregation'
      data:
        title: 'Collect All File Results'
        description: 'Aggregate results from all iteration cycles'
        input_variables: ['file_processing_results']
        output_variable: 'final_results'
        aggregation_method: 'concat'
        separator: "\n"

    - id: 'calculate_statistics'
      type: 'variable-assignment'
      data:
        title: 'Calculate Processing Statistics'
        description: 'Generate summary statistics about the iteration'
        variable: 'total_files_processed'
        assignment_type: 'expression'
        expression: "echo '${file_list}' | tr ',' '\n' | wc -l"

    - id: 'create_summary_report'
      type: 'variable-assignment'
      data:
        title: 'Create Summary Report'
        description: 'Generate comprehensive processing summary'
        variable: 'processing_summary'
        assignment_type: 'expression'
        expression: "echo 'Iteration Summary: ${total_files_processed} files processed in ${processing_mode} mode. Parallel: ${enable_parallel}'"

    - id: 'final_results'
      type: 'answer'
      data:
        title: 'Iteration Processing Results'
        description: 'Complete results from iteration node processing'
        answer: |
          # 🔄 Iteration Node Example Results

          ## Processing Configuration
          - **Input Files**: ${file_list}
          - **Processing Mode**: ${processing_mode}
          - **Parallel Processing**: ${enable_parallel}
          - **Total Files**: ${total_files_processed}

          ## Processing Results

          ${final_results}

          ## Summary Statistics
          ${processing_summary}

          ## File Type Breakdown
          The iteration processed different file types with specialized handling:

          - **YAML/YML Files** 📄: Structure validation and syntax checking
          - **JSON Files** 🔗: Schema validation and formatting verification
          - **Shell Scripts** 🔧: Syntax checking and permission analysis
          - **Other Files** 📋: Basic file analysis and metadata extraction

          ## Iteration Node Features Demonstrated

          - **Array Processing**: Iterate through collections of data items
          - **Variable Mapping**: Input/output variable configuration
          - **Parallel Execution**: Optional parallel processing for performance
          - **Dynamic Processing**: Different handling based on item properties
          - **Result Aggregation**: Collecting and combining iteration results
          - **Type-aware Processing**: Conditional logic based on data characteristics
          - **Progress Tracking**: Monitoring iteration progress and completion
          - **Flexible Input**: Support for various data collection formats

          This example demonstrates how iteration nodes enable efficient processing of data collections with type-specific logic and result aggregation.
        type: 'markdown'

  edges:
    - source: 'start'
      target: 'prepare_file_array'
    - source: 'prepare_file_array'
      target: 'initialize_results'
    - source: 'initialize_results'
      target: 'iterate_files'

    # Iteration body - process each file
    - source: 'iterate_files'
      target: 'get_current_file'
    - source: 'get_current_file'
      target: 'analyze_file_type'
    - source: 'analyze_file_type'
      target: 'process_by_type'

    # File type processing branches
    - source: 'process_by_type'
      target: 'process_yaml_file'
      condition: 'true'

    - source: 'process_by_type'
      target: 'process_json_file'
      condition: 'false'

    - source: 'process_json_file'
      target: 'handle_json'
      condition: 'true'

    - source: 'process_json_file'
      target: 'process_script_file'
      condition: 'false'

    - source: 'process_script_file'
      target: 'handle_script'
      condition: 'true'

    - source: 'process_script_file'
      target: 'process_other_file'
      condition: 'false'

    # All processing paths converge to report creation
    - source: 'process_yaml_file'
      target: 'create_file_report'
    - source: 'handle_json'
      target: 'create_file_report'
    - source: 'handle_script'
      target: 'create_file_report'
    - source: 'process_other_file'
      target: 'create_file_report'

    # Back to iteration or completion
    - source: 'create_file_report'
      target: 'iterate_files'

    # When iteration completes
    - source: 'iterate_files'
      target: 'collect_iteration_results'
      condition: 'iteration_complete'

    - source: 'collect_iteration_results'
      target: 'calculate_statistics'
    - source: 'calculate_statistics'
      target: 'create_summary_report'
    - source: 'create_summary_report'
      target: 'final_results'
