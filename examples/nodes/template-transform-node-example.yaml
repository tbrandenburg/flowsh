version: '1.0'
kind: Workflow
metadata:
  name: template-transform-node-example
  description: 'Demonstrates template transform node with dynamic content generation and variable substitution'
  version: '1.0'

workflow:
  name: 'Template Transform Node Example'
  description: 'Shows how to use template transform nodes for dynamic content generation with structured templates'

graph:
  nodes:
    - id: 'start'
      type: 'start'
      data:
        title: 'Template Configuration Input'
        description: 'Collect parameters for template transformation demonstrations'
        variables:
          - variable: 'user_name'
            type: 'text'
            label: 'User Name'
            description: 'Name to use in template substitution'
            required: true
            default: 'John Doe'
          - variable: 'project_name'
            type: 'text'
            label: 'Project Name'
            description: 'Project name for template generation'
            required: true
            default: 'MyAwesomeProject'
          - variable: 'template_type'
            type: 'select'
            label: 'Template Type'
            description: 'Type of template to generate'
            options: ['email', 'report', 'configuration', 'documentation']
            default: 'email'
            required: true
          - variable: 'urgency_level'
            type: 'select'
            label: 'Urgency Level'
            description: 'Priority level for template content'
            options: ['low', 'medium', 'high', 'critical']
            default: 'medium'
            required: true
          - variable: 'include_details'
            type: 'boolean'
            label: 'Include Detailed Information'
            description: 'Include comprehensive details in generated content'
            default: true

    # Prepare template parameters
    - id: 'prepare_timestamp'
      type: 'variable-assignment'
      data:
        title: 'Generate Timestamp'
        description: 'Create timestamp for template usage'
        variable: 'current_timestamp'
        assignment_type: 'expression'
        expression: "date '+%Y-%m-%d %H:%M:%S'"

    - id: 'prepare_metadata'
      type: 'variable-assignment'
      data:
        title: 'Prepare Template Metadata'
        description: 'Create metadata for template processing'
        variable: 'template_metadata'
        assignment_type: 'expression'
        expression: "echo 'Generated by flowsh template system | Timestamp: ${current_timestamp} | Type: ${template_type}'"

    # Email template transformation
    - id: 'transform_email_template'
      type: 'template-transform'
      data:
        title: 'Transform Email Template'
        description: 'Generate personalized email content using template transformation'
        template:
          type: 'prompt'
          source: 'inline'
          content: |
            Subject: {{urgency_prefix}}Project Update: {{project_name}}

            Dear {{user_name}},

            {{greeting_message}}

            Project: {{project_name}}
            Status: {{project_status}}
            Priority: {{urgency_level}}
            {{#include_details}}

            Detailed Information:
            - Generated: {{current_timestamp}}
            - Template Type: {{template_type}}
            - Metadata: {{template_metadata}}

            Next Steps:
            {{next_steps}}
            {{/include_details}}

            Best regards,
            The {{project_name}} Team

            ---
            {{footer_info}}
        template_parameters:
          user_name: '${user_name}'
          project_name: '${project_name}'
          urgency_level: '${urgency_level}'
          urgency_prefix: "if [ '${urgency_level}' = 'critical' ]; then echo '[URGENT] '; elif [ '${urgency_level}' = 'high' ]; then echo '[HIGH] '; else echo ''; fi"
          project_status: 'In Progress'
          greeting_message: "I hope this message finds you well. Here's an update on your project."
          current_timestamp: '${current_timestamp}'
          template_type: '${template_type}'
          template_metadata: '${template_metadata}'
          include_details: '${include_details}'
          next_steps: "1. Review the current progress\n2. Provide feedback on deliverables\n3. Schedule next milestone meeting"
          footer_info: 'This email was generated automatically by the flowsh workflow system.'
        output_variable: 'generated_email'

    # Report template transformation
    - id: 'transform_report_template'
      type: 'template-transform'
      data:
        title: 'Transform Report Template'
        description: 'Generate structured report using template transformation'
        template:
          type: 'prompt'
          source: 'inline'
          content: |
            # {{report_title}}

            **Generated:** {{current_timestamp}}  
            **Author:** {{user_name}}  
            **Project:** {{project_name}}  
            **Priority:** {{urgency_level}}

            ## Executive Summary

            {{executive_summary}}

            ## Project Details

            | Attribute | Value |
            |-----------|-------|
            | Name | {{project_name}} |
            | Owner | {{user_name}} |
            | Priority | {{urgency_level}} |
            | Generated | {{current_timestamp}} |
            | Template | {{template_type}} |

            {{#include_details}}
            ## Detailed Analysis

            {{detailed_analysis}}

            ### Metadata Information
            ```
            {{template_metadata}}
            ```

            ### Recommendations
            {{recommendations}}
            {{/include_details}}

            ## Conclusion

            {{conclusion}}

            ---
            *Report generated by flowsh template transformation system*
        template_parameters:
          report_title: 'Project Status Report: ${project_name}'
          user_name: '${user_name}'
          project_name: '${project_name}'
          urgency_level: '${urgency_level}'
          current_timestamp: '${current_timestamp}'
          template_type: '${template_type}'
          template_metadata: '${template_metadata}'
          include_details: '${include_details}'
          executive_summary: 'This report provides a comprehensive overview of the current project status, highlighting key achievements, challenges, and next steps for ${project_name}.'
          detailed_analysis: 'The project is progressing according to schedule with ${urgency_level} priority. All major milestones are on track for completion within the established timeline.'
          recommendations: "1. Continue current development approach\n2. Monitor ${urgency_level} priority items closely\n3. Schedule regular progress reviews"
          conclusion: 'The ${project_name} project is well-positioned for successful completion. Continued focus on ${urgency_level} priority items will ensure optimal outcomes.'
        output_variable: 'generated_report'

    # Configuration template transformation
    - id: 'transform_config_template'
      type: 'template-transform'
      data:
        title: 'Transform Configuration Template'
        description: 'Generate configuration file using template transformation'
        template:
          type: 'prompt'
          source: 'inline'
          content: |
            # {{project_name}} Configuration
            # Generated: {{current_timestamp}}
            # Owner: {{user_name}}

            [project]
            name = "{{project_name}}"
            owner = "{{user_name}}"
            priority = "{{urgency_level}}"
            generated_at = "{{current_timestamp}}"

            [settings]
            template_type = "{{template_type}}"
            include_details = {{include_details_bool}}
            debug_mode = {{debug_enabled}}

            {{#include_details}}
            [detailed_config]
            metadata = "{{template_metadata}}"
            generation_info = "{{generation_info}}"

            [advanced_settings]
            auto_backup = true
            compression = "gzip"
            retention_days = 30
            {{/include_details}}

            [metadata]
            {{metadata_section}}
        template_parameters:
          project_name: '${project_name}'
          user_name: '${user_name}'
          urgency_level: '${urgency_level}'
          current_timestamp: '${current_timestamp}'
          template_type: '${template_type}'
          template_metadata: '${template_metadata}'
          include_details: '${include_details}'
          include_details_bool: "if [ '${include_details}' = 'true' ]; then echo 'true'; else echo 'false'; fi"
          debug_enabled: "if [ '${urgency_level}' = 'high' ] || [ '${urgency_level}' = 'critical' ]; then echo 'true'; else echo 'false'; fi"
          generation_info: 'Generated by flowsh template transform node for ${project_name}'
          metadata_section: "version = \"1.0\"\ntags = [\"${template_type}\", \"${urgency_level}\"]\ngenerated_by = \"flowsh\""
        output_variable: 'generated_config'

    # Documentation template transformation
    - id: 'transform_docs_template'
      type: 'template-transform'
      data:
        title: 'Transform Documentation Template'
        description: 'Generate documentation using template transformation'
        template:
          type: 'prompt'
          source: 'inline'
          content: |
            # {{project_name}} Documentation

            > **Author:** {{user_name}}  
            > **Generated:** {{current_timestamp}}  
            > **Priority:** {{urgency_level}}

            ## Overview

            {{overview_content}}

            ## Quick Start

            ```bash
            # Clone the project
            git clone https://github.com/{{user_name}}/{{project_name_slug}}.git
            cd {{project_name_slug}}

            # Install dependencies
            npm install

            # Start development
            npm run dev
            ```

            ## Configuration

            {{config_instructions}}

            {{#include_details}}
            ## Advanced Usage

            {{advanced_usage}}

            ### Template Information
            - **Type:** {{template_type}}
            - **Priority:** {{urgency_level}}
            - **Metadata:** {{template_metadata}}

            ### API Reference

            {{api_reference}}
            {{/include_details}}

            ## Support

            {{support_info}}

            ---

            **Last updated:** {{current_timestamp}} by {{user_name}}
        template_parameters:
          project_name: '${project_name}'
          user_name: '${user_name}'
          urgency_level: '${urgency_level}'
          current_timestamp: '${current_timestamp}'
          template_type: '${template_type}'
          template_metadata: '${template_metadata}'
          include_details: '${include_details}'
          project_name_slug: "echo '${project_name}' | tr '[:upper:]' '[:lower:]' | tr ' ' '-'"
          overview_content: 'Welcome to ${project_name}! This project provides powerful workflow automation capabilities with ${urgency_level} priority support.'
          config_instructions: 'Configure your ${project_name} instance by editing the configuration file generated by the template transform system.'
          advanced_usage: 'For advanced configurations, refer to the ${urgency_level} priority documentation sections and the template transformation examples.'
          api_reference: 'The API provides endpoints for template transformation, configuration management, and workflow automation specific to ${project_name}.'
          support_info: 'For support, contact ${user_name} or visit the project documentation. Priority level: ${urgency_level}.'
        output_variable: 'generated_docs'

    # Aggregate all transformed content
    - id: 'aggregate_templates'
      type: 'variable-aggregation'
      data:
        title: 'Aggregate All Template Outputs'
        description: 'Combine all template transformation results'
        input_variables:
          ['generated_email', 'generated_report', 'generated_config', 'generated_docs']
        output_variable: 'all_template_outputs'
        aggregation_method: 'concat'
        separator: "\n\n=== TEMPLATE SEPARATOR ===\n\n"

    - id: 'generate_summary'
      type: 'variable-assignment'
      data:
        title: 'Generate Template Summary'
        description: 'Create summary of template transformation operations'
        variable: 'template_summary'
        assignment_type: 'expression'
        expression: "echo 'Template Transform Summary: 4 templates processed | User: ${user_name} | Project: ${project_name} | Type: ${template_type} | Priority: ${urgency_level} | Details: ${include_details}'"

    - id: 'final_results'
      type: 'answer'
      data:
        title: 'Template Transform Node Results'
        description: 'Comprehensive results from all template transformation operations'
        answer: |
          # 📝 Template Transform Node Example Results

          ## Configuration Summary
          - **User:** ${user_name}
          - **Project:** ${project_name}
          - **Template Type:** ${template_type}
          - **Priority Level:** ${urgency_level}
          - **Include Details:** ${include_details}
          - **Generated:** ${current_timestamp}

          ## Template Transformation Results

          ${all_template_outputs}

          ## Operations Summary
          ${template_summary}

          ## Template Transform Node Features Demonstrated

          ### Core Capabilities
          - **Dynamic Content Generation**: Templates with variable substitution
          - **Conditional Logic**: Template sections based on boolean conditions
          - **Parameter Mapping**: Flexible parameter binding and transformation
          - **Multiple Output Formats**: Email, reports, configuration, documentation
          - **Expression Evaluation**: Runtime calculation of template values

          ### Template Sources
          - **Inline Templates**: Templates defined directly in the workflow
          - **File Templates**: Templates loaded from external files
          - **Library Templates**: Reusable templates from template libraries
          - **Custom Templates**: User-defined template structures

          ### Parameter Features
          - **Static Values**: Direct string/number parameter binding
          - **Variable References**: Dynamic values from workflow variables
          - **Expression Parameters**: Computed values using shell expressions
          - **Conditional Parameters**: Values based on boolean logic
          - **Nested Parameters**: Complex object and array parameter structures

          ### Template Syntax
          - **Variable Substitution**: `{{variable_name}}` syntax
          - **Conditional Blocks**: `{{#condition}}...{{/condition}}` syntax
          - **Expression Evaluation**: Runtime computation of template values
          - **Escaping**: Proper handling of special characters
          - **Formatting**: Structured output with proper indentation

          ### Advanced Features
          - **Template Inheritance**: Building on base template structures
          - **Partial Templates**: Reusable template components
          - **Custom Helpers**: Extended template functionality
          - **Output Variables**: Storing generated content in workflow variables
          - **Error Handling**: Robust template processing with fallbacks

          ### Use Cases
          - **Email Generation**: Personalized communication templates
          - **Report Creation**: Automated report generation with dynamic data
          - **Configuration Management**: Dynamic config file generation
          - **Documentation**: Auto-generated project documentation
          - **Code Generation**: Template-driven code and script generation
          - **Notification Systems**: Dynamic alert and notification content

          ### Integration Patterns
          - **Multi-Template Workflows**: Processing multiple templates in sequence
          - **Template Chaining**: Using output from one template as input to another
          - **Conditional Templates**: Different templates based on workflow conditions
          - **Template Libraries**: Reusable template collections
          - **Dynamic Template Selection**: Runtime template choice based on parameters

          This example demonstrates the full power of template transform nodes for dynamic content generation, enabling flexible, maintainable, and scalable template-driven workflows.
        type: 'markdown'

  edges:
    - source: 'start'
      target: 'prepare_timestamp'
    - source: 'prepare_timestamp'
      target: 'prepare_metadata'
    - source: 'prepare_metadata'
      target: 'transform_email_template'
    - source: 'transform_email_template'
      target: 'transform_report_template'
    - source: 'transform_report_template'
      target: 'transform_config_template'
    - source: 'transform_config_template'
      target: 'transform_docs_template'
    - source: 'transform_docs_template'
      target: 'aggregate_templates'
    - source: 'aggregate_templates'
      target: 'generate_summary'
    - source: 'generate_summary'
      target: 'final_results'
