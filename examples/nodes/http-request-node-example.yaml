version: '1.0'
kind: Workflow
metadata:
  name: http-request-node-example
  description: 'Demonstrates HTTP request node with different methods, authentication, and error handling'
  version: '1.0'

workflow:
  name: 'HTTP Request Node Example'
  description: 'Shows comprehensive HTTP client capabilities with various request types, authentication methods, and robust error handling'

environment_variables:
  - variable: 'api_base_url'
    name: 'API Base URL'
    type: 'text'
    description: 'Base URL for API requests'

graph:
  nodes:
    - id: 'start'
      type: 'start'
      data:
        title: 'HTTP Request Configuration'
        description: 'Configure parameters for HTTP request demonstrations'
        variables:
          - variable: 'test_api_url'
            type: 'text'
            label: 'Test API URL'
            description: 'URL for testing HTTP requests (use httpbin.org for testing)'
            required: true
            default: 'https://httpbin.org'
          - variable: 'request_timeout'
            type: 'number'
            label: 'Request Timeout'
            description: 'Timeout in seconds for HTTP requests'
            required: true
            default: 30
            min: 5
            max: 120
          - variable: 'max_retries'
            type: 'number'
            label: 'Maximum Retries'
            description: 'Maximum number of retry attempts'
            required: true
            default: 3
            min: 1
            max: 10
          - variable: 'test_data'
            type: 'text'
            label: 'Test Data'
            description: 'JSON data to send in POST requests'
            required: true
            default: '{"message": "Hello from flowsh", "timestamp": "2024-01-01T00:00:00Z"}'

    # Simple GET request
    - id: 'simple_get_request'
      type: 'http-request'
      data:
        title: 'Simple GET Request'
        description: 'Basic GET request to retrieve server information'
        url: '${test_api_url}/get'
        method: 'GET'
        timeout: '${request_timeout}'
        retries: '${max_retries}'
        retry_delay: 2
        error_handling: 'continue'

    # GET request with query parameters and headers
    - id: 'get_with_headers'
      type: 'http-request'
      data:
        title: 'GET Request with Custom Headers'
        description: 'GET request with custom headers and query parameters'
        url: '${test_api_url}/headers'
        method: 'GET'
        headers: |
          Content-Type: application/json
          User-Agent: flowsh-http-client/1.0
          X-Custom-Header: flowsh-example
          Accept: application/json
        timeout: '${request_timeout}'
        retries: 2
        error_handling: 'continue'

    # POST request with JSON body
    - id: 'post_json_request'
      type: 'http-request'
      data:
        title: 'POST Request with JSON Body'
        description: 'POST request sending JSON data'
        url: '${test_api_url}/post'
        method: 'POST'
        headers: |
          Content-Type: application/json
          Accept: application/json
        body: '${test_data}'
        body_type: 'json'
        timeout: '${request_timeout}'
        retries: '${max_retries}'
        retry_delay: 1
        error_handling: 'continue'

    # POST request with form data
    - id: 'post_form_request'
      type: 'http-request'
      data:
        title: 'POST Request with Form Data'
        description: 'POST request sending form-encoded data'
        url: '${test_api_url}/post'
        method: 'POST'
        headers: |
          Content-Type: application/x-www-form-urlencoded
          Accept: application/json
        body: 'name=flowsh&type=workflow&version=1.0&message=Hello+World'
        body_type: 'form'
        timeout: '${request_timeout}'
        retries: 2
        error_handling: 'continue'

    # Request with Bearer token authentication
    - id: 'authenticated_request'
      type: 'http-request'
      data:
        title: 'Request with Bearer Authentication'
        description: 'GET request using Bearer token authentication'
        url: '${test_api_url}/bearer'
        method: 'GET'
        headers: |
          Accept: application/json
        auth_type: 'bearer'
        auth_token: 'example-bearer-token-for-testing'
        timeout: '${request_timeout}'
        retries: 1
        error_handling: 'continue'

    # Request with Basic authentication
    - id: 'basic_auth_request'
      type: 'http-request'
      data:
        title: 'Request with Basic Authentication'
        description: 'GET request using Basic authentication'
        url: '${test_api_url}/basic-auth/testuser/testpass'
        method: 'GET'
        headers: |
          Accept: application/json
        auth_type: 'basic'
        auth_credentials: 'testuser:testpass'
        timeout: '${request_timeout}'
        retries: 2
        error_handling: 'continue'

    # Request with API key authentication
    - id: 'api_key_request'
      type: 'http-request'
      data:
        title: 'Request with API Key Authentication'
        description: 'GET request using API key authentication'
        url: '${test_api_url}/get'
        method: 'GET'
        headers: |
          Accept: application/json
        auth_type: 'api_key'
        auth_api_key: 'example-api-key-12345'
        auth_key_header: 'X-API-Key'
        timeout: '${request_timeout}'
        retries: 1
        error_handling: 'continue'

    # PUT request for updating data
    - id: 'put_update_request'
      type: 'http-request'
      data:
        title: 'PUT Request for Data Update'
        description: 'PUT request to update existing data'
        url: '${test_api_url}/put'
        method: 'PUT'
        headers: |
          Content-Type: application/json
          Accept: application/json
        body: '{"id": 123, "name": "Updated Resource", "updated_by": "flowsh", "timestamp": "2024-01-01T12:00:00Z"}'
        body_type: 'json'
        timeout: '${request_timeout}'
        retries: 2
        error_handling: 'continue'

    # DELETE request
    - id: 'delete_request'
      type: 'http-request'
      data:
        title: 'DELETE Request'
        description: 'DELETE request to remove a resource'
        url: '${test_api_url}/delete'
        method: 'DELETE'
        headers: |
          Accept: application/json
          Authorization: Bearer delete-operation-token
        timeout: '${request_timeout}'
        retries: 1
        error_handling: 'continue'

    # Request with XML body
    - id: 'post_xml_request'
      type: 'http-request'
      data:
        title: 'POST Request with XML Body'
        description: 'POST request sending XML data'
        url: '${test_api_url}/post'
        method: 'POST'
        headers: |
          Content-Type: application/xml
          Accept: application/json
        body: |
          <?xml version="1.0" encoding="UTF-8"?>
          <workflow>
            <name>flowsh-example</name>
            <type>http-request-demo</type>
            <timestamp>2024-01-01T00:00:00Z</timestamp>
            <message>XML data from flowsh workflow</message>
          </workflow>
        body_type: 'xml'
        timeout: '${request_timeout}'
        retries: 1
        error_handling: 'continue'

    # Aggregate all HTTP responses
    - id: 'aggregate_responses'
      type: 'variable-aggregation'
      data:
        title: 'Aggregate All HTTP Responses'
        description: 'Combine all HTTP response data for analysis'
        input_variables:
          [
            'simple_get_request',
            'get_with_headers',
            'post_json_request',
            'post_form_request',
            'authenticated_request',
            'basic_auth_request',
            'api_key_request',
            'put_update_request',
            'delete_request',
            'post_xml_request',
          ]
        output_variable: 'all_http_responses'
        aggregation_method: 'concat'
        separator: "\n---\n"

    - id: 'generate_summary_stats'
      type: 'variable-assignment'
      data:
        title: 'Generate HTTP Summary Statistics'
        description: 'Create summary of HTTP operations performed'
        variable: 'http_summary'
        assignment_type: 'expression'
        expression: "echo 'HTTP Operations Summary: 10 requests executed | Timeout: ${request_timeout}s | Max Retries: ${max_retries} | Target: ${test_api_url}'"

    - id: 'final_results'
      type: 'answer'
      data:
        title: 'HTTP Request Node Results'
        description: 'Comprehensive results from all HTTP request operations'
        answer: |
          # 🌐 HTTP Request Node Example Results

          ## Configuration Summary
          - **Target API**: ${test_api_url}
          - **Request Timeout**: ${request_timeout} seconds
          - **Maximum Retries**: ${max_retries}
          - **Test Data**: ${test_data}

          ## HTTP Operations Performed

          ### 1. Simple GET Request ✅
          - **Method**: GET
          - **Endpoint**: `/get`
          - **Purpose**: Basic connectivity test
          - **Features**: Basic error handling and retries

          ### 2. GET with Custom Headers 📋
          - **Method**: GET  
          - **Endpoint**: `/headers`
          - **Features**: Custom headers, User-Agent, Accept types
          - **Headers**: Content-Type, User-Agent, X-Custom-Header

          ### 3. POST with JSON Body 📤
          - **Method**: POST
          - **Endpoint**: `/post`
          - **Body Type**: JSON
          - **Features**: Structured data transmission

          ### 4. POST with Form Data 📝
          - **Method**: POST
          - **Endpoint**: `/post`
          - **Body Type**: Form-encoded
          - **Features**: Traditional web form submission

          ### 5. Bearer Token Authentication 🔐
          - **Method**: GET
          - **Auth Type**: Bearer
          - **Features**: Modern API authentication

          ### 6. Basic Authentication 🔑
          - **Method**: GET
          - **Auth Type**: Basic
          - **Features**: Username/password authentication

          ### 7. API Key Authentication 🗝️
          - **Method**: GET
          - **Auth Type**: API Key
          - **Features**: Custom header-based authentication

          ### 8. PUT Update Request 🔄
          - **Method**: PUT
          - **Body Type**: JSON
          - **Features**: Resource updating operations

          ### 9. DELETE Request 🗑️
          - **Method**: DELETE
          - **Features**: Resource deletion operations

          ### 10. XML Data Request 📄
          - **Method**: POST
          - **Body Type**: XML
          - **Features**: XML document transmission

          ## Response Summary
          ${http_summary}

          ## Detailed Responses

          ${all_http_responses}

          ## HTTP Request Node Features Demonstrated

          ### HTTP Methods
          - **GET**: Data retrieval and queries
          - **POST**: Data creation and submission
          - **PUT**: Data updates and modifications
          - **DELETE**: Resource removal operations
          - **PATCH**: Partial updates (extensible)

          ### Authentication Methods
          - **None**: Open endpoints without authentication
          - **Bearer**: Token-based authentication for APIs
          - **Basic**: Username/password authentication
          - **API Key**: Custom header-based authentication

          ### Content Types
          - **JSON**: Structured data interchange
          - **Form**: Traditional web form encoding
          - **XML**: Document-based data exchange
          - **Text**: Plain text content

          ### Advanced Features
          - **Custom Headers**: Flexible request customization
          - **Timeout Control**: Request timeout management
          - **Retry Logic**: Automatic retry with configurable delays
          - **Error Handling**: Multiple error handling strategies (fail/ignore/continue)
          - **Response Processing**: Automatic response parsing and storage
          - **Variable Integration**: Dynamic URL and data construction

          ### Error Handling Strategies
          - **Fail**: Stop workflow on HTTP errors
          - **Ignore**: Continue workflow ignoring errors
          - **Continue**: Log errors but proceed with workflow

          ### Use Cases
          - **API Integration**: Connecting with external services
          - **Data Synchronization**: Exchanging data between systems
          - **Webhook Delivery**: Sending notifications and events
          - **Configuration Retrieval**: Fetching remote configuration
          - **Health Checks**: Monitoring service availability
          - **Authentication**: Securing API communications

          This example demonstrates the full HTTP client capabilities of flowsh, enabling robust integration with external APIs and services.
        type: 'markdown'

  edges:
    - source: 'start'
      target: 'simple_get_request'
    - source: 'simple_get_request'
      target: 'get_with_headers'
    - source: 'get_with_headers'
      target: 'post_json_request'
    - source: 'post_json_request'
      target: 'post_form_request'
    - source: 'post_form_request'
      target: 'authenticated_request'
    - source: 'authenticated_request'
      target: 'basic_auth_request'
    - source: 'basic_auth_request'
      target: 'api_key_request'
    - source: 'api_key_request'
      target: 'put_update_request'
    - source: 'put_update_request'
      target: 'delete_request'
    - source: 'delete_request'
      target: 'post_xml_request'
    - source: 'post_xml_request'
      target: 'aggregate_responses'
    - source: 'aggregate_responses'
      target: 'generate_summary_stats'
    - source: 'generate_summary_stats'
      target: 'final_results'
