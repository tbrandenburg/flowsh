version: '1.0'
kind: Workflow
metadata:
  name: fallback-node-example
  description: 'Demonstrates fallback node with multiple fallback strategies and graceful degradation patterns'
  version: '1.0'

workflow:
  name: 'Fallback Node Example'
  description: 'Shows robust fallback patterns for graceful degradation when primary operations fail'

graph:
  nodes:
    - id: 'start'
      type: 'start'
      data:
        title: 'Fallback Configuration Setup'
        description: 'Configure fallback behavior and failure simulation parameters'
        variables:
          - variable: 'primary_service_url'
            type: 'text'
            label: 'Primary Service URL'
            description: 'URL of the primary service to attempt'
            required: true
            default: 'https://primary-api.example.com'
          - variable: 'fallback_strategy'
            type: 'select'
            label: 'Fallback Strategy'
            description: 'Strategy for executing fallback operations'
            options: ['sequential', 'parallel']
            default: 'sequential'
            required: true
          - variable: 'max_fallback_time'
            type: 'number'
            label: 'Maximum Fallback Time'
            description: 'Maximum time to spend on fallback operations (seconds)'
            required: true
            default: 120
            min: 30
            max: 600
          - variable: 'continue_on_success'
            type: 'boolean'
            label: 'Continue After Success'
            description: 'Continue trying other fallbacks after first success'
            default: false
          - variable: 'failure_simulation'
            type: 'select'
            label: 'Failure Simulation Mode'
            description: 'Simulate different failure scenarios for testing'
            options: ['none', 'primary_fail', 'first_fallback_fail', 'all_fail']
            default: 'primary_fail'
            required: true

    # Initialize fallback tracking
    - id: 'initialize_tracking'
      type: 'variable-assignment'
      data:
        title: 'Initialize Fallback Tracking'
        description: 'Set up variables to track fallback attempts and results'
        variable: 'fallback_attempt_count'
        assignment_type: 'constant'
        value: 0

    - id: 'setup_fallback_context'
      type: 'variable-assignment'
      data:
        title: 'Setup Fallback Context'
        description: 'Prepare context information for fallback operations'
        variable: 'fallback_context'
        assignment_type: 'expression'
        expression: "echo 'Fallback context: Strategy=${fallback_strategy}, Max time=${max_fallback_time}s, Continue=${continue_on_success}, Simulation=${failure_simulation}'"

    # Primary operation fallback example
    - id: 'primary_service_fallback'
      type: 'fallback'
      data:
        title: 'Primary Service with Fallbacks'
        description: 'Attempt primary service with multiple fallback options'
        strategy: '${fallback_strategy}'
        fallback_paths:
          [
            'primary_service_call',
            'secondary_service_call',
            'cache_fallback_call',
            'default_response_call',
          ]
        max_fallback_time: '${max_fallback_time}'
        continue_on_success: '${continue_on_success}'

    # Primary service attempt
    - id: 'primary_service_call'
      type: 'code'
      data:
        title: 'Primary Service Call'
        description: 'Attempt to call the primary service'
        command: 'sh'
        args:
          [
            '-c',
            "echo 'Attempting primary service: ${primary_service_url}' && if [ '${failure_simulation}' = 'primary_fail' ] || [ '${failure_simulation}' = 'all_fail' ]; then echo 'Primary service unavailable' && exit 1; else echo 'Primary service response: SUCCESS - Data from primary API' && exit 0; fi",
          ]
        timeout: 10
        environment_variables:
          SERVICE_TYPE: 'primary'
          FALLBACK_LEVEL: '0'

    # First fallback - Secondary service
    - id: 'secondary_service_call'
      type: 'code'
      data:
        title: 'Secondary Service Fallback'
        description: 'Fallback to secondary service'
        command: 'sh'
        args:
          [
            '-c',
            "echo 'Attempting secondary service fallback...' && if [ '${failure_simulation}' = 'first_fallback_fail' ] || [ '${failure_simulation}' = 'all_fail' ]; then echo 'Secondary service also unavailable' && exit 1; else echo 'Secondary service response: SUCCESS - Data from backup API' && exit 0; fi",
          ]
        timeout: 15
        environment_variables:
          SERVICE_TYPE: 'secondary'
          FALLBACK_LEVEL: '1'

    # Second fallback - Local cache
    - id: 'cache_fallback_call'
      type: 'code'
      data:
        title: 'Cache Fallback'
        description: 'Fallback to cached data'
        command: 'sh'
        args:
          [
            '-c',
            "echo 'Attempting cache fallback...' && if [ '${failure_simulation}' = 'all_fail' ]; then echo 'Cache unavailable' && exit 1; else echo 'Cache response: SUCCESS - Cached data from local storage (may be stale)' && exit 0; fi",
          ]
        timeout: 5
        environment_variables:
          SERVICE_TYPE: 'cache'
          FALLBACK_LEVEL: '2'

    # Final fallback - Default response
    - id: 'default_response_call'
      type: 'code'
      data:
        title: 'Default Response Fallback'
        description: 'Final fallback with default response'
        command: 'sh'
        args:
          [
            '-c',
            "echo 'Using default response fallback...' && echo 'Default response: LIMITED - Basic functionality available with default data' && exit 0",
          ]
        timeout: 1
        environment_variables:
          SERVICE_TYPE: 'default'
          FALLBACK_LEVEL: '3'

    # Record primary fallback results
    - id: 'record_primary_fallback_result'
      type: 'variable-assignment'
      data:
        title: 'Record Primary Fallback Result'
        description: 'Capture results from primary fallback sequence'
        variable: 'primary_fallback_result'
        assignment_type: 'expression'
        expression: "echo 'Primary fallback completed with strategy: ${fallback_strategy}'"

    # Database operation fallback example
    - id: 'database_fallback_example'
      type: 'fallback'
      data:
        title: 'Database Operation Fallbacks'
        description: 'Database operations with read replica and cache fallbacks'
        strategy: 'sequential'
        fallback_paths: ['primary_database_call', 'read_replica_call', 'database_cache_call']
        max_fallback_time: 60
        continue_on_success: false

    # Database operations
    - id: 'primary_database_call'
      type: 'code'
      data:
        title: 'Primary Database Query'
        description: 'Query primary database'
        command: 'sh'
        args:
          [
            '-c',
            "echo 'Querying primary database...' && if [ '${failure_simulation}' = 'all_fail' ]; then echo 'Database connection failed' && exit 1; else echo 'Database result: User data retrieved from primary DB' && exit 0; fi",
          ]
        timeout: 8
        environment_variables:
          DB_TYPE: 'primary'

    - id: 'read_replica_call'
      type: 'code'
      data:
        title: 'Read Replica Database Query'
        description: 'Query read replica database'
        command: 'sh'
        args:
          [
            '-c',
            "echo 'Querying read replica...' && echo 'Replica result: User data from read replica (may be slightly stale)' && exit 0",
          ]
        timeout: 6
        environment_variables:
          DB_TYPE: 'replica'

    - id: 'database_cache_call'
      type: 'code'
      data:
        title: 'Database Cache Query'
        description: 'Query database cache as final fallback'
        command: 'sh'
        args:
          [
            '-c',
            "echo 'Querying database cache...' && echo 'Cache result: Cached user data (potentially stale but fast)' && exit 0",
          ]
        timeout: 2
        environment_variables:
          DB_TYPE: 'cache'

    # Parallel fallback example
    - id: 'parallel_fallback_example'
      type: 'fallback'
      data:
        title: 'Parallel Fallback Strategy'
        description: 'Demonstrate parallel fallback execution for speed'
        strategy: 'parallel'
        fallback_paths: ['fast_service_call', 'medium_service_call', 'slow_service_call']
        max_fallback_time: 30
        continue_on_success: true

    # Parallel service calls
    - id: 'fast_service_call'
      type: 'code'
      data:
        title: 'Fast Service Call'
        description: 'Quick service with limited functionality'
        command: 'sh'
        args:
          [
            '-c',
            "echo 'Fast service executing...' && sleep 1 && echo 'Fast service result: Quick response with basic data' && exit 0",
          ]
        timeout: 5
        environment_variables:
          SERVICE_SPEED: 'fast'

    - id: 'medium_service_call'
      type: 'code'
      data:
        title: 'Medium Service Call'
        description: 'Balanced service with moderate functionality'
        command: 'sh'
        args:
          [
            '-c',
            "echo 'Medium service executing...' && sleep 2 && echo 'Medium service result: Balanced response with standard data' && exit 0",
          ]
        timeout: 10
        environment_variables:
          SERVICE_SPEED: 'medium'

    - id: 'slow_service_call'
      type: 'code'
      data:
        title: 'Slow Service Call'
        description: 'Comprehensive service with full functionality'
        command: 'sh'
        args:
          [
            '-c',
            "echo 'Slow service executing...' && sleep 3 && echo 'Slow service result: Comprehensive response with detailed data' && exit 0",
          ]
        timeout: 15
        environment_variables:
          SERVICE_SPEED: 'slow'

    # Aggregate all fallback results
    - id: 'aggregate_fallback_results'
      type: 'variable-aggregation'
      data:
        title: 'Aggregate All Fallback Results'
        description: 'Combine results from all fallback demonstrations'
        input_variables:
          ['primary_service_fallback', 'database_fallback_example', 'parallel_fallback_example']
        output_variable: 'combined_fallback_results'
        aggregation_method: 'concat'
        separator: "\n--- FALLBACK SEPARATOR ---\n"

    # Generate fallback statistics
    - id: 'generate_fallback_statistics'
      type: 'variable-assignment'
      data:
        title: 'Generate Fallback Statistics'
        description: 'Create comprehensive statistics about fallback operations'
        variable: 'fallback_statistics'
        assignment_type: 'expression'
        expression: "echo 'Fallback Statistics: Strategy=${fallback_strategy}, Max time=${max_fallback_time}s, Continue=${continue_on_success}, Simulation=${failure_simulation}, Completion='$(date)"

    - id: 'final_report'
      type: 'answer'
      data:
        title: 'Fallback Node Example Results'
        description: 'Comprehensive analysis of fallback patterns and graceful degradation'
        answer: |
          # 🛡️ Fallback Node Example Results

          ## Configuration Summary
          - **Primary Service**: ${primary_service_url}
          - **Fallback Strategy**: ${fallback_strategy}
          - **Max Fallback Time**: ${max_fallback_time} seconds
          - **Continue on Success**: ${continue_on_success}
          - **Failure Simulation**: ${failure_simulation}

          ## Fallback Operations Performed

          ### 1. Primary Service Fallback Chain
          **Strategy**: ${fallback_strategy} execution
          **Fallback Sequence**:
          1. Primary Service → Primary API endpoint
          2. Secondary Service → Backup API endpoint  
          3. Cache Fallback → Local cached data
          4. Default Response → Minimal functionality

          ### 2. Database Operation Fallbacks
          **Strategy**: Sequential execution
          **Fallback Sequence**:
          1. Primary Database → Main database cluster
          2. Read Replica → Read-only replica database
          3. Database Cache → Cached database results

          ### 3. Parallel Fallback Strategy
          **Strategy**: Parallel execution
          **Concurrent Services**:
          - Fast Service (1s response, basic data)
          - Medium Service (2s response, standard data)
          - Slow Service (3s response, comprehensive data)

          ## Fallback Results Summary

          ${combined_fallback_results}

          ## Performance Metrics
          ${fallback_statistics}

          ## Fallback Node Features Demonstrated

          ### Execution Strategies
          - **Sequential Fallbacks**: Try fallbacks one after another until success
          - **Parallel Fallbacks**: Execute multiple fallbacks simultaneously for speed
          - **Mixed Strategies**: Different strategies for different use cases

          ### Fallback Configuration
          - **Fallback Paths**: Ordered list of alternative execution paths
          - **Time Limits**: Maximum time constraints for fallback operations
          - **Success Continuation**: Option to continue trying after first success
          - **Dynamic Strategy Selection**: Runtime strategy configuration

          ### Graceful Degradation Patterns

          1. **Service Quality Tiers**
             - Primary: Full functionality, best performance
             - Secondary: Reduced functionality, good performance  
             - Cache: Limited functionality, fast response
             - Default: Minimal functionality, immediate response

          2. **Data Freshness Trade-offs**
             - Primary Database: Real-time, authoritative data
             - Read Replica: Near real-time, slightly stale data
             - Cache: Potentially stale but fast access

          3. **Performance vs. Completeness**
             - Fast Service: Quick response, basic information
             - Medium Service: Balanced response time and data richness
             - Slow Service: Comprehensive data with longer response time

          ### Error Handling Strategies
          - **Automatic Failover**: Seamless transition between services
          - **Timeout Management**: Appropriate timeouts for each fallback level
          - **Resource Conservation**: Efficient resource usage during failures
          - **Status Reporting**: Clear indication of which fallback was used

          ### Use Cases
          - **API Gateway Resilience**: Multiple backend service options
          - **Database High Availability**: Primary/replica/cache hierarchies
          - **Content Delivery**: CDN with multiple source fallbacks
          - **Authentication Systems**: Primary/backup identity providers
          - **Payment Processing**: Multiple payment gateway options
          - **Microservice Communication**: Service mesh resilience patterns

          ### Monitoring and Observability
          - **Fallback Metrics**: Track which fallbacks are used most frequently
          - **Performance Impact**: Measure latency impact of fallback usage
          - **Success Rates**: Monitor success rates at each fallback level
          - **Resource Utilization**: Track resource consumption during fallbacks

          ### Best Practices Demonstrated

          1. **Layered Fallbacks**: Multiple levels of degradation
          2. **Timeout Hierarchies**: Shorter timeouts for higher-priority services
          3. **Resource Efficiency**: Lighter operations for fallback services
          4. **User Experience**: Maintain functionality even with degraded services
          5. **Operational Visibility**: Clear reporting of fallback usage
          6. **Configuration Flexibility**: Runtime configuration of fallback behavior

          This example demonstrates how fallback nodes provide robust resilience patterns essential for building fault-tolerant, highly available systems that gracefully degrade under failure conditions.
        type: 'markdown'

  edges:
    - source: 'start'
      target: 'initialize_tracking'
    - source: 'initialize_tracking'
      target: 'setup_fallback_context'
    - source: 'setup_fallback_context'
      target: 'primary_service_fallback'

    # Primary service fallback chain
    - source: 'primary_service_fallback'
      target: 'primary_service_call'
    - source: 'primary_service_call'
      target: 'primary_service_fallback'
      condition: 'fallback_needed'
    - source: 'primary_service_call'
      target: 'secondary_service_call'
      condition: 'fallback_to_next'
    - source: 'secondary_service_call'
      target: 'cache_fallback_call'
      condition: 'fallback_to_next'
    - source: 'cache_fallback_call'
      target: 'default_response_call'
      condition: 'fallback_to_next'

    # When primary fallback completes
    - source: 'primary_service_fallback'
      target: 'record_primary_fallback_result'
      condition: 'fallback_complete'

    # Database fallback example
    - source: 'record_primary_fallback_result'
      target: 'database_fallback_example'
    - source: 'database_fallback_example'
      target: 'primary_database_call'
    - source: 'primary_database_call'
      target: 'read_replica_call'
      condition: 'fallback_to_next'
    - source: 'read_replica_call'
      target: 'database_cache_call'
      condition: 'fallback_to_next'

    # Parallel fallback example
    - source: 'database_fallback_example'
      target: 'parallel_fallback_example'
      condition: 'fallback_complete'
    - source: 'parallel_fallback_example'
      target: 'fast_service_call'
    - source: 'parallel_fallback_example'
      target: 'medium_service_call'
    - source: 'parallel_fallback_example'
      target: 'slow_service_call'

    # Final aggregation
    - source: 'parallel_fallback_example'
      target: 'aggregate_fallback_results'
      condition: 'fallback_complete'
    - source: 'aggregate_fallback_results'
      target: 'generate_fallback_statistics'
    - source: 'generate_fallback_statistics'
      target: 'final_report'
