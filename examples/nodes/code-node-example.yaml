version: '1.0'
kind: Workflow
metadata:
  name: code-node-example
  description: 'Demonstrates code node with shell command execution, error handling, and environment variables'
  version: '1.0'

workflow:
  name: 'Code Node Example'
  description: 'Shows how to use code nodes for shell command execution with proper error handling'

graph:
  nodes:
    - id: 'start'
      type: 'start'
      data:
        title: 'Input Parameters'
        description: 'Collect parameters for code execution'
        variables:
          - variable: 'target_directory'
            type: 'text'
            label: 'Target Directory'
            description: 'Directory to analyze (relative to workflow)'
            required: true
            default: '.'
          - variable: 'file_pattern'
            type: 'text'
            label: 'File Pattern'
            description: 'Pattern to search for (e.g., *.ts, *.yaml)'
            required: true
            default: '*.yaml'

    - id: 'create_workspace'
      type: 'code'
      data:
        title: 'Create Temporary Workspace'
        description: 'Create a temporary directory for our operations'
        command: 'mkdir'
        args: ['-p', '/tmp/flowsh-code-example']
        working_directory: '/tmp'
        environment_variables:
          WORKSPACE_NAME: 'flowsh-code-example'
          CREATED_BY: 'flowsh-workflow'
        timeout: 10

    - id: 'list_files'
      type: 'code'
      data:
        title: 'List Files with Pattern'
        description: 'Find files matching the specified pattern'
        command: 'find'
        args: ['${target_directory}', '-name', '${file_pattern}', '-type', 'f']
        working_directory: '.'
        timeout: 30

    - id: 'count_lines'
      type: 'code'
      data:
        title: 'Count Lines in Files'
        description: 'Count total lines in matched files'
        command: 'sh'
        args:
          [
            '-c',
            "find ${target_directory} -name '${file_pattern}' -type f -exec wc -l {} + | tail -1 | awk '{print $1}' || echo '0'",
          ]
        working_directory: '.'
        timeout: 30

    - id: 'get_file_sizes'
      type: 'code'
      data:
        title: 'Get File Sizes'
        description: 'Calculate total size of matched files'
        command: 'sh'
        args:
          [
            '-c',
            "find ${target_directory} -name '${file_pattern}' -type f -exec du -ch {} + | tail -1 | cut -f1 || echo '0B'",
          ]
        working_directory: '.'
        timeout: 30

    - id: 'create_summary'
      type: 'code'
      data:
        title: 'Create Analysis Summary'
        description: 'Generate a summary file with analysis results'
        command: 'sh'
        args:
          [
            '-c',
            'echo "File Analysis Summary" > /tmp/flowsh-code-example/summary.txt && echo "Pattern: ${file_pattern}" >> /tmp/flowsh-code-example/summary.txt && echo "Directory: ${target_directory}" >> /tmp/flowsh-code-example/summary.txt && echo "Generated: $(date)" >> /tmp/flowsh-code-example/summary.txt',
          ]
        working_directory: '/tmp/flowsh-code-example'
        environment_variables:
          ANALYSIS_PATTERN: '${file_pattern}'
          ANALYSIS_DIR: '${target_directory}'
        timeout: 10

    - id: 'read_summary'
      type: 'code'
      data:
        title: 'Read Summary File'
        description: 'Read the generated summary file'
        command: 'cat'
        args: ['/tmp/flowsh-code-example/summary.txt']
        timeout: 10

    - id: 'cleanup_workspace'
      type: 'code'
      data:
        title: 'Cleanup Workspace'
        description: 'Clean up temporary files (demonstrates proper cleanup)'
        command: 'rm'
        args: ['-rf', '/tmp/flowsh-code-example']
        timeout: 10

    - id: 'success_summary'
      type: 'answer'
      data:
        title: 'Code Execution Summary'
        description: 'Summary of all code node executions'
        answer: |
          # 🔧 Code Node Example Completed Successfully!

          ## Executed Operations:

          1. **Workspace Creation** ✅
             - Created temporary workspace at `/tmp/flowsh-code-example`
             - Set environment variables for tracking

          2. **File Discovery** 📁
             - Searched for pattern: `${file_pattern}`
             - Target directory: `${target_directory}`

          3. **Analysis Operations** 📊
             - Counted lines in matched files
             - Calculated total file sizes
             - Generated summary report

          4. **Cleanup** 🧹
             - Removed temporary workspace
             - All operations completed safely

          ## Code Node Features Demonstrated:

          - **Command Execution**: Various shell commands (mkdir, find, wc, du, cat, rm)
          - **Argument Passing**: Dynamic arguments with variable interpolation
          - **Working Directory**: Different working directories for different operations
          - **Environment Variables**: Custom environment setup
          - **Timeout Management**: Appropriate timeouts for different operations
          - **Error Handling**: Safe operations with proper cleanup

          This example shows how code nodes can execute complex shell operations while maintaining safety and proper resource management.
        type: 'markdown'

  edges:
    - source: 'start'
      target: 'create_workspace'
    - source: 'create_workspace'
      target: 'list_files'
    - source: 'list_files'
      target: 'count_lines'
    - source: 'count_lines'
      target: 'get_file_sizes'
    - source: 'get_file_sizes'
      target: 'create_summary'
    - source: 'create_summary'
      target: 'read_summary'
    - source: 'read_summary'
      target: 'cleanup_workspace'
    - source: 'cleanup_workspace'
      target: 'success_summary'
