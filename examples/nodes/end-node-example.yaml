version: '1.0'
kind: Workflow
metadata:
  name: end-node-example
  description: 'Demonstrates the end node with output variable configurations'
  version: '1.0'

workflow:
  name: 'End Node Example'
  description: 'Shows how to configure end nodes to export workflow results'

graph:
  nodes:
    - id: 'start'
      type: 'start'
      data:
        title: 'Input Data'
        description: 'Collect input for processing'
        variables:
          - variable: 'input_data'
            type: 'text'
            label: 'Data to Process'
            description: 'Enter some data to process and export'
            required: true
            default: 'sample data for processing'

    - id: 'process_data'
      type: 'variable-assignment'
      data:
        title: 'Data Processing'
        description: 'Process the input data and create multiple outputs'
        variable: 'processed_result'
        assignment_type: 'expression'
        expression: 'echo "Processed: ${input_data}" | tr ''[:lower:]'' ''[:upper:]'''

    - id: 'calculate_stats'
      type: 'variable-assignment'
      data:
        title: 'Calculate Statistics'
        description: 'Calculate basic statistics about the processed data'
        variable: 'data_length'
        assignment_type: 'expression'
        expression: 'echo "${processed_result}" | wc -c'

    - id: 'generate_timestamp'
      type: 'variable-assignment'
      data:
        title: 'Generate Timestamp'
        description: 'Create a timestamp for when processing completed'
        variable: 'completion_time'
        assignment_type: 'expression'
        expression: "date '+%Y-%m-%d %H:%M:%S'"

    - id: 'create_summary'
      type: 'variable-assignment'
      data:
        title: 'Create Processing Summary'
        description: 'Generate a summary of the processing results'
        variable: 'processing_summary'
        assignment_type: 'expression'
        expression: 'echo "Processing completed at ${completion_time}. Input length: ${data_length} characters."'

    - id: 'end'
      type: 'end'
      data:
        title: 'Export Results'
        description: 'End node that exports all processing results as structured outputs'
        outputs:
          - variable: 'original_input'
            type: 'text'
            label: 'Original Input Data'
            description: 'The original data that was provided as input'
          - variable: 'processed_result'
            type: 'text'
            label: 'Processed Result'
            description: 'The data after processing (uppercase transformation)'
          - variable: 'data_length'
            type: 'number'
            label: 'Data Length'
            description: 'Number of characters in the processed result'
          - variable: 'completion_time'
            type: 'text'
            label: 'Completion Timestamp'
            description: 'When the processing was completed'
          - variable: 'processing_summary'
            type: 'text'
            label: 'Processing Summary'
            description: 'A summary of the entire processing operation'
          - variable: 'metadata'
            type: 'object'
            label: 'Processing Metadata'
            description: 'Structured metadata about the processing operation'

    # Set up the metadata as a structured object
    - id: 'prepare_metadata'
      type: 'variable-assignment'
      data:
        title: 'Prepare Metadata'
        description: 'Create structured metadata object for export'
        variable: 'metadata'
        assignment_type: 'expression'
        expression: 'echo ''{"workflow": "end-node-example", "version": "1.0", "status": "completed", "input_length": ''"${data_length}"''}'''

    # Copy original input for export
    - id: 'preserve_input'
      type: 'variable-assignment'
      data:
        title: 'Preserve Original Input'
        description: 'Copy original input for export through end node'
        variable: 'original_input'
        assignment_type: 'variable'
        source_variable: 'input_data'

  edges:
    - source: 'start'
      target: 'process_data'
    - source: 'process_data'
      target: 'calculate_stats'
    - source: 'calculate_stats'
      target: 'generate_timestamp'
    - source: 'generate_timestamp'
      target: 'create_summary'
    - source: 'create_summary'
      target: 'preserve_input'
    - source: 'preserve_input'
      target: 'prepare_metadata'
    - source: 'prepare_metadata'
      target: 'end'
