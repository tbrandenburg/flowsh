workflow:
  name: 'Hello World'
  description: 'The simplest flowsh workflow - outputs Hello, World!'

environment_variables:
  - variable: 'greeting_target'
    name: 'Greeting Target'
    type: 'text'
    description: 'Who to greet'
    default: 'World'

graph:
  nodes:
    - id: 'start'
      type: 'start'
      data:
        title: 'Start'
        description: 'Beginning of the Hello World workflow'

    - id: 'generate_greeting'
      type: 'code'
      data:
        title: 'Generate Greeting'
        description: 'Create a friendly greeting message'
        command: 'echo'
        args: ['Hello, {{greeting_target}}!']

    - id: 'end'
      type: 'end'
      data:
        title: 'Complete'
        description: 'Workflow completed successfully'

  edges:
    - id: 'start_to_greeting'
      source: 'start'
      target: 'generate_greeting'

    - id: 'greeting_to_end'
      source: 'generate_greeting'
      target: 'end'
