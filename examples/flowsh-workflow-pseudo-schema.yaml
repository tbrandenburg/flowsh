# flowsh Workflow - Human-Readable Pseudo YAML Schema
# This document shows how flowsh workflows would look when represented as YAML
# It includes practical examples and demonstrates the structure in a readable format

# ==============================================================================
# BASIC WORKFLOW STRUCTURE
# ==============================================================================

version: "1.0"
kind: Workflow

metadata:
  id: "workflow-example-001" 
  name: "Customer Support Assistant"
  description: "AI-powered customer support with knowledge retrieval and routing"
  version: "1.2"
  labels:
    category: "customer-support"
    complexity: "medium"
    
spec:
  # Main workflow definition
  graph:
    # Complete workflow nodes array
    nodes:
      # 1. START NODE - Workflow Entry Point
      - id: "start"
        type: "start"
        position: {x: 80, y: 280}
        data:
          title: "Start"
          desc: "Workflow entry point with customer input"
          variables:
            - variable: "user_question"
              label: "What can I help you with today?"
              type: "paragraph"
              required: true
              max_length: 1000
              
            - variable: "customer_id"
              label: "Customer ID (optional)"
              type: "text-input"
              required: false
              
            - variable: "uploaded_files"
              label: "Supporting Documents"
              type: "files"
              required: false
              max_length: 5

      # 2. QUESTION CLASSIFIER - Route queries by category
      - id: "classifier"
        type: "question-classifier"
        position: {x: 380, y: 280}
        data:
          title: "Query Classifier"
          desc: "Classify customer questions into categories"
          query_variable_selector: ["start", "user_question"]
          model:
            provider: "openai"
            name: "gpt-4"
            mode: "chat"
            completion_params:
              temperature: 0.1
              max_tokens: 100
          classes:
            - id: "technical_support"
              name: "Technical Support"
            - id: "billing_inquiry" 
              name: "Billing Inquiry"
            - id: "general_info"
              name: "General Information"
            - id: "escalation"
              name: "Needs Human Agent"
          instruction: "Classify the customer question into one of the provided categories based on the intent and subject matter."

      # 3. KNOWLEDGE RETRIEVAL - RAG for technical questions
      - id: "knowledge_search" 
        type: "knowledge-retrieval"
        position: {x: 680, y: 180}
        data:
          title: "Knowledge Base Search"
          desc: "Search technical documentation and FAQs"
          query_variable_selector: ["start", "user_question"]
          dataset_ids: ["tech-docs-001", "faq-002"]
          retrieval_mode: "multiple"
          multiple_retrieval_config:
            top_k: 3
            score_threshold: 0.7
            reranking_enable: true
            reranking_mode: "reranking_model"
            reranking_model:
              provider: "cohere"
              model: "rerank-english-v2.0"

      # 4. LLM NODE - Generate responses with context
      - id: "llm_response"
        type: "llm" 
        position: {x: 980, y: 180}
        data:
          title: "Generate Response"
          desc: "Create helpful response using retrieved knowledge"
          model:
            provider: "openai"
            name: "gpt-4"
            mode: "chat"
            completion_params:
              temperature: 0.3
              max_tokens: 500
          prompt_template:
            - role: "system"
              text: |
                You are a helpful customer support assistant. Use the provided knowledge base context to answer customer questions accurately and professionally.
                
                Guidelines:
                - Be concise but thorough
                - If unsure, acknowledge limitations
                - Offer additional help when appropriate
                - Use a friendly, professional tone
                
            - role: "user"
              text: |
                Customer Question: {{#start.user_question#}}
                
                Knowledge Base Context:
                {{#knowledge_search.result#}}
                
                Please provide a helpful response to the customer's question.
          context:
            enabled: true
            variable_selector: ["knowledge_search", "result"]
          structured_output_enabled: false

      # 5. HTTP REQUEST - Check customer status
      - id: "customer_lookup"
        type: "http-request"
        position: {x: 680, y: 380}
        data:
          title: "Customer Status Check"
          desc: "Look up customer tier and account status"
          method: "GET"
          url: "{{#env.API_BASE_URL#}}/customers/{{#start.customer_id#}}"
          headers: |
            {
              "Authorization": "Bearer {{#env.API_TOKEN#}}",
              "Content-Type": "application/json"
            }
          authorization:
            type: "api-key"
            config:
              type: "bearer"
              api_key: "{{#env.API_TOKEN#}}"
          timeout:
            connect: 10
            read: 30
            write: 10

      # 6. IF-ELSE NODE - Conditional routing based on customer tier
      - id: "tier_check"
        type: "if-else"
        position: {x: 980, y: 380}
        data:
          title: "Customer Tier Check"
          desc: "Route based on customer service tier"
          logical_operator: "or"
          cases:
            - case_id: "premium_customer"
              logical_operator: "or"
              conditions:
                - variable_selector: ["customer_lookup", "tier"]
                  comparison_operator: "="
                  value: "premium"
                - variable_selector: ["customer_lookup", "tier"] 
                  comparison_operator: "="
                  value: "enterprise"
                  
            - case_id: "basic_customer"
              logical_operator: "and"
              conditions:
                - variable_selector: ["customer_lookup", "tier"]
                  comparison_operator: "="
                  value: "basic"
                - variable_selector: ["customer_lookup", "status"]
                  comparison_operator: "="
                  value: "active"

      # 7. CODE NODE - Custom processing logic
      - id: "format_response"
        type: "code"
        position: {x: 1280, y: 280}
        data:
          title: "Format Final Response"
          desc: "Apply custom formatting and add personalization"
          variables:
            - variable: "base_response"
              value_selector: ["llm_response", "text"]
            - variable: "customer_data"
              value_selector: ["customer_lookup", "body"]
          code_language: "javascript"
          code: |
            function main({base_response, customer_data}) {
              const customer = JSON.parse(customer_data || '{}');
              
              // Add personalization if we have customer data
              let formatted_response = base_response;
              if (customer.name) {
                formatted_response = `Hello ${customer.name},\n\n${base_response}`;
              }
              
              // Add tier-specific closing
              if (customer.tier === 'premium' || customer.tier === 'enterprise') {
                formatted_response += '\n\nAs a valued premium customer, please feel free to contact our priority support line at any time.';
              } else {
                formatted_response += '\n\nIs there anything else I can help you with today?';
              }
              
              return {
                final_response: formatted_response,
                customer_tier: customer.tier || 'unknown',
                response_length: formatted_response.length
              };
            }
          outputs:
            final_response:
              type: "string"
            customer_tier:
              type: "string"  
            response_length:
              type: "number"

      # 8. ITERATION NODE - Process multiple documents with nested sub-workflow
      - id: "document_processor"
        type: "iteration"
        position: {x: 380, y: 480}
        data:
          title: "Process Uploaded Documents"
          desc: "Extract and analyze each uploaded document"
          iterator_selector: ["start", "uploaded_files"]
          output_selector: ["doc_summary", "summary_text"]
          start_node_id: "doc_extract"  # Entry point for sub-workflow
          is_parallel: true
          parallel_nums: 3
          error_handle_mode: "continue-on-error"
          flatten_output: true

      # NESTED NODES INSIDE ITERATION - All have iteration_id reference
      - id: "doc_extract"
        type: "document-extractor"
        position: {x: 500, y: 580}
        isInIteration: true              # Mark as nested
        iteration_id: "document_processor"  # Reference to parent container
        data:
          title: "Extract Document Text"
          variable_selector: ["iteration", "item"]  # Special iteration variable

      - id: "doc_summary"  
        type: "llm"
        position: {x: 700, y: 580}
        isInIteration: true              # Mark as nested
        iteration_id: "document_processor"  # Reference to parent container
        data:
          title: "Summarize Document"
          model:
            provider: "openai"
            name: "gpt-4"
            mode: "chat"
          prompt_template:
            - role: "user"
              text: "Summarize this document:\n\n{{#doc_extract.content#}}"

      # 9. TOOL NODE - External API integration  
      - id: "translate_response"
        type: "tool"
        position: {x: 1580, y: 280}
        data:
          title: "Translate Response"
          desc: "Translate response to customer's preferred language"
          provider_id: "google"
          provider_type: "built-in"
          tool_name: "translate"
          tool_parameters:
            text:
              value: ["format_response", "final_response"]
              type: "variable"
            target_language:
              value: "es"  # Spanish
              type: "constant"
            source_language:
              value: "auto"
              type: "constant"

      # 10. PARAMETER EXTRACTOR - Extract structured data
      - id: "extract_details"
        type: "parameter-extractor"
        position: {x: 680, y: 580}
        data:
          title: "Extract Issue Details"
          desc: "Extract structured information from customer question"
          model:
            provider: "openai"
            name: "gpt-4"
            mode: "chat"
          query: ["start", "user_question"]
          reasoning_mode: "function_call"
          parameters:
            - name: "issue_type"
              type: "string"
              description: "The main type of issue or question"
              required: true
              options: ["login", "billing", "technical", "feature_request", "bug_report"]
            - name: "urgency_level"
              type: "string"  
              description: "How urgent is this issue"
              required: true
              options: ["low", "medium", "high", "critical"]
            - name: "product_area"
              type: "string"
              description: "Which product or service area is affected"
              required: false

      # 11. TEMPLATE TRANSFORM - Format with Jinja2
      - id: "email_template"
        type: "template-transform"
        position: {x: 1280, y: 480}
        data:
          title: "Generate Email Template"
          desc: "Create formatted email response"
          variables:
            - variable: "response_text"
              value_selector: ["format_response", "final_response"]
            - variable: "customer_name"
              value_selector: ["customer_lookup", "name"]
            - variable: "ticket_id"
              value_selector: ["sys", "workflow_execution_id"]
          template: |
            Subject: Re: Your Support Request #{{ ticket_id[:8] }}
            
            Dear {{ customer_name or 'Valued Customer' }},
            
            Thank you for contacting our support team. Here's the information you requested:
            
            {{ response_text }}
            
            Best regards,
            The Support Team
            
            ---
            Reference: {{ ticket_id }}
            Date: {{ sys.timestamp.strftime('%Y-%m-%d %H:%M:%S') }}

      # 12. ANSWER NODE - Final workflow output
      - id: "final_answer"
        type: "answer"
        position: {x: 1880, y: 280}
        data:
          title: "Customer Response"
          desc: "Final formatted response to customer"
          answer: |
            {{#translate_response.translated_text#}}
            
            ---
            Support Level: {{#format_response.customer_tier#}}
            Issue Type: {{#extract_details.issue_type#}}
            Urgency: {{#extract_details.urgency_level#}}

    # Edge connections between nodes
    edges:
      # Main flow
      - id: "start_to_classifier"
        source: "start"
        target: "classifier"
        sourceHandle: "source"
        targetHandle: "target"
        
      # Classification routing  
      - id: "classifier_to_knowledge"
        source: "classifier"
        target: "knowledge_search"
        sourceHandle: "technical_support"
        targetHandle: "target"
        type: "condition"
        
      - id: "classifier_to_customer_lookup"
        source: "classifier" 
        target: "customer_lookup"
        sourceHandle: "billing_inquiry"
        targetHandle: "target"
        type: "condition"
        
      # Knowledge to LLM response
      - id: "knowledge_to_llm"
        source: "knowledge_search"
        target: "llm_response"
        
      # Customer lookup to tier check
      - id: "lookup_to_tier_check"
        source: "customer_lookup"
        target: "tier_check"
        
      # LLM to formatting
      - id: "llm_to_format"
        source: "llm_response"
        target: "format_response"
        
      # Tier-based routing
      - id: "tier_check_premium"
        source: "tier_check"
        target: "format_response" 
        sourceHandle: "premium_customer"
        targetHandle: "target"
        type: "condition"
        
      # Format to translation
      - id: "format_to_translate"
        source: "format_response"
        target: "translate_response"
        
      # Final output
      - id: "translate_to_answer"
        source: "translate_response"
        target: "final_answer"
        
      # Document processing branch - connects to iteration container
      - id: "start_to_doc_processor"
        source: "start"
        target: "document_processor"
        data:
          isInIteration: false
          
      # NESTED EDGES INSIDE ITERATION - Connect child nodes within container
      - id: "extract_to_summary"
        source: "doc_extract"
        target: "doc_summary"
        data:
          isInIteration: true              # Mark as nested
          iteration_id: "document_processor"  # Reference to parent container
          
      # Parameter extraction
      - id: "start_to_extract"
        source: "start"
        target: "extract_details"

    # Canvas viewport configuration  
    viewport:
      x: 0
      y: 0
      zoom: 1.0
      
  # Workflow-level configuration
  features:
    file_upload:
      document:
        enabled: true
        number_limits: 5
        transfer_methods: ["local_file", "remote_url"]
    opening_statement: "Hello! I'm here to help with your questions."
    suggested_questions:
      - "How can I reset my password?"
      - "What are your business hours?"
      
  environment_variables:
    - id: "api_base_url"
      name: "API_BASE_URL"
      value: "https://api.company.com/v1"
      value_type: "string"
      
  conversation_variables:
    - id: "customer_tier"
      name: "customer_tier" 
      value_type: "string"
      description: "Customer service tier (basic, premium, enterprise)"

  # Runtime execution configuration
  execution_config:
    max_execution_time: 600        # 10 minutes maximum
    max_iteration_count: 100       # Maximum iterations in any iteration node
    max_loop_count: 10            # Maximum loops in any loop node  
    parallel_limit: 5             # Maximum parallel executions
    error_continue: false         # Stop on critical errors

