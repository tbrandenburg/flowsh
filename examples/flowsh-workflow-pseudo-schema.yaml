# Additional workflow examples showing advanced patterns:

---
# Loop Node Example - Retry mechanism with nested workflow
apiVersion: flowsh.ai/v1
kind: WorkflowNode
metadata:
  name: "api-retry-loop"
spec:
  # Main workflow nodes
  nodes:
    # Loop container node
    - id: "api_retry_loop"
      type: "loop"
      position: {x: 500, y: 600}
      data:
        title: "API Retry with Backoff"
        desc: "Retry failed API calls with exponential backoff"
        loop_count: 5
        logical_operator: "or"
        start_node_id: "make_api_call"  # Entry point for sub-workflow
        break_conditions:
          - variable_selector: ["make_api_call", "status_code"]
            comparison_operator: "="
            value: 200
          - variable_selector: ["make_api_call", "status_code"] 
            comparison_operator: "="
            value: 201
        loop_variables:
          - label: "retry_delay"
            var_type: "number"
            value_type: "constant"
            value: 1000  # Start with 1 second
          - label: "attempt_count"
            var_type: "number" 
            value_type: "constant"
            value: 0

    # NESTED NODES INSIDE LOOP - All have loop_id reference
    - id: "make_api_call"
      type: "http-request"
      position: {x: 620, y: 700}
      isInLoop: true                    # Mark as nested
      loop_id: "api_retry_loop"        # Reference to parent container
      data:
        title: "Make API Request"
        method: "POST"
        url: "https://api.example.com/endpoint"
        timeout:
          connect: 10
          read: 30
          write: 10

    - id: "update_retry_delay"
      type: "code"
      position: {x: 820, y: 700}
      isInLoop: true                    # Mark as nested  
      loop_id: "api_retry_loop"        # Reference to parent container
      data:
        title: "Calculate Backoff"
        code_language: "javascript"
        code: |
          function main({attempt_count, retry_delay}) {
            // Exponential backoff: delay = base * 2^attempt
            const new_delay = retry_delay * Math.pow(2, attempt_count);
            const new_attempt = attempt_count + 1;
            
            return {
              retry_delay: Math.min(new_delay, 30000), // Cap at 30 seconds
              attempt_count: new_attempt
            };
          }
        outputs:
          retry_delay:
            type: "number"
          attempt_count:
            type: "number"

    - id: "wait_node"
      type: "code"
      position: {x: 1020, y: 700}
      isInLoop: true                    # Mark as nested
      loop_id: "api_retry_loop"        # Reference to parent container  
      data:
        title: "Wait Before Retry"
        code_language: "javascript"
        code: |
          function main({retry_delay}) {
            return new Promise(resolve => {
              setTimeout(() => {
                resolve({ waited: true });
              }, retry_delay);
            });
          }

  # Edges for nested workflow
  edges:
    # NESTED EDGES INSIDE LOOP - All carry loop context
    - id: "call_to_backoff"
      source: "make_api_call"
      target: "update_retry_delay"
      data:
        isInLoop: true                  # Mark as nested
        loop_id: "api_retry_loop"      # Reference to parent container
        
    - id: "backoff_to_wait"
      source: "update_retry_delay"
      target: "wait_node"
      data:
        isInLoop: true                  # Mark as nested
        loop_id: "api_retry_loop"      # Reference to parent container

---
# Complex Conditional Logic Example
apiVersion: flowsh.ai/v1
kind: WorkflowNode
metadata:
  name: "advanced-routing"
spec:
  id: "advanced_routing"
  type: "if-else"
  position: {x: 800, y: 600}
  data:
    title: "Advanced Customer Routing"
    desc: "Complex multi-condition routing logic"
    logical_operator: "and"
    cases:
      # VIP customers get immediate escalation
      - case_id: "vip_escalation"
        logical_operator: "and" 
        conditions:
          - variable_selector: ["customer_lookup", "tier"]
            comparison_operator: "="
            value: "vip"
          - variable_selector: ["extract_details", "urgency_level"]
            comparison_operator: ">"
            value: "medium"
            
      # Technical issues for premium customers
      - case_id: "premium_technical"
        logical_operator: "and"
        conditions:
          - variable_selector: ["customer_lookup", "tier"]
            comparison_operator: "in"
            value: ["premium", "enterprise"]
          - variable_selector: ["classifier", "class"]
            comparison_operator: "="
            value: "technical_support"
            
      # Basic customers with simple questions  
      - case_id: "basic_self_service"
        logical_operator: "and"
        conditions:
          - variable_selector: ["customer_lookup", "tier"]
            comparison_operator: "="
            value: "basic"
          - variable_selector: ["extract_details", "urgency_level"]
            comparison_operator: "<="
            value: "medium"

    # Error handling configuration
    error_strategy: "default-value"
    default_value:
      - variable: "response_text"
        value: "I apologize, but I'm currently unable to process your request. Please try again later or contact our support team directly."
        type: "string"
      - variable: "customer_tier" 
        value: "unknown"
        type: "string"

    retry_config:
      retry_enabled: true
      max_retries: 3
      retry_interval: 2000  # 2 seconds

# ==============================================================================
# COMPLETE WORKFLOW SUMMARY
# ==============================================================================

# This example demonstrates:
# 1. Multi-path routing based on question classification
# 2. Knowledge base integration for technical questions  
# 3. Customer data lookup and personalization
# 4. Conditional logic based on customer tier
# 5. Custom processing with JavaScript code
# 6. External API integrations (translation, customer lookup)
# 7. Document processing with iteration
# 8. Structured data extraction
# 9. Template-based formatting
# 10. Comprehensive error handling and retry logic
# 11. Advanced features like loops and complex conditions
#
# The workflow provides a complete customer support experience with:
# - Intelligent question routing
# - Context-aware responses  
# - Personalization based on customer data
# - Multi-language support
# - Document processing capabilities
# - Robust error handling
# - Scalable parallel processing