  # ==============================================================================
  # TEMPLATE SYSTEM DEFINITIONS  
  # ==============================================================================
  # flowsh implements a comprehensive multi-layered template system:
  # 1. Advanced Prompt Templates - Model-specific prompt configurations
  # 2. Pipeline Templates - RAG pipeline templates with sharing capabilities  
  # 3. Workflow Templates - Template-based workflow initialization
  # 4. Template Transform Nodes - Runtime Jinja2 template processing
  
  TemplateReference:
    type: object
    required: ["type", "source"]
    properties:
      type:
        type: string
        enum: ["prompt", "pipeline", "workflow", "jinja2", "custom"]
        description: "Type of template being referenced"
      source:
        type: string
        enum: ["built-in", "database", "customized", "remote", "inline", "library"]
        description: "Source of template storage"
      template_id:
        type: string
        description: "Unique identifier for the template"
      template_name:
        type: string
        description: "Human-readable template name"
      version:
        type: string
        description: "Template version (semantic versioning supported)"
        pattern: "^(\\d+\\.\\d+\\.\\d+|latest)$"
      parameters:
        type: object
        description: "Parameter overrides for template instantiation"
        additionalProperties: true
      url:
        type: string
        format: uri
        description: "URL for remote template sources"
      cache_policy:
        $ref: "#/definitions/TemplateCachePolicy"
      validation:
        $ref: "#/definitions/TemplateValidationConfig"

  PromptTemplate:
    type: object
    required: ["template_type", "content"]
    properties:
      template_type:
        type: string
        enum: ["chat", "completion", "baichuan_chat", "baichuan_completion"]
        description: "Model-specific prompt template type"
      content:
        oneOf:
          - $ref: "#/definitions/ChatPromptConfig"
          - $ref: "#/definitions/CompletionPromptConfig"
      has_context:
        type: boolean
        default: false
        description: "Whether template includes context injection"
      context_template:
        type: string
        description: "Context injection template (CONTEXT or BAICHUAN_CONTEXT)"
      stop_sequences:
        type: array
        items:
          type: string
        description: "Stop sequences for completion"
      model_specific_config:
        type: object
        additionalProperties: true
        description: "Model-specific configuration overrides"

  PipelineTemplate:
    type: object
    required: ["name", "chunk_structure", "yaml_content"]
    properties:
      id:
        type: string
        description: "Unique pipeline template identifier"
      tenant_id:
        type: string
        description: "Workspace/tenant scope (null for built-in templates)"
      name:
        type: string
        maxLength: 255
        description: "Pipeline template name"
      description:
        type: string
        description: "Detailed template description"
      chunk_structure:
        type: string
        maxLength: 255
        description: "Text chunking strategy identifier"
      icon:
        type: object
        properties:
          type:
            type: string
            enum: ["emoji", "lucide", "custom"]
          value:
            type: string
          color:
            type: string
            pattern: "^#[0-9A-Fa-f]{6}$"
        description: "Template icon configuration"
      yaml_content:
        type: string
        description: "RAG pipeline DSL in YAML format"
      export_data:
        type: object
        description: "Exportable template data with secrets included"
      copyright:
        type: string
        maxLength: 255
        description: "Copyright information (built-in templates)"
      privacy_policy:
        type: string
        maxLength: 255
        description: "Privacy policy URL (built-in templates)"
      position:
        type: integer
        description: "Display position in template library"
      install_count:
        type: integer
        minimum: 0
        description: "Number of installations/uses"
      language:
        type: string
        maxLength: 255
        description: "Template language/locale"
      created_by:
        type: string
        description: "Creator user ID"
      updated_by:
        type: string
        description: "Last modifier user ID"
      sharing_scope:
        type: string
        enum: ["private", "workspace", "public"]
        default: "workspace"
        description: "Template sharing visibility"
      tags:
        type: array
        items:
          type: string
        description: "Template categorization tags"
      version_history:
        type: array
        items:
          $ref: "#/definitions/TemplateVersionInfo"
        description: "Template version history"

  WorkflowTemplate:
    type: object
    required: ["name", "workflow_dsl"]
    properties:
      id:
        type: string
        description: "Unique workflow template identifier"
      name:
        type: string
        description: "Workflow template name"
      description:
        type: string
        description: "Template description and usage guidance"
      category:
        type: string
        enum: ["business", "creative", "technical", "analytics", "automation"]
        description: "Template category for organization"
      workflow_dsl:
        $ref: "#/definitions/WorkflowSpec"
        description: "Complete workflow definition"
      parameters:
        type: array
        items:
          $ref: "#/definitions/TemplateParameter"
        description: "Configurable template parameters"
      default_values:
        type: object
        additionalProperties: true
        description: "Default parameter values"
      required_integrations:
        type: array
        items:
          type: string
        description: "Required external integrations/tools"
      complexity_level:
        type: string
        enum: ["beginner", "intermediate", "advanced", "expert"]
        description: "Template complexity assessment"
      estimated_tokens:
        type: integer
        minimum: 0
        description: "Estimated token consumption"

  TemplateParameter:
    type: object
    required: ["name", "type"]
    properties:
      name:
        type: string
        pattern: "^[a-zA-Z_][a-zA-Z0-9_]*$"
        description: "Parameter identifier"
      type:
        type: string
        enum: ["string", "number", "boolean", "array", "object", "select"]
        description: "Parameter data type"
      description:
        type: string
        description: "Parameter usage description"
      required:
        type: boolean
        default: false
        description: "Whether parameter is required"
      default_value:
        description: "Default parameter value"
      validation:
        $ref: "#/definitions/ParameterValidation"
      options:
        type: array
        items:
          type: string
        description: "Available options for select type parameters"
      placeholder:
        type: string
        description: "UI placeholder text"

  ParameterValidation:
    type: object
    properties:
      min_length:
        type: integer
        minimum: 0
      max_length:
        type: integer
        minimum: 0
      pattern:
        type: string
        format: regex
      minimum:
        type: number
      maximum:
        type: number
      enum:
        type: array
        items:
          type: string

  TemplateValidationConfig:
    type: object
    properties:
      validate_syntax:
        type: boolean
        default: true
        description: "Validate Jinja2 template syntax"
      validate_variables:
        type: boolean
        default: true
        description: "Validate variable references"
      strict_mode:
        type: boolean
        default: false
        description: "Strict variable validation mode"
      allowed_functions:
        type: array
        items:
          type: string
        description: "Whitelist of allowed template functions"
      security_scan:
        type: boolean
        default: true
        description: "Security vulnerability scanning"
      max_template_size:
        type: integer
        default: 100000
        description: "Maximum template size in characters"

  TemplateCachePolicy:
    type: object
    properties:
      cache_enabled:
        type: boolean
        default: true
        description: "Enable template caching"
      cache_duration:
        type: integer
        minimum: 60
        maximum: 86400
        default: 3600
        description: "Cache duration in seconds"
      invalidate_on_update:
        type: boolean
        default: true
        description: "Invalidate cache when template is updated"
      version_specific_cache:
        type: boolean
        default: true
        description: "Cache specific template versions separately"

  TemplateVersionInfo:
    type: object
    required: ["version", "created_at"]
    properties:
      version:
        type: string
        pattern: "^\\d+\\.\\d+\\.\\d+$"
        description: "Semantic version number"
      created_at:
        type: string
        format: date-time
      created_by:
        type: string
        description: "Version author"
      changelog:
        type: string
        description: "Version changes description"
      breaking_changes:
        type: boolean
        default: false
        description: "Whether version contains breaking changes"
      deprecated:
        type: boolean
        default: false
        description: "Whether version is deprecated"

  TemplateLibrary:
    type: object
    properties:
      library_id:
        type: string
        description: "Template library identifier"
      name:
        type: string
        description: "Library display name"
      description:
        type: string
        description: "Library description"
      source_type:
        type: string
        enum: ["built-in", "workspace", "marketplace", "git", "url"]
        description: "Library source type"
      source_url:
        type: string
        format: uri
        description: "Library source URL"
      access_control:
        $ref: "#/definitions/TemplateAccessControl"
      templates:
        type: array
        items:
          oneOf:
            - $ref: "#/definitions/PromptTemplate"
            - $ref: "#/definitions/PipelineTemplate"  
            - $ref: "#/definitions/WorkflowTemplate"
      sync_config:
        $ref: "#/definitions/LibrarySyncConfig"

  TemplateAccessControl:
    type: object
    properties:
      public_read:
        type: boolean
        default: false
      workspace_read:
        type: boolean
        default: true
      workspace_write:
        type: boolean
        default: false
      owner_permissions:
        type: array
        items:
          type: string
          enum: ["read", "write", "delete", "share", "admin"]

  LibrarySyncConfig:
    type: object
    properties:
      auto_sync:
        type: boolean
        default: false
      sync_interval:
        type: integer
        minimum: 3600
        default: 86400
        description: "Sync interval in seconds"
      sync_on_startup:
        type: boolean
        default: true
      conflict_resolution:
        type: string
        enum: ["overwrite", "merge", "skip", "prompt"]
        default: "skip"

# Additional validation patterns
patternProperties:
  "^[a-zA-Z_][a-zA-Z0-9_]*$":
    description: "Valid identifier pattern for variable names"

# ==============================================================================
# NESTED WORKFLOWS DOCUMENTATION
# ==============================================================================
#
# flowsh uses a "flat graph with references" approach for nested workflows:
#
# 1. ITERATION NODES:
#    - Create sub-workflows that process array items
#    - Child nodes have isInIteration: true and iteration_id: "container_node_id"
#    - start_node_id points to the first node in the sub-workflow
#    - All nodes with matching iteration_id form the sub-workflow
#    - Edges within the iteration also carry iteration_id context
#
# 2. LOOP NODES:
#    - Create sub-workflows that execute repeatedly
#    - Child nodes have isInLoop: true and loop_id: "container_node_id"  
#    - start_node_id points to the first node in the sub-workflow
#    - All nodes with matching loop_id form the sub-workflow
#    - Edges within the loop also carry loop_id context
#
# 3. GRAPH STRUCTURE:
#    - All nodes exist at the same level in the nodes array
#    - Container relationships are established via ID references
#    - No physical nesting - logical nesting through metadata
#
# 4. EXECUTION FLOW:
#    - Container nodes execute their sub-workflows by filtering nodes by ID
#    - Variable scoping is maintained through execution context
#    - Results are collected and processed according to container configuration
#
# 5. EXAMPLE STRUCTURE:
#    nodes:
#      - id: "iteration1"
#        type: "iteration"
#        data:
#          start_node_id: "child1"
#          iterator_selector: ["start", "items"]
#          
#      - id: "child1" 
#        type: "llm"
#        isInIteration: true
#        iteration_id: "iteration1"
#        data: {...}
#        
#      - id: "child2"
#        type: "code"  
#        isInIteration: true
#        iteration_id: "iteration1"
#        data: {...}
#        
#    edges:
#      - source: "child1"
#        target: "child2"
#        data:
#          isInIteration: true
#          iteration_id: "iteration1"