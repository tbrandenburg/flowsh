# =============================================================================
# WORKFLOW METADATA
# =============================================================================
features:
  file_upload: false
  opening_statement: |
    Welcome to the Enhanced AI-Powered Product Development Pipeline! 🚀
    
    This workflow leverages Dify's comprehensive template system to provide:
    
    ✨ **Expert Templates**: Industry-proven prompts from product managers, architects, and developers
    🔄 **Reusable Components**: Template libraries for consistent, high-quality results  
    ⚡ **Smart Caching**: Optimized performance with intelligent template caching
    🛡️ **Validated Security**: All templates undergo security and syntax validation
    
    Steps in this enhanced workflow:
    
    1. **PRD Generation** - Expert product manager template creates comprehensive requirements
    2. **Implementation Planning** - Software architect template breaks down into stories
    3. **Story Parsing** - Template transform extracts structured implementation tasks
    4. **Story Implementation** - Senior developer templates generate production-ready code
    5. **Professional Formatting** - Documentation templates create polished deliverables
    
    Simply describe your product idea and select your preferences!
    
  suggested_questions:
    - "I want to build a task management app for remote teams with AI-powered prioritization"
    - "Create a personal finance tracker with budget alerts and investment recommendations"  
    - "Build an AI-powered content recommendation system for e-learning platforms"
    - "Develop a real-time collaboration whiteboard tool with voice integration"

# =============================================================================
# EXAMPLE TEMPLATE DEFINITIONS
# =============================================================================
example_template_definitions:
  product_manager_expert:
    template_id: "product-manager-expert-v3"
    template_type: "prompt"
    source: "library"
    description: "Expert product manager template optimized for comprehensive PRD creation"
    parameters:
      expertise_domain: "product_management"
      output_format: "comprehensive_prd"
      include_technical_considerations: true
      target_tech_stack: "configurable"
    version_history:
      - version: "1.5.0"
        changes: "Enhanced technical considerations section"
        created_at: "2024-01-15"
        
  story_parser_template:
    template_id: "story-parser-v1"
    template_type: "jinja2"
    source: "customized"  
    description: "Intelligent story extraction from implementation plans"
    template_content: |
      {% set plan_text = plan_text | default('') %}
      {% set tech_stack = tech_stack | default('general') %}
      {% set stories = [] %}
      
      {# Advanced parsing logic with context awareness #}
      {% set sections = plan_text.split('\n\n') %}
      {% for section in sections %}
        {% if section | length > 100 %}
          {% set lines = section.split('\n') %}
          {% set title = lines[0].strip('#').strip() %}
          {% if 'story' in title.lower() or 'task' in title.lower() or 'implement' in title.lower() %}
            {% set content = lines[1:] | join('\n') %}
            {% set complexity = 3 %}  {# Default complexity #}
            
            {# Determine complexity based on keywords #}
            {% if 'database' in content.lower() or 'api' in content.lower() %}
              {% set complexity = 4 %}
            {% endif %}
            {% if 'ai' in content.lower() or 'machine learning' in content.lower() %}
              {% set complexity = 5 %}
            {% endif %}
            
            {# Determine type based on tech stack and content #}
            {% set story_type = 'fullstack' %}
            {% if 'ui' in content.lower() or 'component' in content.lower() %}
              {% set story_type = 'frontend' %}
            {% elif 'database' in content.lower() or 'server' in content.lower() %}
              {% set story_type = 'backend' %}
            {% endif %}
            
            {% set story = {
              'id': 'story_' + loop.index|string,
              'title': title,
              'content': content,
              'complexity': complexity,
              'type': story_type,
              'tech_stack': tech_stack,
              'status': 'pending',
              'estimated_effort': complexity * 2
            } %}
            {% set _ = stories.append(story) %}
          {% endif %}
        {% endif %}
      {% endfor %}
      
      {
        "stories": {{ stories | tojson }},
        "total_count": {{ stories | length }},
        "total_complexity": {{ stories | sum(attribute='complexity') }},
        "estimated_total_effort": {{ stories | sum(attribute='estimated_effort') }}
      }
    validation:
      validate_syntax: true
      validate_variables: true
      security_scan: true

