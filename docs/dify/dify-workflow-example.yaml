# Dify Workflow Example: AI-Powered Product Development Pipeline
# This workflow demonstrates a complete product development cycle from idea to implementation
# Enhanced with Dify's comprehensive template system for maximum reusability

workflow:
  name: "AI Product Development Pipeline"
  description: "Transform product ideas into working implementations through AI agents with reusable templates"
  version: "2.0.0"
  
  # Template library references for reusable components
  template_dependencies:
    - template_id: "product-manager-expert-v3"
      type: "prompt"
      source: "library"
      version: "1.5.0"
    - template_id: "software-architect-v2"  
      type: "prompt"
      source: "customized"
      version: "2.1.0"
    - template_id: "senior-developer-v4"
      type: "prompt" 
      source: "built-in"
      version: "1.8.0"
  
environment_variables:
  - variable: "project_name"
    name: "Project Name"
    type: "text"
    description: "Name of the product being developed"
    
  - variable: "tech_stack"
    name: "Technology Stack"
    type: "select"
    description: "Preferred technology stack"
    options: ["React/Node.js", "Python/Django", "Vue/FastAPI"]
    
  - variable: "development_style"
    name: "Development Style"
    type: "select"
    description: "Code style and methodology preference"
    options: ["agile", "tdd", "clean-architecture", "microservices"]
    
conversation_variables:
  - variable: "development_context"
    name: "Development Context"
    type: "object"
    description: "Accumulated context throughout development process"
  - variable: "template_cache"
    name: "Template Cache"
    type: "object"
    description: "Cached template responses for optimization"

graph:
  nodes:
    # =============================================================================
    # WORKFLOW START
    # =============================================================================
    start_node:
      id: "start"
      type: "start"
      data:
        title: "Product Development Start"
        desc: "Begin the AI-powered product development pipeline"
        variables:
          - variable: "product_idea"
            type: "text"
            label: "Product Idea"
            description: "Describe your product idea in detail"
            required: true

    # =============================================================================
    # PHASE 1: PRD GENERATION WITH EXPERT TEMPLATE
    # =============================================================================
    prd_generation:
      id: "prd_agent"
      type: "llm"
      data:
        title: "PRD Generation Agent"
        desc: "Create comprehensive Product Requirements Document using expert template"
        model:
          provider: "openai"
          name: "gpt-4o"
          mode: "chat"
          completion_params:
            temperature: 0.3
            max_tokens: 4000
        # Using template reference instead of inline prompt
        prompt_template:
          type: "prompt"
          source: "library"
          template_id: "product-manager-expert-v3"
          version: "1.5.0"
        template_parameters:
          expertise_domain: "product_management"
          output_format: "comprehensive_prd"
          include_technical_considerations: true
          target_tech_stack: "{{#env.tech_stack#}}"
        advanced_prompt_config:
          app_mode: "chat"
          model_mode: "chat"
          has_context: true
          template_type: "chat_app_chat"
        # Fallback to inline prompt if template unavailable
        prompt_template_fallback:
          - role: "system"
            text: |
              You are a Senior Product Manager with expertise in writing comprehensive PRDs.
              Transform the user's product idea into a detailed Product Requirements Document.
              
              Structure your PRD with these sections:
              1. Executive Summary
              2. Problem Statement  
              3. Target Users & Use Cases
              4. Features & Requirements
              5. Technical Considerations
              6. Success Metrics
              7. Timeline & Milestones
              
              Focus on {{#env.tech_stack#}} technology stack.
              
          - role: "user"
            text: |
              Product Idea: {{#sys.query#}}
              Project Name: {{#env.project_name#}}
              Please create a comprehensive PRD for this product idea.

    # =============================================================================
    # PHASE 2: IMPLEMENTATION PLANNING WITH ARCHITECT TEMPLATE
    # =============================================================================
    implementation_planning:
      id: "planning_agent"
      type: "llm"
      data:
        title: "Implementation Planning Agent"
        desc: "Break down PRD into actionable implementation stories using software architect template"
        model:
          provider: "openai"
          name: "gpt-4o"
          mode: "chat"
          completion_params:
            temperature: 0.2
            max_tokens: 3000
        # Reference to customized architect template
        prompt_template:
          type: "prompt"
          source: "customized"
          template_id: "software-architect-v2"
          version: "2.1.0"
        template_parameters:
          architecture_style: "{{#env.development_style#}}"
          tech_stack: "{{#env.tech_stack#}}"
          story_count_target: 8
          complexity_scoring: true
          dependency_analysis: true
        cache_policy:
          cache_enabled: true
          cache_duration: 1800
        # Validation ensures template meets requirements
        template_validation:
          validate_syntax: true
          validate_variables: true
          strict_mode: false

    # =============================================================================
    # PHASE 3: STORY EXTRACTION WITH TEMPLATE TRANSFORM
    # =============================================================================
    story_extraction:
      id: "extract_stories"
      type: "template-transform"
      data:
        title: "Extract Implementation Stories"
        desc: "Parse implementation plan into individual stories using template transform"
        # Using external Jinja2 template for story parsing
        template:
          type: "jinja2"
          source: "customized"
          template_id: "story-parser-v1"
          version: "1.2.0"
        template_parameters:
          max_stories: 8
          story_format: "structured_object"
          include_metadata: true
        variables:
          - variable: "plan_text"
            value_selector: ["planning_agent", "text"]
          - variable: "tech_stack"
            value_selector: ["env", "tech_stack"]
        template_validation:
          validate_syntax: true
          validate_variables: true
          security_scan: true
        # Fallback inline template if external template fails
        template_fallback: |
          {% set plan_text = plan_text | default('') %}
          {% set stories = [] %}
          
          {# Parse stories using markdown headers #}
          {% for line in plan_text.split('\n') %}
            {% if line.startswith('#') and ('story' in line.lower() or 'task' in line.lower()) %}
              {% set title = line.lstrip('#').strip() %}
              {% set story = {
                'id': 'story_' + loop.index|string,
                'title': title,
                'content': '',
                'status': 'pending'
              } %}
              {% set _ = stories.append(story) %}
            {% endif %}
          {% endfor %}
          
          {
            "stories": {{ stories | tojson }},
            "total_count": {{ stories | length }}
          }

    # =============================================================================
    # PHASE 4: STORY IMPLEMENTATION ITERATION WITH DEVELOPER TEMPLATE
    # =============================================================================
    story_iteration:
      id: "story_loop"
      type: "iteration"
      data:
        title: "Implement Each Story"
        desc: "Iterate through stories and implement each one using expert developer templates"
        iterator_selector: ["extract_stories", "stories"]
        output_selector: ["story_implementation", "text"]
        start_node_id: "story_implementation"
        
    # Story implementation node with advanced template usage
    story_implementation:
      id: "story_implementation"
      type: "llm"
      isInIteration: true
      iteration_id: "story_loop"
      data:
        title: "Coding Agent - Story Implementation"
        desc: "Implement individual development story with expert developer template"
        model:
          provider: "openai"
          name: "gpt-4o"
          mode: "chat"
          completion_params:
            temperature: 0.1
            max_tokens: 4000
        # Reference to built-in senior developer template
        prompt_template:
          type: "prompt"
          source: "built-in"
          template_id: "senior-developer-v4"
          version: "1.8.0"
        template_parameters:
          tech_stack: "{{#env.tech_stack#}}"
          development_style: "{{#env.development_style#}}"
          code_quality_level: "production"
          include_tests: true
          include_documentation: true
          error_handling: "comprehensive"
        advanced_prompt_config:
          app_mode: "completion"
          model_mode: "chat"
          has_context: true
        # Dynamic template selection based on story complexity
        template_selection_logic:
          - condition: "{{iteration.item.complexity}} > 4"
            template_id: "expert-developer-v2"
          - condition: "{{iteration.item.type}} == 'frontend'"
            template_id: "frontend-specialist-v1"
          - condition: "{{iteration.item.type}} == 'backend'"
            template_id: "backend-specialist-v1"
          - default: "senior-developer-v4"

    # =============================================================================
    # PHASE 5: RESULTS COMPILATION WITH FORMATTING TEMPLATE
    # =============================================================================
    format_results:
      id: "format_deliverables" 
      type: "template-transform"
      data:
        title: "Format Final Deliverables"
        desc: "Format all outputs using professional documentation template"
        template:
          type: "jinja2"
          source: "library"
          template_name: "project-deliverable-formatter"
          version: "latest"
        variables:
          - variable: "project_name"
            value_selector: ["env", "project_name"]
          - variable: "tech_stack"
            value_selector: ["env", "tech_stack"]
          - variable: "prd_content"
            value_selector: ["prd_agent", "text"]
          - variable: "implementation_plan"
            value_selector: ["planning_agent", "text"]
          - variable: "story_implementations"
            value_selector: ["story_loop"]
        template_parameters:
          format: "markdown"
          include_toc: true
          include_setup_guide: true
          include_deployment_notes: true
        cache_policy:
          cache_enabled: false  # Always generate fresh documentation
          
    compile_results:
      id: "compile_results"
      type: "llm"
      data:
        title: "Compile Final Package"
        desc: "Create comprehensive development package with executive summary"
        model:
          provider: "openai"
          name: "gpt-4o"
          mode: "chat"
          completion_params:
            temperature: 0.2
            max_tokens: 2000
        prompt_template:
          type: "prompt"
          source: "built-in"
          template_id: "technical-project-manager-v1"
        template_parameters:
          deliverable_type: "complete_development_package"
          include_executive_summary: true
          include_next_steps: true
          target_audience: "technical_and_business"
        # Input from formatted deliverables
        context_inputs:
          formatted_deliverables: "{{#format_deliverables.result#}}"
          project_metadata:
            project_name: "{{#env.project_name#}}"
            tech_stack: "{{#env.tech_stack#}}"
            development_style: "{{#env.development_style#}}"

    # =============================================================================
    # WORKFLOW END
    # =============================================================================
    end_node:
      id: "end"
      type: "end"
      data:
        outputs:
          prd:
            type: "string"
            value: "{{#prd_agent.text#}}"
          implementation_plan:
            type: "string" 
            value: "{{#planning_agent.text#}}"
          story_implementations:
            type: "array"
            value: "{{#story_loop#}}"
          formatted_deliverables:
            type: "string"
            value: "{{#format_deliverables.result#}}"
          final_package:
            type: "string"
            value: "{{#compile_results.text#}}"
          project_summary:
            type: "object"
            value:
              project_name: "{{#env.project_name#}}"
              tech_stack: "{{#env.tech_stack#}}"
              development_style: "{{#env.development_style#}}"
              stories_completed: "{{#extract_stories.total_count#}}"
              templates_used:
                - "product-manager-expert-v3"
                - "software-architect-v2" 
                - "story-parser-v1"
                - "senior-developer-v4"
                - "project-deliverable-formatter"
                - "technical-project-manager-v1"
              workflow_status: "completed"

  # =============================================================================
  # WORKFLOW CONNECTIONS
  # =============================================================================
  edges:
    - id: "start-to-prd"
      source: "start"
      target: "prd_agent"
      
    - id: "prd-to-planning"
      source: "prd_agent"
      target: "planning_agent"
      
    - id: "planning-to-extraction"
      source: "planning_agent"
      target: "extract_stories"
      
    - id: "extraction-to-iteration"
      source: "extract_stories"
      target: "story_loop"
      
    - id: "iteration-to-format"
      source: "story_loop"
      target: "format_deliverables"
      
    - id: "format-to-compile"
      source: "format_deliverables"
      target: "compile_results"
      
    - id: "compile-to-end"
      source: "compile_results"
      target: "end"
      
    # Iteration internal connection
    - id: "loop-to-implementation"
      source: "story_loop"
      target: "story_implementation"
      sourceHandle: "iteration-start"
      targetHandle: "iteration-input"

