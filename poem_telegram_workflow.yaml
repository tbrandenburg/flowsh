workflow:
  name: 'poem-to-telegram'
  description: 'Generate a poem using LLM and send it via Telegram'

environment_variables:
  - variable: 'telegram_bot_token'
    name: 'Telegram Bot Token'
    type: 'text'
    description: 'Bot token from @BotFather (required for sending messages)'
  - variable: 'telegram_chat_id'
    name: 'Telegram Chat ID'
    type: 'text'
    description: 'Chat ID or channel username where the poem will be sent'

graph:
  nodes:
    - id: 'start'
      type: 'start'
      data:
        title: 'Poem Generation & Telegram Workflow'
        description: 'Generate a beautiful poem and share it via Telegram'
        variables:
          - variable: 'poem_theme'
            type: 'text'
            label: 'Poem Theme'
            description: 'What should the poem be about?'
            required: true
            default: 'artificial intelligence and creativity'
          - variable: 'poem_style'
            type: 'select'
            label: 'Poem Style'
            description: 'What style of poem would you like?'
            required: true
            options: ['haiku', 'sonnet', 'free verse', 'limerick', 'acrostic']
            default: 'free verse'
          - variable: 'recipient_name'
            type: 'text'
            label: 'Recipient Name'
            description: 'Who should the poem be dedicated to?'
            required: false
            default: 'Dear Friend'

    - id: 'generate_poem'
      type: 'llm'
      data:
        title: 'Generate Creative Poem'
        model:
          name: 'gpt-4'
        prompt: "Write a beautiful ${poem_style} poem about ${poem_theme}. Make it heartfelt and creative, suitable for sharing. Keep it under 12 lines unless it's a sonnet. Don't include any introductory text, just the poem itself."

    - id: 'format_telegram_message'
      type: 'variable-assignment'
      data:
        title: 'Format Message for Telegram'
        description: 'Create a nicely formatted message with the poem'
        variable: 'telegram_message'
        assignment_type: 'constant'
        value: |
          🎭 A Poem for ${recipient_name} 🎭

          📝 Theme: ${poem_theme}
          🎨 Style: ${poem_style}

          ✨ Your Poem:

          ${llm_content}

          💫 Generated with love by flowsh
          🤖 Powered by AI creativity

    - id: 'send_to_telegram'
      type: 'telegram'
      data:
        title: 'Send Poem via Telegram'
        description: 'Deliver the beautiful poem to Telegram'
        message: '${telegram_message}'
        parse_mode: 'HTML'
        max_retries: 2

    - id: 'completion_notice'
      type: 'answer'
      data:
        title: 'Poem Successfully Shared!'
        description: 'The creative workflow has completed successfully'
        answer: |
          # 🎭 Poem Generation & Telegram Delivery Complete!

          ## 📋 Summary
          - **Theme**: ${poem_theme}
          - **Style**: ${poem_style}  
          - **Recipient**: ${recipient_name}
          - **LLM Fallback System**: Used LLMv7 (no OpenAI key required)
          - **Telegram**: ✅ Message sent successfully

          ## 🚀 Workflow Features Demonstrated
          - **Two-stage LLM fallback**: OpenAI → LLMv7 → demo
          - **Dynamic prompt generation**: User-customizable themes and styles
          - **Variable substitution**: Personalized content creation
          - **Telegram integration**: Rich HTML formatting
          - **Error handling**: Robust delivery with retries

          ## ✨ Your Generated Poem
          **Theme**: ${poem_theme}
          **Style**: ${poem_style}

          ${llm_content}

          🎉 The poem has been successfully sent to your Telegram chat!
        type: 'markdown'

  edges:
    - source: 'start'
      target: 'generate_poem'

    - source: 'generate_poem'
      target: 'format_telegram_message'

    - source: 'format_telegram_message'
      target: 'send_to_telegram'

    - source: 'send_to_telegram'
      target: 'completion_notice'
