workflow:
  name: 'simple-telegram-test'
  description: 'Test workflow with static values'

graph:
  nodes:
    - id: 'start'
      type: 'start'
      data:
        title: 'Start'

    - id: 'generate_poem'
      type: 'llm'
      data:
        title: 'Generate Poem'
        model:
          name: 'gpt-4'
        prompt: 'Write a haiku about artificial intelligence. Just the haiku, nothing else.'

    - id: 'create_message'
      type: 'variable-assignment'
      data:
        title: 'Create Message'
        variable: 'telegram_message'
        assignment_type: 'constant'
        value: 'Here is your AI poem: ${llm_content}'

    - id: 'mock_telegram'
      type: 'code'
      data:
        title: 'Mock Telegram Send'
        command: 'echo'
        args: ['📱 Would send to Telegram: ${telegram_message}']

  edges:
    - source: 'start'
      target: 'generate_poem'
    - source: 'generate_poem'
      target: 'create_message'
    - source: 'create_message'
      target: 'mock_telegram'
