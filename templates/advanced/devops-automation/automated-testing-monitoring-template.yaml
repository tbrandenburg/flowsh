workflow:
  name: 'Automated Testing & Monitoring - DevOps Automation'
  description: 'Comprehensive automated testing and monitoring system with CI/CD integration, health checks, performance monitoring, and intelligent alerting for robust DevOps operations'

environment_variables:
  - variable: 'SERVICE_URL'
    name: 'Service URL to Monitor'
    type: 'text'
    description: 'Base URL of the service/application to test and monitor'
    required: true
    default: 'https://httpbin.org'
  - variable: 'TEST_ENDPOINTS'
    name: 'Test Endpoints'
    type: 'text'
    description: 'Comma-separated list of endpoints to test (relative to service URL)'
    required: false
    default: '/status/200,/delay/1,/json'
  - variable: 'MONITORING_FREQUENCY'
    name: 'Monitoring Frequency'
    type: 'text'
    description: 'How often to run monitoring checks: continuous, hourly, daily, on-demand'
    required: false
    default: 'on-demand'
  - variable: 'PERFORMANCE_THRESHOLDS'
    name: 'Performance Thresholds'
    type: 'text'
    description: 'JSON object with performance limits: {"response_time": 2000, "error_rate": 5}'
    required: false
    default: '{"response_time": 2000, "error_rate": 5, "availability": 99}'
  - variable: 'TEST_TYPES'
    name: 'Test Types to Execute'
    type: 'text'
    description: 'Comma-separated test types: health_check,performance,security,integration'
    required: false
    default: 'health_check,performance,integration'
  - variable: 'ALERT_CHANNELS'
    name: 'Alert Channels'
    type: 'text'
    description: 'Comma-separated alert channels: telegram,log,email'
    required: false
    default: 'telegram,log'
  - variable: 'OPENAI_API_KEY'
    name: 'OpenAI API Key'
    type: 'secret'
    description: 'API key for AI-powered test analysis and reporting'
    required: true
  - variable: 'TELEGRAM_BOT_TOKEN'
    name: 'Telegram Bot Token'
    type: 'secret'
    description: 'Bot token for test result notifications'
    required: false
    default: ''
  - variable: 'TELEGRAM_CHAT_ID'
    name: 'Telegram Chat ID'
    type: 'text'
    description: 'Chat ID for monitoring alerts'
    required: false
    default: ''
  - variable: 'ALERT_LEVEL'
    name: 'Alert Level Variable'
    type: 'text'
    description: 'Internal processing variable for alert severity level'
    required: false
    default: ''
  - variable: 'ALERT_MESSAGE'
    name: 'Alert Message Variable'
