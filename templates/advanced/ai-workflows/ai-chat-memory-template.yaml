workflow:
  name: 'AI Chat with Memory - Stateful Conversations'
  description: 'Interactive AI chat system with persistent conversation history and context awareness'

environment_variables:
  - variable: 'OPENAI_API_KEY'
    name: 'OpenAI API Key'
    type: 'text'
    description: 'Your OpenAI API key for GPT integration'
    required: true
    default: ''
  - variable: 'CHAT_SYSTEM_PROMPT'
    name: 'AI System Prompt'
    type: 'text'
    description: 'System prompt defining AI personality and behavior'
    required: false
    default: 'You are a helpful AI assistant with perfect memory of our conversation.'
  - variable: 'USER_INPUT'
    name: 'User Message'
    type: 'text'
    description: 'The user message to process'
    required: true
    default: 'Hello! Please remember that I am working on a flowsh project.'
  - variable: 'CONVERSATION_ID'
    name: 'Conversation ID'
    type: 'text'
    description: 'Unique identifier for conversation history tracking'
    required: false
    default: 'demo_chat'

graph:
  nodes:
    - id: 'start'
      type: 'start'
      data:
        title: 'AI Chat with Memory System'
        description: 'Stateful conversation processing with persistent history'

    - id: 'init_conversation'
      type: 'variable-assignment'
      data:
        variable: 'CURRENT_TIMESTAMP'
        assignment_type: 'expression'
        expression: 'date "+%Y-%m-%d %H:%M:%S"'
        description: 'Initialize conversation timestamp'

    - id: 'load_previous_context'
      type: 'variable-assignment'
      data:
        variable: 'PREVIOUS_CONTEXT'
        assignment_type: 'expression'
        expression: 'cat "/tmp/chat_${CONVERSATION_ID}_context.txt" 2>/dev/null || echo "No previous conversation history found."'
        description: 'Load existing conversation context from file'

    - id: 'format_conversation_context'
      type: 'variable-assignment'
      data:
        variable: 'FORMATTED_CONTEXT'
        assignment_type: 'template'
        template: |
          Previous conversation history:
          {{PREVIOUS_CONTEXT}}

          Current session info:
          - Time: {{CURRENT_TIMESTAMP}}
          - Conversation ID: {{CONVERSATION_ID}}
        description: 'Format conversation context for AI'

    - id: 'generate_contextual_response'
      type: 'llm'
      data:
        title: 'Generate AI Response with Memory'
        description: 'AI processes user input with full conversation context'
        model:
          provider: 'openai'
          name: 'gpt-3.5-turbo'
          mode: 'chat'
          completion_params:
            temperature: 0.7
            max_tokens: 500
        prompt_template:
          - role: 'system'
            text: '{{CHAT_SYSTEM_PROMPT}} Context: {{FORMATTED_CONTEXT}}'
          - role: 'user'
            text: '{{USER_INPUT}}'

    - id: 'extract_ai_response'
      type: 'variable-assignment'
      data:
        variable: 'AI_RESPONSE_TEXT'
        assignment_type: 'context'
        context_key: 'llm_response'
        description: 'Extract AI response text for storage'

    - id: 'build_conversation_entry'
      type: 'variable-assignment'
      data:
        variable: 'CONVERSATION_ENTRY'
        assignment_type: 'template'
        template: |
          **[{{CURRENT_TIMESTAMP}}]**
          👤 User: {{USER_INPUT}}
          🤖 AI: {{AI_RESPONSE_TEXT}}
          ---
        description: 'Format new conversation turn for persistence'

    - id: 'aggregate_conversation_history'
      type: 'variable-aggregation'
      data:
        title: 'Update Conversation History'
        description: 'Combine previous context with new conversation entry'
        input_variables: ['PREVIOUS_CONTEXT', 'CONVERSATION_ENTRY']
        output_variable: 'UPDATED_HISTORY'
        aggregation_method: 'concat'
        separator: '\n'

    - id: 'persist_conversation'
      type: 'code'
      data:
        title: 'Save Updated Conversation History'
        description: 'Persist conversation to file for future sessions'
        command: '/bin/bash'
        args:
          - '-c'
          - |
            set -euo pipefail

            # Save updated conversation history
            echo "$UPDATED_HISTORY" > "/tmp/chat_${CONVERSATION_ID}_context.txt"

            # Also save a backup with timestamp
            cp "/tmp/chat_${CONVERSATION_ID}_context.txt" "/tmp/chat_${CONVERSATION_ID}_$(date +%s).txt"

            echo "✅ Conversation saved successfully"
            echo "📁 History file: /tmp/chat_${CONVERSATION_ID}_context.txt"

    - id: 'display_memory_summary'
      type: 'code'
      data:
        title: 'Display Memory System Summary'
        description: 'Show conversation memory status and results'
        command: '/bin/bash'
        args:
          - '-c'
          - |
            set -euo pipefail

            echo "# 🧠 AI Chat with Memory - Session Complete"
            echo ""
            echo "## Conversation Summary"
            echo "- Session ID: $CONVERSATION_ID"
            echo "- Timestamp: $CURRENT_TIMESTAMP"
            echo "- User Input: $USER_INPUT"
            echo ""
            echo "## AI Response"
            echo "$AI_RESPONSE_TEXT"
            echo ""
            echo "## Memory System Status"
            echo "✅ Context Loaded: Previous conversation history retrieved"
            echo "✅ Response Generated: AI used full conversation context"  
            echo "✅ History Updated: New conversation turn added to memory"
            echo "✅ Memory Persisted: Conversation saved for future sessions"
            echo ""
            echo "## Next Steps"
            echo "- Run this workflow again with the same CONVERSATION_ID to continue"
            echo "- The AI will remember all previous interactions"
            echo "- Change CONVERSATION_ID to start a fresh conversation"
            echo ""
            echo "Conversation file: /tmp/chat_${CONVERSATION_ID}_context.txt"

    - id: 'end'
      type: 'end'
      data:
        title: 'Chat Session Complete'
        description: 'Conversation processed with memory persistence'

  edges:
    - source: 'start'
      target: 'init_conversation'
    - source: 'init_conversation'
      target: 'load_previous_context'
    - source: 'load_previous_context'
      target: 'format_conversation_context'
    - source: 'format_conversation_context'
      target: 'generate_contextual_response'
    - source: 'generate_contextual_response'
      target: 'extract_ai_response'
    - source: 'extract_ai_response'
      target: 'build_conversation_entry'
    - source: 'build_conversation_entry'
      target: 'aggregate_conversation_history'
    - source: 'aggregate_conversation_history'
      target: 'persist_conversation'
    - source: 'persist_conversation'
      target: 'display_memory_summary'
    - source: 'display_memory_summary'
      target: 'end'
