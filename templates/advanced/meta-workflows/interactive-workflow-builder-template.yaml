workflow:
  name: 'Interactive Workflow Builder - Meta-Workflow Composition'
  description: 'Dynamic workflow composition system that analyzes user requirements and generates custom flowsh workflows through AI-powered analysis and template selection'

environment_variables:
  - variable: 'USER_REQUIREMENTS'
    name: 'User Requirements'
    type: 'text'
    description: 'Detailed description of what the user wants to automate'
    required: true
    default: 'I need to process customer feedback, analyze sentiment, and send alerts'
  - variable: 'TARGET_COMPLEXITY'
    name: 'Target Complexity Level'
    type: 'text'
    description: 'Desired complexity level: simple, medium, complex'
    required: false
    default: 'medium'
  - variable: 'PREFERRED_INTEGRATIONS'
    name: 'Preferred Integrations'
    type: 'text'
    description: 'Comma-separated list of preferred services: openai, telegram, http, email'
    required: false
    default: 'openai,telegram'
  - variable: 'OPENAI_API_KEY'
    name: 'OpenAI API Key'
    type: 'secret'
    description: 'API key for OpenAI GPT models'
    required: true
  - variable: 'TELEGRAM_BOT_TOKEN'
    name: 'Telegram Bot Token'
    type: 'secret'
    description: 'Bot token for Telegram notifications'
    required: true
  - variable: 'TELEGRAM_CHAT_ID'
    name: 'Telegram Chat ID'
    type: 'text'
    description: 'Chat ID for sending Telegram notifications'
    required: true

graph:
  nodes:
    - id: 'start'
      type: 'start'
      data:
        title: 'Interactive Workflow Builder'
        description: 'Starting workflow composition system'

    - id: 'analyze_requirements'
      type: 'llm'
      data:
        title: 'Analyze User Requirements'
        description: 'Use AI to analyze user requirements and suggest workflow patterns'
        model:
          provider: 'openai'
          name: 'gpt-4'
          mode: 'chat'
          completion_params:
            temperature: 0.3
            max_tokens: 1000
        prompt_template:
          - role: 'system'
            text: |
              You are a workflow automation expert specializing in flowsh YAML workflows.

              Analyze the user requirements and provide a structured analysis including:
              1. Core automation objective
              2. Required data sources and integrations
              3. Processing steps needed
              4. Output destinations
              5. Error handling requirements
              6. Recommended flowsh node types

              Available flowsh node types: start, end, code, llm, http-request, telegram, 
              if-else, loop, template-transform, variable-assignment, retry, fallback

              Respond in JSON format with clear categorization.
          - role: 'user'
            text: |
              User Requirements: ${USER_REQUIREMENTS}
              Target Complexity: ${TARGET_COMPLEXITY}
              Preferred Integrations: ${PREFERRED_INTEGRATIONS}

              Please analyze these requirements and recommend a workflow structure.

    - id: 'select_pattern'
      type: 'code'
      data:
        title: 'Select Template Pattern'
        description: 'Determine the best template pattern based on AI analysis'
        command: |
          echo "Analyzing workflow requirements..."

          ANALYSIS=$(echo '{{analyze_requirements.content}}' | tr -d '\n')

          if echo "$ANALYSIS" | grep -qi "sentiment\|analysis\|processing"; then
            PATTERN="data-processing"
            echo "Selected pattern: Data Processing Pipeline"
          elif echo "$ANALYSIS" | grep -qi "chat\|conversation\|interactive"; then
            PATTERN="interactive-ai"
            echo "Selected pattern: Interactive AI Workflow"
          elif echo "$ANALYSIS" | grep -qi "monitor\|alert\|notification"; then
            PATTERN="monitoring-alert"
            echo "Selected pattern: Monitoring & Alerting"
          elif echo "$ANALYSIS" | grep -qi "content\|generate\|publish"; then
            PATTERN="content-automation"
            echo "Selected pattern: Content Automation"
          else
            PATTERN="general-automation"
            echo "Selected pattern: General Automation"
          fi

          echo "SELECTED_PATTERN=$PATTERN"
          echo "Pattern selection completed successfully"

    - id: 'generate_workflow'
      type: 'llm'
      data:
        title: 'Generate Custom Workflow'
        description: 'Create production-ready flowsh YAML workflow'
        model:
          provider: 'openai'
          name: 'gpt-4'
          mode: 'chat'
          completion_params:
            temperature: 0.1
            max_tokens: 2000
        prompt_template:
          - role: 'system'
            text: |
              You are a flowsh YAML workflow generator. Create production-ready flowsh workflows.

              CRITICAL REQUIREMENTS:
              1. Use proper flowsh YAML structure with workflow.name, environment_variables, graph.nodes
              2. Include real API integrations (OpenAI, Telegram, HTTP requests)
              3. Add comprehensive error handling
              4. Use proper variable patterns: ${variable_name}, {{node_id.content}}
              5. Include input validation and sanitization
              6. Ensure all node connections are valid
              7. Include environment variable documentation

              Available node types and their outputs:
              - llm: produces content accessible as {{node_id.content}}
              - http-request: produces response accessible as {{node_id.response}}
              - telegram: produces status accessible as {{node_id.status}}
              - code: produces output accessible as {{node_id.output}}

              Generate complete, executable flowsh YAML workflows only.
          - role: 'user'
            text: |
              Based on this analysis, generate a complete flowsh YAML workflow:

              Requirements Analysis: {{analyze_requirements.content}}
              Selected Pattern: {{select_pattern.output}}
              Target Complexity: ${TARGET_COMPLEXITY}
              Preferred Integrations: ${PREFERRED_INTEGRATIONS}

              Create a production-ready workflow with proper error handling and real API integration.

    - id: 'validate_workflow'
      type: 'code'
      data:
        title: 'Validate Generated Workflow'
        description: 'Validate the generated workflow structure'
        command: |
          echo "Validating generated workflow..."

          WORKFLOW_CONTENT='{{generate_workflow.content}}'
          TEMP_FILE="/tmp/generated_workflow_$(date +%s).yaml"

          echo "$WORKFLOW_CONTENT" > "$TEMP_FILE"

          if echo "$WORKFLOW_CONTENT" | grep -q "workflow:\|graph:\|type:"; then
            echo "✅ Basic YAML structure validation passed"
            VALIDATION_STATUS="BASIC_PASSED"
            VALIDATION_MESSAGE="Basic YAML structure validation passed"
          else
            echo "❌ Basic YAML structure validation failed"
            VALIDATION_STATUS="BASIC_FAILED"
            VALIDATION_MESSAGE="Basic YAML structure validation failed"
          fi

          echo "VALIDATION_STATUS=$VALIDATION_STATUS"
          echo "VALIDATION_MESSAGE=$VALIDATION_MESSAGE"
          echo "GENERATED_WORKFLOW_FILE=$TEMP_FILE"

    - id: 'create_deployment_guide'
      type: 'template-transform'
      data:
        title: 'Create Deployment Guide'
        description: 'Generate comprehensive deployment instructions'
        template: |
          # 🎉 Workflow Generated Successfully!

          ## Generated Workflow Details
          **Requirements**: ${USER_REQUIREMENTS}
          **Pattern**: {{select_pattern.output}}
          **Complexity**: ${TARGET_COMPLEXITY}
          **Validation**: {{validate_workflow.output}}

          ## Deployment Instructions
          1. **Save Workflow**: Copy the generated YAML to a file (e.g., my-workflow.yaml)
          2. **Set Environment Variables**: Configure required API keys and settings
          3. **Test Workflow**: Test in a safe environment first
          4. **Deploy**: Use your preferred workflow execution system

          ## Environment Variables Setup
          ```bash
          export OPENAI_API_KEY="your_openai_api_key"
          export TELEGRAM_BOT_TOKEN="your_telegram_bot_token"
          export TELEGRAM_CHAT_ID="your_chat_id"
          ```

          ## Generated Workflow YAML
          ```yaml
          {{generate_workflow.content}}
          ```

          **Estimated Setup Time**: 5-8 minutes
          **Success Probability**: 80%+

    - id: 'send_notification'
      type: 'telegram'
      data:
        title: 'Send Success Notification'
        description: 'Notify user of successful workflow generation'
        bot_token: '${TELEGRAM_BOT_TOKEN}'
        chat_id: '${TELEGRAM_CHAT_ID}'
        message: |
          🎉 Interactive Workflow Builder - Success!

          ✅ Generated workflow for: ${USER_REQUIREMENTS}
          📊 Pattern: {{select_pattern.output}}
          🔧 Complexity: ${TARGET_COMPLEXITY}

          Generated workflow is ready for deployment! 🚀

          Validation Status: {{validate_workflow.output}}
        parse_mode: 'Markdown'

    - id: 'workflow_summary'
      type: 'answer'
      data:
        title: 'Workflow Summary'
        description: 'Final summary of generated workflow'
        content: |
          Interactive Workflow Builder completed successfully!

          📋 **Summary:**
          - Requirements analyzed: ${USER_REQUIREMENTS}
          - Pattern selected: {{select_pattern.output}}
          - Workflow generated and validated
          - Deployment guide provided
          - Success notification sent

          🎯 **Generated Workflow Pattern:** {{select_pattern.output}}
          ✅ **Validation Status:** {{validate_workflow.output}}
          📊 **Estimated Success Rate:** 80%+
          ⏱️ **Deployment Time:** 5-8 minutes

          The generated workflow is ready for testing and deployment!

  edges:
    - source: 'start'
      target: 'analyze_requirements'
    - source: 'analyze_requirements'
      target: 'select_pattern'
    - source: 'select_pattern'
      target: 'generate_workflow'
    - source: 'generate_workflow'
      target: 'validate_workflow'
    - source: 'validate_workflow'
      target: 'create_deployment_guide'
    - source: 'create_deployment_guide'
      target: 'send_notification'
    - source: 'send_notification'
      target: 'workflow_summary'
