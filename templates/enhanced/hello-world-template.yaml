workflow:
  name: 'Hello World - Production Template'
  description: 'Production-ready template for simple greeting workflows with environment variable support and customizable messaging'

environment_variables:
  - variable: 'greeting_target'
    name: 'Greeting Target'
    type: 'text'
    description: 'Who or what to greet in the message'
    default: 'World'

graph:
  nodes:
    - id: 'start'
      type: 'start'
      data:
        title: 'Initialize Greeting Workflow'
        description: 'Starting point for customizable greeting message generation'

    - id: 'generate_greeting'
      type: 'code'
      data:
        title: 'Generate Greeting Message'
        description: 'Create personalized greeting using environment variables'
        command: 'echo'
        args: ['Hello, {{greeting_target}}!']

    - id: 'end'
      type: 'end'
      data:
        title: 'Complete Successfully'
        description: 'Workflow completed - greeting message generated'

  edges:
    - id: 'start_to_greeting'
      source: 'start'
      target: 'generate_greeting'

    - id: 'greeting_to_end'
      source: 'generate_greeting'
      target: 'end'
