workflow:
  name: 'OpenCode Essay Writing - Simple'
  description: 'Multi-agent essay writing: Research → Write → Edit → Telegram delivery'

conversation_variables:
  - variable: user_topic
    name: Essay Topic
    type: text-input
    description: What should the essay be about?
    required: true
    default: 'AI in Software Development'
  - variable: max_parts
    name: Content Sections
    type: select
    description: How many content sections to create?
    options:
      - value: '2'
        label: '2 sections (shorter essay)'
      - value: '3'
        label: '3 sections (standard essay)'
    default: '3'

graph:
  nodes:
    - id: start
      type: start
      data:
        title: 'Essay Writing Workflow'
        description: 'Multi-agent essay creation with research and editorial workflow'

    - id: validate_env
      type: code
      data:
        title: 'Validate Environment'
        description: 'Check Telegram credentials'
        command: '/bin/bash'
        args:
          - '-c'
          - |
            set -euo pipefail
            echo "🔍 Validating Telegram environment..."
            if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
              echo "❌ ERROR: TELEGRAM_BOT_TOKEN not set"
              exit 1
            fi
            if [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
              echo "❌ ERROR: TELEGRAM_CHAT_ID not set"
              exit 1
            fi
            echo "✅ Environment validated"

    - id: setup_workspace
      type: code
      data:
        title: 'Setup Workspace'
        description: 'Create working directory and set variables for agents'
        command: '/bin/bash'
        args:
          - '-c'
          - |
            # Create fixed working directory
            work_dir="/tmp/flowsh_essay_work"
            mkdir -p "$work_dir"

            # Set workflow variables that code nodes can handle
            echo "export work_dir=\"$work_dir\"" > "$work_dir/workflow_vars.sh"
            echo "export topic=\"{{user_topic}}\"" >> "$work_dir/workflow_vars.sh"
            echo "export max_parts=\"{{max_parts}}\"" >> "$work_dir/workflow_vars.sh"
            echo "export research_date=\"$(date +%Y-%m-%d)\"" >> "$work_dir/workflow_vars.sh"

            echo "✅ Workspace created: $work_dir"
            echo "📝 Topic: {{user_topic}}"
            echo "📊 Sections: {{max_parts}}"

    - id: research_planner
      type: agent
      data:
        title: 'Research & Planning Agent'
        command: 'opencode'
        args: ['run']
        timeout: 180
        prompt_template:
          type: prompt
          source: inline
          content: |
            You are a research and planning specialist.

            Topic: {{user_topic}}

            Tasks:
            1. Research the topic using web search (use firecrawl or web tools available)
            2. Create {{max_parts}} focused content sections
            3. For each section, create a planning document with:
               - Research findings and key sources
               - Main points and arguments
               - Structural outline
               - Target word count (300-500 words per section)

            Save research files to fixed directory: /tmp/flowsh_essay_work/
            Required output files:
            - /tmp/flowsh_essay_work/research_summary.md (overall findings)
            - /tmp/flowsh_essay_work/Part_01.md (first section plan)
            - /tmp/flowsh_essay_work/Part_02.md (second section plan)
            {{#if (eq max_parts "3")}}
            - /tmp/flowsh_essay_work/Part_03.md (third section plan)
            {{/if}}

            NOTE: Agents cannot set shell environment variables. Only create the specified files.

    - id: find_plan_files
      type: variable-assignment
      data:
        title: 'Discover Planning Files'
        description: 'Dynamically find all Part_*.md files'
        variable: 'planning_files'
        assignment_type: 'expression'
        value: '$(find /tmp/flowsh_essay_work -name "Part_*.md" | sort)'

    - id: content_iterator
      type: iteration
      data:
        title: 'Content Writing Iterator'
        description: 'Write content for each planning document'
        input_variable: planning_files
        parallel: false
        output_variable: content_sections

    - id: content_writer
      type: agent
      data:
        title: 'Content Writer Agent'
        command: 'opencode'
        args: ['run']
        timeout: 120
        # Container membership - this agent should execute INSIDE the iteration loop
        isInIteration: true
        iteration_id: content_iterator
        prompt_template:
          type: prompt
          source: inline
          content: |
            You are a skilled content writer.

            Planning document to process: {{iteration_item}}

            Tasks:
            1. Read the planning document thoroughly
            2. Write comprehensive, engaging content (400-600 words)
            3. Maintain academic quality while being accessible
            4. APPEND your section to: /tmp/flowsh_essay_work/Raw_Content.md
            5. Use clear section headers and smooth transitions
            6. Incorporate research findings naturally

            This is section {{iteration_index}} of {{part_count}} total sections.
            Ensure consistency with previous sections if any exist.

    - id: editorial_agent
      type: agent
      data:
        title: 'Editorial Review Agent'
        command: 'opencode'
        args: ['run']
        timeout: 120
        prompt_template:
          type: prompt
          source: inline
          content: |
            You are a professional editor.

            Raw content file: /tmp/flowsh_essay_work/Raw_Content.md
            Topic: {{user_topic}}

            Tasks:
            1. Read the complete raw content
            2. Perform comprehensive editorial review:
               - Structural coherence and logical flow
               - Argument clarity and strength
               - Grammar, style, and tone consistency
               - Smooth transitions between sections
               - Strong introduction and conclusion
            3. Create the final polished essay
            4. Save final essay as: /tmp/flowsh_essay_work/Final_Essay.md
            5. Ensure publication-ready quality

            Target audience: Educated general readers
            Style: Professional but accessible

    - id: prepare_essay_content
      type: code
      data:
        title: 'Prepare Essay for Telegram'
        description: 'Read essay content and prepare for Telegram delivery'
        command: '/bin/bash'
        args:
          - '-c'
          - |
            set -euo pipefail
            echo "📱 Preparing essay content for Telegram delivery..."

            ESSAY_PATH="/tmp/flowsh_essay_work/Final_Essay.md"
            if [ -f "/tmp/flowsh_essay_work/Final_Essay.md" ]; then
              echo "✅ Reading essay content from /tmp/flowsh_essay_work/Final_Essay.md"
              cat "/tmp/flowsh_essay_work/Final_Essay.md" > /tmp/flowsh_essay_work/telegram_message_content.txt
              echo "" >> /tmp/flowsh_essay_work/telegram_message_content.txt
              echo "📊 **Essay Stats**: $(cat "/tmp/flowsh_essay_work/Final_Essay.md" | wc -w) words, $(cat "/tmp/flowsh_essay_work/Final_Essay.md" | wc -c) characters" >> /tmp/flowsh_essay_work/telegram_message_content.txt
            else
              echo "⚠️ Essay file not found, creating fallback message"
              echo "❌ Essay file not found. Generation may have failed." > /tmp/flowsh_essay_work/telegram_message_content.txt
              echo "" >> /tmp/flowsh_essay_work/telegram_message_content.txt  
              echo "**Expected Location**: /tmp/flowsh_essay_work/Final_Essay.md" >> /tmp/flowsh_essay_work/telegram_message_content.txt
            fi
            echo "✅ Telegram content prepared"

    - id: telegram_delivery
      type: telegram
      data:
        title: 'Essay Delivery'
        description: 'Send completed essay via Telegram with full content'
        message: |
          📝 **Essay Complete: {{user_topic}}**

          $(cat /tmp/flowsh_essay_work/telegram_message_content.txt 2>/dev/null || echo "⚠️ Essay content not available - check workflow execution logs")

          ---
          📅 **Generated**: $(date '+%Y-%m-%d %H:%M')
          🤖 **By**: flowsh OpenCode Essay Template
          🔧 **Sections**: {{max_parts}}
        parse_mode: 'HTML'

    - id: end
      type: end
      data:
        title: 'Essay Complete'

  edges:
    - source: start
      target: validate_env
    - source: validate_env
      target: setup_workspace
    - source: setup_workspace
      target: research_planner
    - source: research_planner
      target: find_plan_files
    - source: find_plan_files
      target: content_iterator
    - source: content_iterator
      target: content_writer
    - source: content_writer
      target: content_iterator
    - source: content_iterator
      target: editorial_agent
      condition: 'iteration_complete'
    - source: editorial_agent
      target: prepare_essay_content
    - source: prepare_essay_content
      target: telegram_delivery
    - source: telegram_delivery
      target: end
