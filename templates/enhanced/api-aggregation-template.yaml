workflow:
  name: 'API Data Aggregation - Production Template'
  description: 'Production-ready template for fetching and aggregating data from multiple API endpoints with comprehensive error handling and reporting'

environment_variables:
  - variable: 'api_key'
    name: 'API Authentication Key'
    type: 'text'
    description: 'API key for authenticating with external services'
    default: 'your_api_key_here'

graph:
  nodes:
    - id: 'start'
      type: 'start'
      data:
        title: 'Initialize API Aggregation'
        description: 'Begin multi-endpoint data collection workflow'

    - id: 'fetch_weather'
      type: 'http-request'
      data:
        title: 'Fetch Weather Data'
        description: 'Retrieve current weather information from OpenWeatherMap API'
        url: 'https://api.openweathermap.org/data/2.5/weather?q=London&appid=${api_key}'
        method: 'GET'
        timeout: 15
        retries: 2
        error_handling: 'continue'

    - id: 'fetch_news'
      type: 'http-request'
      data:
        title: 'Fetch News Headlines'
        description: 'Get latest news headlines from NewsAPI'
        url: 'https://newsapi.org/v2/top-headlines?country=us&apiKey=${api_key}'
        method: 'GET'
        timeout: 15
        retries: 2
        error_handling: 'continue'

    - id: 'fetch_stocks'
      type: 'http-request'
      data:
        title: 'Fetch Stock Market Data'
        description: 'Retrieve real-time stock prices from financial API'
        url: 'https://api.twelvedata.com/time_series?symbol=AAPL&interval=1min&apikey=${api_key}'
        method: 'GET'
        timeout: 15
        retries: 2
        error_handling: 'continue'

    - id: 'aggregate_responses'
      type: 'variable-aggregation'
      data:
        title: 'Aggregate API Response Data'
        description: 'Collect all API responses into unified dataset'
        aggregation_method: 'collect'
        input_variables: ['http_response_body', 'http_response_body', 'http_response_body']
        output_variable: 'all_api_data'

    - id: 'calculate_avg_time'
      type: 'variable-aggregation'
      data:
        title: 'Calculate Performance Metrics'
        description: 'Compute average API response time for monitoring'
        aggregation_method: 'avg'
        input_variables: ['http_response_time', 'http_response_time', 'http_response_time']
        output_variable: 'avg_response_time'

    - id: 'create_summary'
      type: 'template-transform'
      data:
        title: 'Generate Summary Report'
        description: 'Create formatted analysis report of aggregated API data'
        template_source: 'inline'
        template_content: |
          # API Data Aggregation Summary Report

          **Generated**: {{now}}
          **APIs Queried**: 3 (Weather, News, Stock Market)
          **Average Response Time**: {{avg_response_time}}s

          ## Data Sources
          1. **Weather API** - Current conditions for London
          2. **News API** - Top US headlines  
          3. **Stock API** - Apple Inc. (AAPL) real-time pricing

          ## Aggregation Results
          Total responses collected: {{count all_api_data}}

          {{#if all_api_data}}
          ✅ **Status**: Data aggregation completed successfully
          {{else}}
          ❌ **Status**: No data collected - check API keys and connectivity
          {{/if}}

          ## Performance
          - Average API latency: {{avg_response_time}}s
          - Parallel execution: Yes
          - Error handling: Continue on failure

          *Report generated by flowsh API Aggregation Template*
        output_variable: 'summary_report'
        parameters:
          all_api_data: '${all_api_data}'
          avg_response_time: '${avg_response_time}'

    - id: 'end'
      type: 'answer'
      data:
        title: 'Output Aggregated Results'
        description: 'Return comprehensive summary of multi-API data collection'
        answer: '${summary_report}'

  edges:
    - source: 'start'
      target: 'fetch_weather'

    - source: 'start'
      target: 'fetch_news'

    - source: 'start'
      target: 'fetch_stocks'

    - source: 'fetch_weather'
      target: 'aggregate_responses'

    - source: 'fetch_news'
      target: 'aggregate_responses'

    - source: 'fetch_stocks'
      target: 'aggregate_responses'

    - source: 'fetch_weather'
      target: 'calculate_avg_time'

    - source: 'fetch_news'
      target: 'calculate_avg_time'

    - source: 'fetch_stocks'
      target: 'calculate_avg_time'

    - source: 'aggregate_responses'
      target: 'create_summary'

    - source: 'calculate_avg_time'
      target: 'create_summary'

    - source: 'create_summary'
      target: 'end'
