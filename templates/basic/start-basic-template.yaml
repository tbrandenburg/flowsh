workflow:
  name: 'Start Node - Basic Template'
  description: 'Demonstrates the start node with various variable types and configurations'

environment_variables:
  - variable: 'default_model'
    name: 'Default LLM Model'
    type: 'text'
    description: 'Default model to use for LLM operations'
    required: false
    default: 'gpt-4o-mini'

conversation_variables:
  - variable: 'session_id'
    name: 'Session ID'
    type: 'text'
    description: 'Unique identifier for this workflow session'
    required: false
    default: 'session-001'

graph:
  nodes:
    - id: 'start'
      type: 'start'
      data:
        title: 'Workflow Input Collection'
        description: 'Collects various types of input from the user to demonstrate start node capabilities'
        variables:
          - variable: 'user_name'
            type: 'text'
            label: 'Your Name'
            description: 'Enter your full name'
            required: true
            max_length: 100
          - variable: 'task_priority'
            type: 'select'
            label: 'Task Priority'
            description: 'Select the priority level for this task'
            options: ['low', 'medium', 'high', 'critical']
            default: 'medium'
            required: true
          - variable: 'max_items'
            type: 'number'
            label: 'Maximum Items'
            description: 'Maximum number of items to process'
            default: 10
            min: 1
            max: 100
            required: true
          - variable: 'enable_debug'
            type: 'boolean'
            label: 'Enable Debug Mode'
            description: 'Enable detailed logging and debug output'
            default: false
          - variable: 'user_feedback'
            type: 'text-input'
            label: 'Additional Comments'
            description: 'Any additional comments or requirements'
            max_length: 500
            required: false

    - id: 'validate_inputs'
      type: 'variable-assignment'
      data:
        title: 'Input Validation'
        description: 'Validate and process the collected input variables'
        variable: 'validation_status'
        assignment_type: 'expression'
        expression: 'if [ ! -z "${user_name}" ] && [ "${max_items}" -gt 0 ]; then echo "valid"; else echo "invalid"; fi'

    - id: 'process_inputs'
      type: 'if-else'
      data:
        title: 'Input Processing Decision'
        description: 'Decide how to proceed based on input validation'
        conditions:
          - variable: 'validation_status'
            comparison_operator: '=='
            value: 'valid'

    - id: 'success_output'
      type: 'answer'
      data:
        title: 'Processing Success'
        description: 'Successful processing of start node inputs'
        answer: |
          ✅ Start Node Example Completed Successfully!

          Collected Inputs:
          - Name: ${user_name}
          - Priority: ${task_priority}
          - Max Items: ${max_items}
          - Debug Mode: ${enable_debug}
          - Comments: ${user_feedback}

          All inputs have been validated and are ready for processing.
        type: 'markdown'

    - id: 'error_output'
      type: 'answer'
      data:
        title: 'Input Validation Error'
        description: 'Handle invalid inputs from start node'
        answer: |
          ❌ Input Validation Failed

          Please check the following requirements:
          - Name must not be empty
          - Max items must be greater than 0

          Current values:
          - Name: "${user_name}"
          - Max Items: ${max_items}
        type: 'markdown'

  edges:
    - source: 'start'
      target: 'validate_inputs'
    - source: 'validate_inputs'
      target: 'process_inputs'
    - source: 'process_inputs'
      target: 'success_output'
      condition: 'true'
    - source: 'process_inputs'
      target: 'error_output'
      condition: 'false'
