workflow:
  name: 'Variable Assignment Node Example'
  description: 'Shows comprehensive variable assignment capabilities including constants, variables, expressions, and write modes'

graph:
  nodes:
    - id: 'start'
      type: 'start'
      data:
        title: 'Initial Input Collection'
        description: 'Collect base values for variable assignment demonstrations'
        variables:
          - variable: 'base_value'
            type: 'text'
            label: 'Base Value'
            description: 'Initial value to work with'
            required: true
            default: 'Hello World'
          - variable: 'number_input'
            type: 'number'
            label: 'Number Input'
            description: 'Numeric value for calculations'
            required: true
            default: 42
            min: 1
            max: 1000
          - variable: 'user_name'
            type: 'text'
            label: 'User Name'
            description: 'Your name for personalization'
            required: true
            default: 'User'

    # Constant Assignment Examples
    - id: 'assign_constant_string'
      type: 'variable-assignment'
      data:
        title: 'Assign Constant String'
        description: 'Basic constant string assignment'
        variable: 'welcome_message'
        assignment_type: 'constant'
        value: 'Welcome to the flowsh variable assignment demonstration!'

    - id: 'assign_constant_number'
      type: 'variable-assignment'
      data:
        title: 'Assign Constant Number'
        description: 'Numeric constant assignment'
        variable: 'max_attempts'
        assignment_type: 'constant'
        value: 3

    - id: 'assign_constant_boolean'
      type: 'variable-assignment'
      data:
        title: 'Assign Boolean Constant'
        description: 'Boolean value assignment'
        variable: 'debug_enabled'
        assignment_type: 'constant'
        value: true

    # Variable Assignment (copying from other variables)
    - id: 'copy_variable'
      type: 'variable-assignment'
      data:
        title: 'Copy Variable Value'
        description: 'Copy value from one variable to another'
        variable: 'original_input'
        assignment_type: 'variable'
        source_variable: 'base_value'

    - id: 'copy_number_variable'
      type: 'variable-assignment'
      data:
        title: 'Copy Numeric Variable'
        description: 'Copy numeric value between variables'
        variable: 'calculation_base'
        assignment_type: 'variable'
        source_variable: 'number_input'

    # Expression-based Assignments
    - id: 'string_concatenation'
      type: 'variable-assignment'
      data:
        title: 'String Concatenation Expression'
        description: 'Combine multiple variables into a single string'
        variable: 'personalized_greeting'
        assignment_type: 'expression'
        expression: 'echo "Hello $USER_NAME! $WELCOME_MESSAGE"'

    - id: 'mathematical_calculation'
      type: 'variable-assignment'
      data:
        title: 'Mathematical Calculation'
        description: 'Perform arithmetic operations using expressions'
        variable: 'calculated_result'
        assignment_type: 'expression'
        expression: 'echo $((${number_input} * 2 + 10))'

    - id: 'date_timestamp'
      type: 'variable-assignment'
      data:
        title: 'Generate Timestamp'
        description: 'Create timestamp using shell commands'
        variable: 'current_timestamp'
        assignment_type: 'expression'
        expression: 'date +%Y-%m-%d\ %H:%M:%S'

    - id: 'file_operation'
      type: 'variable-assignment'
      data:
        title: 'File Operation Result'
        description: 'Get system information using shell commands'
        variable: 'system_info'
        assignment_type: 'expression'
        expression: 'echo "System: $(uname -s), User: $(whoami), Directory: $(pwd)"'

    - id: 'conditional_expression'
      type: 'variable-assignment'
      data:
        title: 'Conditional Expression'
        description: 'Use conditional logic in expressions'
        variable: 'status_message'
        assignment_type: 'expression'
        expression: "if [ ${number_input} -gt 50 ]; then echo 'High value'; else echo 'Low value'; fi"

    # Write Mode Examples
    - id: 'initialize_log'
      type: 'variable-assignment'
      data:
        title: 'Initialize Log (Overwrite)'
        description: 'Initialize a log variable with overwrite mode'
        variable: 'activity_log'
        assignment_type: 'constant'
        value: 'Log initialized'
        write_mode: 'over-write'

    - id: 'append_to_log_1'
      type: 'variable-assignment'
      data:
        title: 'Append Log Entry 1'
        description: 'Add first entry to log using append mode'
        variable: 'activity_log'
        assignment_type: 'expression'
        expression: "echo ' | Entry 1: Variable assignments demonstrated'"
        write_mode: 'append'

    - id: 'append_to_log_2'
      type: 'variable-assignment'
      data:
        title: 'Append Log Entry 2'
        description: 'Add second entry to log using append mode'
        variable: 'activity_log'
        assignment_type: 'expression'
        expression: "echo ' | Entry 2: Timestamp - ${current_timestamp}'"
        write_mode: 'append'

    - id: 'append_calculation'
      type: 'variable-assignment'
      data:
        title: 'Append Calculation Result'
        description: 'Add calculation result to log'
        variable: 'activity_log'
        assignment_type: 'expression'
        expression: "echo ' | Entry 3: Calculation result - ${calculated_result}'"
        write_mode: 'append'

    # Advanced Expression Examples
    - id: 'complex_string_manipulation'
      type: 'variable-assignment'
      data:
        title: 'Complex String Manipulation'
        description: 'Advanced string operations and transformations'
        variable: 'processed_text'
        assignment_type: 'expression'
        expression: 'echo "${base_value}" | tr "[:lower:]" "[:upper:]" | sed "s/WORLD/UNIVERSE/g"'

    - id: 'json_creation'
      type: 'variable-assignment'
      data:
        title: 'Create JSON Object'
        description: 'Generate JSON structure using expressions'
        variable: 'json_data'
        assignment_type: 'expression'
        expression: 'echo "{\"user\": \"$USER_NAME\", \"value\": $NUMBER_INPUT, \"timestamp\": \"$CURRENT_TIMESTAMP\", \"status\": \"$STATUS_MESSAGE\"}"'

    - id: 'environment_info'
      type: 'variable-assignment'
      data:
        title: 'Gather Environment Information'
        description: 'Collect comprehensive environment details'
        variable: 'env_summary'
        assignment_type: 'expression'
        expression: 'echo "Environment Summary: OS=$(uname -o 2>/dev/null || uname -s), Hostname=$(hostname), Shell=$SHELL, Path=$(pwd)"'

    # Clear operation example
    - id: 'create_temp_variable'
      type: 'variable-assignment'
      data:
        title: 'Create Temporary Variable'
        description: 'Create a temporary variable for clearing demonstration'
        variable: 'temp_data'
        assignment_type: 'constant'
        value: 'This is temporary data that will be cleared'

    - id: 'clear_temp_variable'
      type: 'variable-assignment'
      data:
        title: 'Clear Temporary Variable'
        description: 'Demonstrate clearing a variable using clear write mode'
        variable: 'temp_data'
        assignment_type: 'constant'
        value: ''
        write_mode: 'clear'

    - id: 'final_summary'
      type: 'answer'
      data:
        title: 'Variable Assignment Results'
        description: 'Complete summary of all variable assignment operations'
        answer: |
          # 📝 Variable Assignment Node Example Results

          ## Original Inputs
          - **Base Value**: ${base_value}
          - **Number Input**: ${number_input}
          - **User Name**: ${user_name}

          ## Constant Assignments
          - **Welcome Message**: ${welcome_message}
          - **Max Attempts**: ${max_attempts}
          - **Debug Enabled**: ${debug_enabled}

          ## Variable Copying
          - **Original Input Copy**: ${original_input}
          - **Calculation Base**: ${calculation_base}

          ## Expression Results
          - **Personalized Greeting**: ${personalized_greeting}
          - **Mathematical Result**: ${calculated_result}
          - **Current Timestamp**: ${current_timestamp}
          - **System Information**: ${system_info}
          - **Status Message**: ${status_message}

          ## Advanced Operations
          - **Processed Text**: ${processed_text}
          - **JSON Data**: ${json_data}
          - **Environment Summary**: ${env_summary}

          ## Write Mode Operations
          - **Activity Log**: ${activity_log}
          - **Temp Data (after clear)**: "${temp_data}" (should be empty)

          ## Variable Assignment Features Demonstrated

          ### Assignment Types
          - **Constant**: Direct value assignment (strings, numbers, booleans)
          - **Variable**: Copying values between variables
          - **Expression**: Dynamic value generation using shell commands

          ### Write Modes
          - **Over-write**: Replace existing value (default behavior)
          - **Append**: Add to existing value (useful for logs and accumulation)
          - **Clear**: Empty the variable (cleanup operations)

          ### Expression Capabilities
          - **String Concatenation**: Combining multiple variables
          - **Mathematical Operations**: Arithmetic calculations
          - **System Commands**: Executing shell commands for dynamic values
          - **Conditional Logic**: If/else operations in expressions
          - **Text Processing**: Advanced string manipulation (sed, tr, awk)
          - **JSON Generation**: Creating structured data
          - **Environment Access**: Reading system information

          ### Use Cases
          - **Data Transformation**: Converting and processing input values
          - **Configuration Management**: Setting up workflow parameters
          - **Logging and Tracking**: Building activity logs and audit trails
          - **Calculations**: Mathematical operations and computations
          - **System Integration**: Gathering environment and system information
          - **Dynamic Content**: Creating personalized and contextual outputs

          This example demonstrates the full range of variable assignment capabilities, from simple value setting to complex dynamic expression evaluation.
        type: 'markdown'

  edges:
    - source: 'start'
      target: 'assign_constant_string'
    - source: 'assign_constant_string'
      target: 'assign_constant_number'
    - source: 'assign_constant_number'
      target: 'assign_constant_boolean'
    - source: 'assign_constant_boolean'
      target: 'copy_variable'
    - source: 'copy_variable'
      target: 'copy_number_variable'
    - source: 'copy_number_variable'
      target: 'string_concatenation'
    - source: 'string_concatenation'
      target: 'mathematical_calculation'
    - source: 'mathematical_calculation'
      target: 'date_timestamp'
    - source: 'date_timestamp'
      target: 'file_operation'
    - source: 'file_operation'
      target: 'conditional_expression'
    - source: 'conditional_expression'
      target: 'initialize_log'
    - source: 'initialize_log'
      target: 'append_to_log_1'
    - source: 'append_to_log_1'
      target: 'append_to_log_2'
    - source: 'append_to_log_2'
      target: 'append_calculation'
    - source: 'append_calculation'
      target: 'complex_string_manipulation'
    - source: 'complex_string_manipulation'
      target: 'json_creation'
    - source: 'json_creation'
      target: 'environment_info'
    - source: 'environment_info'
      target: 'create_temp_variable'
    - source: 'create_temp_variable'
      target: 'clear_temp_variable'
    - source: 'clear_temp_variable'
      target: 'final_summary'
