workflow:
  name: 'If-Else Node Example'
  description: 'Shows comprehensive if-else conditional logic with multiple conditions and operators'

graph:
  nodes:
    - id: 'start'
      type: 'start'
      data:
        title: 'Input Parameters'
        description: 'Collect various parameters for conditional testing'
        variables:
          - variable: 'user_age'
            type: 'number'
            label: 'Your Age'
            description: 'Enter your age for age-based conditions'
            required: true
            default: 25
            min: 0
            max: 150
          - variable: 'user_role'
            type: 'select'
            label: 'User Role'
            description: 'Select your role'
            options: ['admin', 'user', 'guest', 'moderator']
            default: 'user'
            required: true
          - variable: 'account_status'
            type: 'select'
            label: 'Account Status'
            description: 'Current account status'
            options: ['active', 'inactive', 'suspended', 'pending']
            default: 'active'
            required: true
          - variable: 'feature_flags'
            type: 'text'
            label: 'Feature Flags'
            description: "Comma-separated feature flags (e.g., 'beta,premium,mobile')"
            default: ''
          - variable: 'is_premium'
            type: 'boolean'
            label: 'Premium Member'
            description: 'Are you a premium member?'
            default: false

    - id: 'age_check'
      type: 'if-else'
      data:
        title: 'Age-Based Access Control'
        description: 'Check if user meets age requirements (18 or older)'
        conditions:
          - variable: 'user_age'
            comparison_operator: '>='
            value: 18

    - id: 'minor_message'
      type: 'answer'
      data:
        title: 'Minor User Message'
        description: 'Message for users under 18'
        answer: |
          # 🚫 Age Restriction Notice

          Sorry, you must be 18 or older to access this system.

          **Your age**: ${user_age}
          **Required age**: 18 or older

          Please return when you meet the age requirements.
        type: 'markdown'

    - id: 'role_and_status_check'
      type: 'if-else'
      data:
        title: 'Role and Status Validation'
        description: 'Check if user has appropriate role AND active status'
        conditions:
          - variable: 'user_role'
            comparison_operator: '!='
            value: 'guest'
          - variable: 'account_status'
            comparison_operator: '=='
            value: 'active'
        logical_operator: 'and'

    - id: 'access_denied'
      type: 'answer'
      data:
        title: 'Access Denied'
        description: "User doesn't meet role/status requirements"
        answer: |
          # ❌ Access Denied

          Your account doesn't meet the access requirements:

          **Your role**: ${user_role}
          **Account status**: ${account_status}

          Requirements:
          - Role must not be 'guest'
          - Account status must be 'active'
        type: 'markdown'

    - id: 'feature_flag_check'
      type: 'if-else'
      data:
        title: 'Feature Flag Validation'
        description: 'Check if user has required feature flags (beta OR premium features)'
        conditions:
          - variable: 'feature_flags'
            comparison_operator: 'contains'
            value: 'beta'
          - variable: 'feature_flags'
            comparison_operator: 'contains'
            value: 'premium'
          - variable: 'is_premium'
            comparison_operator: '=='
            value: true
        logical_operator: 'or'

    - id: 'basic_access'
      type: 'answer'
      data:
        title: 'Basic Access Granted'
        description: 'User gets basic access without advanced features'
        answer: |
          # ✅ Basic Access Granted

          Welcome! You have basic access to the system.

          **Your details**:
          - Age: ${user_age}
          - Role: ${user_role}
          - Status: ${account_status}
          - Premium: ${is_premium}
          - Feature flags: ${feature_flags}

          To unlock advanced features, consider:
          - Upgrading to premium membership
          - Joining the beta program
          - Enabling relevant feature flags
        type: 'markdown'

    - id: 'admin_check'
      type: 'if-else'
      data:
        title: 'Administrator Privileges Check'
        description: 'Special handling for admin users'
        conditions:
          - variable: 'user_role'
            comparison_operator: '=='
            value: 'admin'

    - id: 'admin_access'
      type: 'answer'
      data:
        title: 'Administrator Access'
        description: 'Full administrative access granted'
        answer: |
          # 🔑 Administrator Access Granted

          Welcome, Administrator!

          You have full system access with all privileges:

          **Admin Details**:
          - Age: ${user_age}
          - Role: ${user_role} (Administrative)
          - Status: ${account_status}
          - Premium: ${is_premium}
          - Feature flags: ${feature_flags}

          **Available Actions**:
          - ✅ User management
          - ✅ System configuration
          - ✅ Advanced features
          - ✅ Beta functionality
          - ✅ Premium features

          All feature restrictions are bypassed for administrators.
        type: 'markdown'

    - id: 'premium_features_check'
      type: 'if-else'
      data:
        title: 'Premium Features Eligibility'
        description: 'Complex multi-condition check for premium features'
        conditions:
          - variable: 'is_premium'
            comparison_operator: '=='
            value: true
          - variable: 'feature_flags'
            comparison_operator: 'contains'
            value: 'premium'
          - variable: 'user_age'
            comparison_operator: '>='
            value: 21
        logical_operator: 'and'

    - id: 'premium_access'
      type: 'answer'
      data:
        title: 'Premium Access Granted'
        description: 'Full premium feature access'
        answer: |
          # 🌟 Premium Access Granted

          Congratulations! You have access to all premium features.

          **Verification Results**:
          - Premium member: ✅ ${is_premium}
          - Premium flag: ✅ Found in "${feature_flags}"
          - Age requirement (21+): ✅ ${user_age} years old
          - Account status: ✅ ${account_status}

          **Premium Features Available**:
          - 🚀 Advanced analytics
          - 🎯 Priority support
          - 📊 Extended reporting
          - 🔧 Custom integrations
          - 💎 Exclusive content

          Enjoy your premium experience!
        type: 'markdown'

    - id: 'standard_premium_access'
      type: 'answer'
      data:
        title: 'Standard Premium Access'
        description: 'Premium access with some limitations'
        answer: |
          # ⭐ Premium Access (Limited)

          You have premium access with some limitations:

          **Status Check**:
          - Premium member: ${is_premium}
          - Feature flags: ${feature_flags}
          - Age: ${user_age}
          - Account: ${account_status}

          **Reason for limitations**:
          Not all premium requirements met (need premium=true AND premium flag AND age 21+)

          **Available Features**:
          - ✅ Enhanced functionality
          - ✅ Basic premium tools
          - ❌ Advanced premium features (age restriction)

          Upgrade or meet all requirements for full premium access.
        type: 'markdown'

  edges:
    - source: 'start'
      target: 'age_check'

    # Age check paths
    - source: 'age_check'
      target: 'minor_message'
      condition: 'false'

    - source: 'age_check'
      target: 'role_and_status_check'
      condition: 'true'

    # Role and status check paths
    - source: 'role_and_status_check'
      target: 'access_denied'
      condition: 'false'

    - source: 'role_and_status_check'
      target: 'feature_flag_check'
      condition: 'true'

    # Feature flag check paths
    - source: 'feature_flag_check'
      target: 'basic_access'
      condition: 'false'

    - source: 'feature_flag_check'
      target: 'admin_check'
      condition: 'true'

    # Admin check paths
    - source: 'admin_check'
      target: 'admin_access'
      condition: 'true'

    - source: 'admin_check'
      target: 'premium_features_check'
      condition: 'false'

    # Premium features check paths
    - source: 'premium_features_check'
      target: 'premium_access'
      condition: 'true'

    - source: 'premium_features_check'
      target: 'standard_premium_access'
      condition: 'false'
