workflow:
  name: 'OpenCode Essay Writing - Simple'
  description: 'Multi-agent essay writing: Research → Write → Edit → Telegram delivery'

conversation_variables:
  - variable: user_topic
    name: Essay Topic
    type: text-input
    description: What should the essay be about?
    required: true
  - variable: max_parts
    name: Content Sections
    type: select
    description: How many content sections to create?
    options:
      - value: '2'
        label: '2 sections (shorter essay)'
      - value: '3'
        label: '3 sections (standard essay)'
    default: '3'

graph:
  nodes:
    - id: start
      type: start
      data:
        title: 'Essay Writing Workflow'
        description: 'Multi-agent essay creation with research and editorial workflow'

    - id: validate_env
      type: code
      data:
        title: 'Validate Environment'
        description: 'Check Telegram credentials'
        command: '/bin/bash'
        args:
          - '-c'
          - |
            set -euo pipefail
            echo "🔍 Validating Telegram environment..."
            if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
              echo "❌ ERROR: TELEGRAM_BOT_TOKEN not set"
              exit 1
            fi
            if [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
              echo "❌ ERROR: TELEGRAM_CHAT_ID not set"
              exit 1
            fi
            echo "✅ Environment validated"

    - id: research_planner
      type: agent
      data:
        title: 'Research & Planning Agent'
        command: 'opencode'
        args: ['run']
        prompt_template:
          type: prompt
          source: inline
          content: |
            You are a research and planning specialist.

            Topic: {{user_topic}}

            Tasks:
            1. Research the topic using web search (use firecrawl or web tools available)
            2. Create {{max_parts}} focused content sections
            3. For each section, create a planning document with:
               - Research findings and key sources
               - Main points and arguments
               - Structural outline
               - Target word count (300-500 words per section)

            Create working directory: /tmp/essay_{{user_topic | replace(' ', '_') | lower}}
            Save each plan as: /tmp/essay_{{user_topic | replace(' ', '_') | lower}}/Part_0X.md (where X = 1,2,3...)

            Set these variables for next stages:
            - work_dir: /tmp/essay_{{user_topic | replace(' ', '_') | lower}}
            - topic_short: {{user_topic | replace(' ', '_') | truncate(20)}}
            - research_date: $(date +%Y-%m-%d)
            - part_count: {{max_parts}}

    - id: find_plan_files
      type: variable-assignment
      data:
        title: 'Discover Planning Files'
        description: 'Dynamically find all Part_*.md files'
        variable: 'planning_files'
        assignment_type: 'expression'
        value: '$(find ${work_dir} -name "Part_*.md" | sort)'

    - id: content_iterator
      type: iteration
      data:
        title: 'Content Writing Iterator'
        description: 'Write content for each planning document'
        input_variable: planning_files
        parallel: false
        output_variable: content_sections

    - id: content_writer
      type: agent
      data:
        title: 'Content Writer Agent'
        command: 'opencode'
        args: ['run']
        prompt_template:
          type: prompt
          source: inline
          content: |
            You are a skilled content writer.

            Planning document to process: {{iteration_item}}

            Tasks:
            1. Read the planning document thoroughly
            2. Write comprehensive, engaging content (400-600 words)
            3. Maintain academic quality while being accessible
            4. APPEND your section to: ${work_dir}/Raw_Content.md
            5. Use clear section headers and smooth transitions
            6. Incorporate research findings naturally

            This is section {{iteration_index}} of {{part_count}} total sections.
            Ensure consistency with previous sections if any exist.

    - id: editorial_agent
      type: agent
      data:
        title: 'Editorial Review Agent'
        command: 'opencode'
        args: ['run']
        prompt_template:
          type: prompt
          source: inline
          content: |
            You are a professional editor.

            Raw content file: ${work_dir}/Raw_Content.md
            Topic: {{user_topic}}

            Tasks:
            1. Read the complete raw content
            2. Perform comprehensive editorial review:
               - Structural coherence and logical flow
               - Argument clarity and strength
               - Grammar, style, and tone consistency
               - Smooth transitions between sections
               - Strong introduction and conclusion
            3. Create the final polished essay
            4. Save final essay as: ${work_dir}/Final_Essay.md
            5. Ensure publication-ready quality

            Target audience: Educated general readers
            Style: Professional but accessible

    - id: prepare_message
      type: code
      data:
        title: 'Prepare Telegram Message'
        description: 'Read essay file and prepare message content'
        command: '/bin/bash'
        args:
          - '-c'
          - |
            set -euo pipefail
            echo "📱 Preparing Telegram message with essay content..."

            # Check if essay file exists
            ESSAY_FILE="${work_dir}/Final_Essay.md"
            if [ ! -f "$ESSAY_FILE" ]; then
              echo "⚠️ Essay file not found at $ESSAY_FILE"
              echo "📝 Creating basic completion message instead..."
              ESSAY_CONTENT="Essay completed but content file not available. Please check the workflow execution."
            else
              echo "✅ Reading essay content from $ESSAY_FILE"
              ESSAY_CONTENT=$(cat "$ESSAY_FILE")
              echo "📊 Essay loaded ($(echo "$ESSAY_CONTENT" | wc -w) words)"
            fi

            # Export for telegram node (note: this won't work as expected due to variable scoping)
            export ESSAY_CONTENT

    - id: telegram_delivery
      type: telegram
      data:
        title: 'Essay Delivery'
        description: 'Send completed essay via Telegram'
        message: |
          📝 **Essay Complete!** 

          **Topic**: {{user_topic}}
          **Date**: ${research_date}
          **Sections**: {{max_parts}}

          **Status**: Essay generation workflow completed successfully.

          **Note**: The complete essay has been saved to ${work_dir}/Final_Essay.md

          **Template Info**: This demonstrates the OpenCode Essay Template workflow with multi-agent collaboration (Research → Write → Edit → Deliver).

          **Next Steps**: Check the generated essay file for the complete content. Future versions will include full essay text in this message once file_content template variables are implemented in flowsh.

          🚀 Generated by flowsh OpenCode Essay Template
        parse_mode: 'HTML'

    - id: end
      type: end
      data:
        title: 'Essay Complete'

  edges:
    - source: start
      target: validate_env
    - source: validate_env
      target: research_planner
    - source: research_planner
      target: find_plan_files
    - source: find_plan_files
      target: content_iterator
    - source: content_iterator
      target: content_writer
    - source: content_writer
      target: editorial_agent
    - source: editorial_agent
      target: prepare_message
    - source: prepare_message
      target: telegram_delivery
    - source: telegram_delivery
      target: end
