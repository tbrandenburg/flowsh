workflow:
  name: 'OpenCode Essay Writing - Fixed Design'
  description: 'Multi-agent essay writing using files for data passing (no env variables from agents)'

conversation_variables:
  - variable: user_topic
    name: Essay Topic
    type: text-input
    description: What should the essay be about?
    required: true
  - variable: max_parts
    name: Content Sections
    type: select
    description: How many content sections to create?
    options:
      - value: '2'
        label: '2 sections (shorter essay)'
      - value: '3'
        label: '3 sections (standard essay)'
    default: '2'

graph:
  nodes:
    - id: start
      type: start
      data:
        title: 'Essay Writing Workflow'
        description: 'File-based multi-agent essay creation'

    - id: setup_workspace
      type: code
      data:
        title: 'Setup Workspace'
        description: 'Create working directory and set variables'
        command: '/bin/bash'
        args:
          - '-c'
          - |
            # Create fixed working directory
            work_dir="/tmp/flowsh_essay_work"
            mkdir -p "$work_dir"

            # Set workflow variables (these CAN be set by code nodes)
            echo "export work_dir=\"$work_dir\"" > "$work_dir/env.sh"
            echo "export topic=\"{{user_topic}}\"" >> "$work_dir/env.sh"
            echo "export max_parts=\"{{max_parts}}\"" >> "$work_dir/env.sh"
            echo "export research_date=\"$(date +%Y-%m-%d)\"" >> "$work_dir/env.sh"

            echo "✅ Workspace created: $work_dir"
            echo "📝 Topic: {{user_topic}}"
            echo "📊 Sections: {{max_parts}}"

    - id: research_agent
      type: agent
      data:
        title: 'Research Agent'
        command: 'opencode'
        args: ['run']
        timeout: 180
        prompt_template:
          type: prompt
          source: inline
          content: |
            You are a research specialist for the topic: "{{user_topic}}"

            Tasks:
            1. Research this topic using web search capabilities
            2. Create {{max_parts}} content section plans
            3. Save your research as structured files in /tmp/flowsh_essay_work/

            Required output files:
            - /tmp/flowsh_essay_work/research_summary.md (overall research findings)
            - /tmp/flowsh_essay_work/section_1.md (first section plan with key points)
            - /tmp/flowsh_essay_work/section_2.md (second section plan with key points)
            {{#if (eq max_parts "3")}}
            - /tmp/flowsh_essay_work/section_3.md (third section plan with key points)
            {{/if}}

            Each section file should contain:
            - Section title
            - Key research findings (3-4 bullet points)
            - Recommended structure
            - Target word count: 300-400 words

            Focus on current, authoritative sources and ensure accuracy.

    - id: verify_research
      type: code
      data:
        title: 'Verify Research Output'
        description: 'Check that research files were created'
        command: '/bin/bash'
        args:
          - '-c'
          - |
            source /tmp/flowsh_essay_work/env.sh
            echo "🔍 Checking research output..."
            ls -la /tmp/flowsh_essay_work/

            # Check required files exist
            if [[ ! -f "/tmp/flowsh_essay_work/research_summary.md" ]]; then
              echo "❌ Missing research_summary.md"
              exit 1
            fi

            section_count=0
            for i in {1..3}; do
              if [[ -f "/tmp/flowsh_essay_work/section_${i}.md" ]]; then
                ((section_count++))
              fi
            done

            echo "✅ Found $section_count section files"
            echo "✅ Research phase completed"

    - id: content_writer
      type: agent
      data:
        title: 'Content Writer Agent'
        command: 'opencode'
        args: ['run']
        timeout: 120
        prompt_template:
          type: prompt
          source: inline
          content: |
            You are a professional content writer.

            Topic: {{user_topic}}

            Tasks:
            1. Read ALL section plan files in /tmp/flowsh_essay_work/
            2. Write complete essay content based on the research
            3. Create cohesive, well-structured essay content
            4. Save final essay to: /tmp/flowsh_essay_work/complete_essay.md

            Requirements:
            - Use the research findings from section_*.md files
            - Create smooth transitions between sections
            - Include introduction and conclusion
            - Aim for {{max_parts}} main content sections
            - Professional, engaging writing style
            - Include sources/references where appropriate

            Output only the complete essay in markdown format to the specified file.

    - id: editorial_review
      type: agent
      data:
        title: 'Editorial Review Agent'
        command: 'opencode'
        args: ['run']
        timeout: 90
        prompt_template:
          type: prompt
          source: inline
          content: |
            You are a professional editor.

            Tasks:
            1. Read the complete essay: /tmp/flowsh_essay_work/complete_essay.md
            2. Perform editorial review and improvements
            3. Save the final polished version to: /tmp/flowsh_essay_work/final_essay.md

            Editorial focus:
            - Grammar, spelling, and punctuation
            - Clarity and readability
            - Logical flow and coherence
            - Professional tone
            - Consistent formatting

            Output the polished final essay to the specified file.

    - id: prepare_delivery
      type: code
      data:
        title: 'Prepare Final Message'
        description: 'Create Telegram message with essay'
        command: '/bin/bash'
        args:
          - '-c'
          - |
            source /tmp/flowsh_essay_work/env.sh

            # Read the final essay
            if [[ -f "/tmp/flowsh_essay_work/final_essay.md" ]]; then
              essay_content=$(cat /tmp/flowsh_essay_work/final_essay.md)
              word_count=$(wc -w < /tmp/flowsh_essay_work/final_essay.md)
            else
              echo "❌ Final essay not found"
              exit 1
            fi

            # Create delivery message (save to file for Telegram node)
            cat > /tmp/flowsh_essay_work/telegram_message.txt << EOF
            📝 **Essay Complete!**

            **Topic**: $topic
            **Date**: $research_date  
            **Word Count**: ~$word_count words
            **Sections**: $max_parts

            ---

            $essay_content
            EOF

            echo "✅ Essay prepared for delivery"
            echo "📊 Word count: $word_count"

    - id: telegram_delivery
      type: telegram
      data:
        title: 'Essay Delivery'
        description: 'Send completed essay via Telegram'
        message_file: '/tmp/flowsh_essay_work/telegram_message.txt'
        parse_mode: 'Markdown'
        max_retries: 3

    - id: cleanup
      type: code
      data:
        title: 'Cleanup Workspace'
        description: 'Clean up working files'
        command: '/bin/bash'
        args:
          - '-c'
          - |
            echo "🧹 Cleaning up workspace..."
            # Keep files for debugging in this test
            ls -la /tmp/flowsh_essay_work/
            echo "✅ Workflow completed successfully"

    - id: end
      type: end
      data:
        title: 'Complete'
        description: 'Essay writing workflow completed'

  edges:
    - source: start
      target: setup_workspace
    - source: setup_workspace
      target: research_agent
    - source: research_agent
      target: verify_research
    - source: verify_research
      target: content_writer
    - source: content_writer
      target: editorial_review
    - source: editorial_review
      target: prepare_delivery
    - source: prepare_delivery
      target: telegram_delivery
    - source: telegram_delivery
      target: cleanup
    - source: cleanup
      target: end
