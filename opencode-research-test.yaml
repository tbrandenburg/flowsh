workflow:
  name: 'OpenCode Research Test'
  description: 'Test OpenCode research capabilities'

graph:
  nodes:
    - id: start
      type: start

    - id: validate_opencode
      type: code
      data:
        title: 'Check OpenCode Availability'
        command: '/bin/bash'
        args:
          - '-c'
          - |
            if command -v opencode &> /dev/null; then
              echo "✅ OpenCode available at: $(which opencode)"
            else
              echo "❌ OpenCode not found in PATH"
              exit 1
            fi

    - id: research_test
      type: agent
      data:
        title: 'OpenCode Research Test'
        command: 'opencode'
        args: ['run']
        prompt_template:
          type: prompt
          source: inline
          content: |
            Conduct research on "The current state of AI coding assistants in 2025" and create a brief research summary.

            Your tasks:
            1. Use web search capabilities to find recent information about AI coding tools
            2. Focus on productivity statistics, popular tools, and current trends
            3. Create a concise summary (200-300 words)
            4. Include specific data points and sources when possible

            Output the research summary in markdown format.

    - id: telegram_result
      type: telegram
      data:
        title: 'Send Research Results'
        message: |
          🔬 OpenCode Research Test Complete!

          📝 Research Topic: AI Coding Assistants in 2025
          ⚡ Status: Research completed successfully

          Results:
          ${agent_output}

          🚀 This demonstrates OpenCode's research capabilities!
        parse_mode: 'HTML'

    - id: end
      type: end

  edges:
    - source: start
      target: validate_opencode
    - source: validate_opencode
      target: research_test
    - source: research_test
      target: telegram_result
    - source: telegram_result
      target: end
